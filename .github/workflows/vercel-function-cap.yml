name: vercel-function-cap

# 🧭 api/*.py 関数数のアーキテクチャガード (警告専用・非ブロッキング)。
#   2026-07-18 の Vercel Pro 化により、旧 Hobby 12個上限による「デプロイ全体失敗→本番凍結」
#   (過去3回事故: 74e2c5fb/216d9ac/d59461f) は解消済み。
#   現在このCIは「API ロジックは server/main.py (Railway) へ・api/*.py は Vercel 専用のみ」という
#   方針の逸脱を ::warning:: annotation で可視化するだけで、超過しても CI は緑のまま。
on:
  push:
    paths:
      - 'api/**'
      - 'scripts/check_vercel_function_cap.sh'
      - '.github/workflows/vercel-function-cap.yml'
  pull_request:
    paths:
      - 'api/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: api/*.py count advisory (architecture guard, non-blocking)
        run: bash scripts/check_vercel_function_cap.sh

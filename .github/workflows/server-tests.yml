name: server-tests

# 🖥️ server/main.py の回帰テスト。**ブロッキング**。
#
#   ★なぜ専用 workflow が要るのか (2026-08-18):
#     `scripts/health_check/test_*.py` は誰も呼んでいなかった。
#       - scripts/run_all_gates.py の探索は check*/verify*/validate*/audit*/qa*/*_gate だけで、
#         `test_*` は **マッチしない**。マッチしないので DEAD 判定にすら計上されない
#         (DEAD は「拾ったのに呼ばれていない」を見る仕組みのため)。
#       - material-gates.yml は sympy/fonttools/pymupdf/numpy しか入れないので、
#         仮に check_*.py へ改名して拾わせても fastapi/pydantic/psycopg が無く CRASH する。
#     結果 test_event_loop_blocking.py (2026-07-26 の本番502事故の回帰テスト) は
#     コミットされているのに **一度も自動実行されたことがなかった**。
#     CLAUDE.md が繰り返し戒めている「書いたのに誰も呼んでいない検査」そのもの。
#
#   ★本番に触れさせないための栓 (secrets を渡さないだけでは足りない):
#     test_event_loop_blocking.py は **uvicorn を実起動**する。main.py は起動30秒後に
#     post-deploy smoke test を仕掛けており、その合成 E2E は backend_base に
#     **ハードコードされた本番 URL** へ申込 POST を撃つ (secrets 不要で届いてしまう)。
#     そこで両テストが import 前に POST_DEPLOY_SMOKE_ENABLED=0 / MONITORING_ENABLED=0 /
#     DATABASE_URL="" を自分で設定する。ここでも env で二重に落としておく。
on:
  push:
    branches: [main]
    paths: &watched
      - 'server/**'
      - 'scripts/health_check/test_*.py'
      - '.github/workflows/server-tests.yml'
      # 合成監視が fix marker / リンクを照合している実ファイル。壊れたら検知したい。
      - 'lp.html'
      - 'checkout.html'
      - 'checkout.js'
      - 'analytics.js'
  pull_request:
    paths: *watched
  workflow_dispatch:

env:
  POST_DEPLOY_SMOKE_ENABLED: "0"
  MONITORING_ENABLED: "0"
  EXAM_QUESTIONS_ENABLED: "0"
  DATABASE_URL: ""
  STRIPE_SECRET_KEY: ""
  RESEND_API_KEY: ""
  ANTHROPIC_API_KEY: ""

concurrency:
  group: server-tests-${{ github.ref }}
  # main は本番デプロイ元なので打ち切らない (「本番に出たのに cancelled の commit」を作らない)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    # 回帰があると health が 17秒 × 5 回ブロックして伸びる。無限に待たない。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 🧷 ?v= 検査 (下) が push 前の commit と比較するために履歴を少し持つ (全履歴は PDF 込みで重い)
          fetch-depth: 50

      # 🧷 JS を変えたのに参照側 HTML の ?v= を上げていない commit を止める (2026-09-07)。
      #   vercel.json の no-cache は *.html だけで、据え置くと古い JS がキャッシュされた端末で新しい
      #   API/HTML と食い違う。直近の履歴では mypage.js の約半分・ceo.js の 6 割が漏れていた。
      #   依存不要 (git + python3 のみ) なので最初に回す。Railway の「Wait for CI」を有効にすると
      #   この検査に落ちた commit は本番に出なくなる。
      - name: JS キャッシュバスト (?v=) 検査
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/health_check/js_cache_bust.py "$BASE_SHA" "${{ github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      # モジュールレベルの import は fastapi/pydantic と標準ライブラリだけ (stripe/psycopg/fitz は
      # 遅延 import) だが、テストは init_db や _collect_health_snapshot まで実際に走らせるので、
      # 本番と同じ requirements をそのまま入れる (部分インストールは実行時に落ちる)。
      - name: 依存 (server/requirements.txt)
        run: python3 -m pip install --quiet -r server/requirements.txt

      # NameError の作り込みを push 前に落とす (CLAUDE.md / memory の pyflakes ゲート)
      # ★`pyflakes ... | grep -c "undefined name"` と書くと、**pyflakes 自体が落ちても**
      #   grep が 0 を印字してステップが緑になる (パスを間違えた・pyflakes が入っていない等)。
      #   CLAUDE.md が名指ししている「exit 0 なのに検査していない」型そのものなので、
      #   出力を一度ファイルに落として「pyflakes が正常に走ったか」を先に判定する。
      - name: undefined name が無いこと
        run: |
          python3 -m pip install --quiet pyflakes
          set +e
          python3 -m pyflakes server/main.py > /tmp/pyflakes.out 2> /tmp/pyflakes.err
          RC=$?
          set -e
          if [ -s /tmp/pyflakes.err ] || [ "$RC" -gt 1 ]; then
            echo "::error::pyflakes が正常に走っていません (rc=$RC)"
            cat /tmp/pyflakes.err
            exit 1
          fi
          if grep -q "invalid syntax" /tmp/pyflakes.out; then
            echo "::error::構文エラーで解析できていません"
            grep "invalid syntax" /tmp/pyflakes.out
            exit 1
          fi
          grep "undefined name" /tmp/pyflakes.out || true
          N=$(grep -c "undefined name" /tmp/pyflakes.out || true)
          echo "undefined name: $N 件 (pyflakes 全指摘 $(wc -l < /tmp/pyflakes.out) 件)"
          test "$N" -eq 0

      - name: イベントループ・ブロッキング回帰テスト
        run: python3 scripts/health_check/test_event_loop_blocking.py

      # 上が落ちてもこちらは必ず出す (片方の失敗でもう片方が読めないと診断できない)。
      # always() ではなく !cancelled(): cancel-in-progress で打ち切ったジョブを走らせ直さない。
      - name: E2E 合成監視 (誤報抑止 / 検知能力) 回帰テスト
        if: ${{ !cancelled() }}
        run: python3 scripts/health_check/test_synthetic_monitor_retry.py

      # 🎬 授業録画の自動割り当て API (CEO 画面のボタン)。**書き込む側**なので、
      #   dry-run が本当に書かないこと・二度押しで重複しないこと・取得失敗を
      #   「新着なし」にしないことまで見る (判定表そのものは material-gates が見る)。
      # ★httpx はここで入れる。fastapi.testclient が要求するが **テスト専用**なので
      #   server/requirements.txt には入れない (入れると Railway の本番イメージが
      #   テストのためだけに重くなる)。pyflakes と同じ扱い。
      #   ★入らなかったときに黙って飛ばさないこと。ここを `|| true` にすると
      #   「検査していないのに緑」になる (CLAUDE.md が名指ししている型)。
      - name: 授業録画 自動割り当て API 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_auto_assign_api.py

      # 📅 塾カレンダーの一括入力。**書き込む側**なので、dry-run が本当に書かないこと・
      #   同じ日を二重に入れないこと・エラーが1件でもあれば1件も書かないことを見る。
      #   ★曜日を返すことも固定する。塾長が日付の打ち間違いに気づける唯一の手がかり。
      - name: 塾カレンダー 一括入力 API 回帰テスト
        if: ${{ !cancelled() }}
        run: python3 scripts/health_check/test_calendar_bulk_api.py

      # 🔑 子供メール (student_email) を登録したら、子が**自分のアドレスで**ログインできること。
      #   LINE 連携や親アドレスの送信 cap が子宛の配信を飲み込んで「画面は成功・子には0通」に
      #   なる silent failure を止める。逆方向 (未確認アドレス・他生徒の親メールと衝突する
      #   アドレスには送らない) も同じテストで見る — 片方だけ直すと爆撃の踏み台に戻るため。
      - name: 子供メール ログイン経路 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_child_email_login.py

      # 📚 学習記録ダッシュボード改修 (2026-09-06): 記録の修正 (PATCH) / いいね・コメントの生徒への in-app 通知 /
      #   弱点の退役履歴 (30日で消える前に写す) / 合格スコアの日次再計算と残日数のライブ計算 / タイムラインの生徒絞込。
      #   **書き込む側**なので、他人の記録を直せないこと・通知が失敗してもリアクションが残ることまで見る。
      - name: 学習記録ダッシュボード 改修 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_study_log_improvements.py

      # 🔐 セキュリティ強化 (2026-09-07): 塾長画面の Stored XSS 封じ・XFF 偽装によるレート制限迂回・
      #   塾長ログインの総当たり上限・管理者トークンの一括失効・週次レポート API の fail-closed・
      #   開発用既定鍵での本番起動拒否・news 生成のレート制限。壊すと「外から攻められる穴」に戻る。
      - name: セキュリティ強化 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_security_hardening.py

      # 🩺 定期実行の失敗/停止と DB バックアップの可視化 (2026-09-07): 最後の実行が失敗した
      #   スケジューラが critical に乗ること・バックアップの停止検知と未設定の点検。
      - name: 定期実行の失敗検知 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_scheduler_alerting.py

      # 💳🎖 在籍/体験の母集団 (2026-09-07): 猶予期間中の past_due が配信・一覧から消えないこと、
      #   「体験中」「新規」「転換率」が本科/塾生アプリの承認で膨らまないこと、満了前キューの除外条件。
      - name: 在籍・体験の母集団 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_enrollment_cohorts.py

      # 🔐 Vercel 側 決済/メール API の総当たり対策 (2026-09-07): 9 本の _verify_admin が失敗回数で止まること、
      #   chat の ?admin_pw= が廃止されていること。
      - name: Vercel 管理 API 総当たり対策 回帰テスト
        if: ${{ !cancelled() }}
        run: python3 scripts/health_check/test_vercel_admin_guard.py

      # 🧹🗄️ events の保持期限 / /api/track のレート制限 / R2 バックアップの省メモリ dump (2026-09-07)
      - name: イベント掃除・計測制限・バックアップ dump 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_events_retention.py

      # 💳 Stripe webhook (1,200 行超・決済の入口) は従来テストが無く、push すると未検査のまま本番に出ていた。
      #   署名検証・event.id の先勝ち・invoice キーの dedup・生徒不一致の扱いを固定する。
      - name: Stripe webhook 署名/二重処理 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_stripe_webhook_idempotency.py

      # ⏪ 自動ロールバックが「履歴の強制書き換え」ではなく revert commit を fast-forward で積むこと (2026-09-07)。
      - name: 自動ロールバック (revert commit 方式) 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_auto_rollback_revert.py

      # 📊 ダッシュボードの数字 (2026-09-07): 弱点ヒートマップの分母 / ユニークセッションの水増し / 売上推移の新規本契約 /
      #   残日数の単一定義 / 週次集計の境界。
      - name: ダッシュボードの数字 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_dashboard_numbers.py

      # 📺 再生リストの登録/命名 API。**書き込む側**なので、URL をそのまま受けること・
      #   二度送っても増えないこと・読めない入力で半端な行を作らないことを見る。
      #   あわせて「名前 → どの授業に繋がるか」を正典 (class_recording_assign.slot_of) と
      #   突き合わせる。ここが独自判定に化けると「画面は繋がると言うのに実際は対象外」になる。
      - name: 再生リスト登録/命名 API 回帰テスト
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --quiet httpx
          python3 scripts/health_check/test_playlist_save_api.py

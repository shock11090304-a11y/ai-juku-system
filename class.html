<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f0f1e">
  <title>トリリオン塾生アプリ</title>
  <script src="cache-purge.js?v=20260625-juku-app"></script>
  <style>
    :root { --accent:#818cf8; --accent2:#a78bfa; --bg:#0f0f1e; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #0f0f1e, #1a1a2e); color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; margin: 0; padding-bottom: 72px; }
    a { color: #c4b5fd; }
    .appbar { display:flex; align-items:center; justify-content:space-between; padding:0.9rem 1.1rem; background:rgba(0,0,0,0.5); border-bottom:1px solid rgba(255,255,255,0.08); position:sticky; top:0; z-index:30; backdrop-filter:blur(8px); }
    .appbar .brand { font-size:1.02rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#818cf8); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .appbar .back { padding:0.4rem 0.8rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:#e4e4e7; text-decoration:none; font-size:0.78rem; font-weight:700; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .view-title { font-size:1.25rem; font-weight:800; margin:0.5rem 0 1rem; }
    .view-title .sub { display:block; font-size:0.8rem; font-weight:500; color:#a1a1aa; margin-top:0.2rem; }

    .notice { padding:1.2rem 1.3rem; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.35); border-radius:12px; line-height:1.7; }
    .notice h2 { margin:0 0 0.5rem; font-size:1.1rem; color:#fcd34d; }
    .notice.err { background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.40); }
    .notice.err h2 { color:#fca5a5; }
    .loading { text-align:center; color:#a1a1aa; padding:2.5rem; }
    .muted { color:#a1a1aa; font-size:0.82rem; }
    .empty { text-align:center; color:#a1a1aa; padding:2rem 1rem; line-height:1.7; }

    /* カード共通 */
    .card { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.10); border-radius:14px; padding:1rem 1.1rem; margin-bottom:0.9rem; }
    .chip { display:inline-block; padding:0.14rem 0.55rem; border-radius:999px; font-size:0.74rem; font-weight:800; }
    .chip-date { background:rgba(129,140,248,0.18); border:1px solid rgba(129,140,248,0.4); color:#c7d2fe; }
    .chip-subj { background:rgba(167,139,250,0.16); border:1px solid rgba(167,139,250,0.35); color:#ddd6fe; }
    .chip-topic { background:rgba(56,189,248,0.16); border:1px solid rgba(56,189,248,0.4); color:#bae6fd; }
    .chip-open { background:rgba(251,191,36,0.18); border:1px solid rgba(251,191,36,0.4); color:#fde68a; }
    .chip-done { background:rgba(16,185,129,0.18); border:1px solid rgba(16,185,129,0.4); color:#6ee7b7; }
    .chip-over { background:rgba(239,68,68,0.18); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; }
    .card-title { font-size:1.05rem; font-weight:800; margin:0.45rem 0 0.2rem; }
    .card-meta { color:#a1a1aa; font-size:0.82rem; }
    .card-body { margin-top:0.5rem; color:#cbd5e1; font-size:0.88rem; line-height:1.65; white-space:pre-wrap; }
    /* 🗓 週間時間割 */
    .tt-intro { color:#a1a1aa; font-size:0.8rem; margin:0.1rem 0 0.7rem; line-height:1.55; }
    .tt-day { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:0.7rem 0.85rem; margin-bottom:0.6rem; }
    .tt-day-h { display:inline-block; padding:0.12rem 0.65rem; border-radius:8px; background:rgba(129,140,248,0.20); border:1px solid rgba(129,140,248,0.42); color:#c7d2fe; font-weight:800; font-size:0.86rem; margin-bottom:0.3rem; }
    .tt-day.sun .tt-day-h { background:rgba(251,191,36,0.18); border-color:rgba(251,191,36,0.42); color:#fde68a; }
    .tt-row { display:flex; gap:0.55rem; align-items:baseline; padding:0.42rem 0; border-top:1px solid rgba(255,255,255,0.06); }
    .tt-row:first-of-type { border-top:0; }
    .tt-period { flex-shrink:0; min-width:2.2em; font-size:0.74rem; font-weight:800; color:#a5b4fc; }
    .tt-class { flex:1; min-width:0; font-size:0.9rem; font-weight:700; line-height:1.4; word-break:break-word; }
    .tt-class .tt-detail { display:block; font-size:0.74rem; color:#a1a1aa; font-weight:500; margin-top:0.05rem; }
    .tt-time { flex-shrink:0; font-size:0.72rem; color:#9ca3af; font-variant-numeric:tabular-nums; }
    .sec-divider { margin:1.5rem 0 0.7rem; font-size:0.95rem; font-weight:800; color:#e4e4e7; border-bottom:1px solid rgba(255,255,255,0.12); padding-bottom:0.35rem; }
    /* 📅 カレンダー */
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin:0.1rem 0 0.55rem; }
    .cal-title { font-weight:800; font-size:1.02rem; }
    .cal-nav { width:36px; height:36px; border-radius:9px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#e4e4e7; font-size:1.2rem; line-height:1; cursor:pointer; font-family:inherit; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .cal-wd { text-align:center; font-size:0.7rem; font-weight:700; color:#a1a1aa; padding:0.15rem 0; }
    .cal-wd.sun { color:#fca5a5; } .cal-wd.sat { color:#93c5fd; }
    .cal-cell { position:relative; aspect-ratio:1/1; min-height:38px; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; padding-top:0.2rem; overflow:hidden; }
    .cal-cell.empty { background:transparent; border:0; }
    .cal-cell .cal-d { font-size:0.8rem; font-weight:700; color:#e4e4e7; }
    .cal-cell.sun .cal-d { color:#fca5a5; } .cal-cell.sat .cal-d { color:#93c5fd; }
    .cal-cell.holiday { background:rgba(251,191,36,0.10); border-color:rgba(251,191,36,0.28); }
    .cal-cell.holiday .cal-d { color:#fcd34d; }
    .cal-cell.closed { background:rgba(239,68,68,0.20); border-color:rgba(239,68,68,0.48); }
    .cal-cell.closed .cal-d { color:#fecaca; }
    .cal-cell.today { box-shadow:0 0 0 2px #818cf8 inset; }
    .cal-tag { font-size:0.56rem; font-weight:800; line-height:1; margin-top:2px; padding:1px 3px; border-radius:4px; }
    .cal-tag.closed { background:#ef4444; color:#fff; }
    .cal-tag.hol { color:#fcd34d; }
    .cal-dot { width:5px; height:5px; border-radius:50%; background:#818cf8; margin-top:3px; }
    .cal-legend { display:flex; gap:0.9rem; flex-wrap:wrap; margin:0.55rem 0 0.2rem; font-size:0.74rem; color:#cbd5e1; }
    .cal-legend i.lg { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:0.25rem; vertical-align:middle; }
    .cal-legend i.lg.closed { background:#ef4444; } .cal-legend i.lg.event { background:#818cf8; } .cal-legend i.lg.hol { background:rgba(251,191,36,0.6); }
    .cal-list-h { font-size:0.8rem; font-weight:800; color:#a5b4fc; margin:0.65rem 0 0.25rem; }
    .cal-li { font-size:0.84rem; padding:0.22rem 0; display:flex; gap:0.5rem; line-height:1.4; }
    .cal-li-d { flex-shrink:0; font-weight:800; color:#c7d2fe; min-width:2.8em; font-variant-numeric:tabular-nums; }
    .block { margin-top:0.85rem; }
    .block-label { font-size:0.78rem; font-weight:800; color:#a5b4fc; margin-bottom:0.4rem; }
    .res-row { display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0.7rem; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.10); border-radius:9px; margin:0.35rem 0; }
    .res-icon { font-size:1.05rem; flex-shrink:0; }
    .res-name { flex:1; font-size:0.9rem; font-weight:600; min-width:0; word-break:break-word; }
    .res-sub { font-size:0.72rem; color:#a1a1aa; }

    .btn { display:inline-block; padding:0.5rem 0.95rem; border:none; border-radius:9px; font-weight:800; font-size:0.85rem; cursor:pointer; text-decoration:none; font-family:inherit; }
    .btn-primary { background:linear-gradient(135deg,#818cf8,#6366f1); color:#fff; }
    .btn-ghost { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#e4e4e7; }
    .btn-green { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }
    .btn:disabled { opacity:0.5; cursor:default; }
    .row-actions { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.8rem; }

    /* 出欠 */
    .att { margin-top:0.9rem; padding:0.8rem 0.9rem; background:rgba(99,102,241,0.08); border:1px solid rgba(99,102,241,0.28); border-radius:10px; }
    .att-row { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .att-btn { padding:0.5rem 1rem; border-radius:8px; border:1.5px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); color:#e4e4e7; font-weight:800; font-size:0.88rem; cursor:pointer; font-family:inherit; }
    .att-btn.sel-present { background:rgba(16,185,129,0.25); border-color:#10b981; color:#6ee7b7; }
    .att-btn.sel-absent { background:rgba(239,68,68,0.22); border-color:#ef4444; color:#fca5a5; }
    .att-btn.sel-late { background:rgba(251,191,36,0.20); border-color:#fbbf24; color:#fde68a; }
    .att-reason { margin-top:0.55rem; }
    .att-reason textarea, .compose textarea, .compose input { width:100%; box-sizing:border-box; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:#e4e4e7; padding:0.55rem; font-size:0.88rem; font-family:inherit; }
    .att-reason textarea { min-height:48px; }
    .att-status { margin-top:0.5rem; font-size:0.84rem; font-weight:700; }
    .att-saved { color:#6ee7b7; }

    /* 動画 */
    .video-wrap { position:relative; width:100%; padding-top:56.25%; margin-top:0.55rem; border-radius:10px; overflow:hidden; background:#000; }
    .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

    /* メッセージ */
    .msg { background:rgba(255,255,255,0.04); border-radius:10px; padding:0.8rem 0.9rem; margin-bottom:0.6rem; }
    .msg.in { border-left:3px solid #818cf8; }
    .msg.out { border-left:3px solid #34d399; }
    .msg.unread { background:rgba(129,140,248,0.10); }
    .msg-head { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; font-size:0.74rem; color:#a1a1aa; }
    .msg-from { font-weight:800; color:#c7d2fe; }
    .msg-from.out { color:#6ee7b7; }
    .msg-subj { font-weight:700; margin:0.3rem 0 0.2rem; font-size:0.92rem; }
    .msg-body { font-size:0.88rem; line-height:1.6; color:#e4e4e7; white-space:pre-wrap; }
    .compose { background:rgba(0,0,0,0.28); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:0.9rem; margin-bottom:1.2rem; }
    .compose label { display:block; font-size:0.74rem; color:#a1a1aa; margin:0.5rem 0 0.25rem; }

    /* タブバー */
    .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; background:rgba(10,10,22,0.96); border-top:1px solid rgba(255,255,255,0.10); backdrop-filter:blur(10px); padding-bottom:env(safe-area-inset-bottom); }
    .tabbar button { flex:1; background:none; border:0; color:#9ca3af; font-family:inherit; padding:0.5rem 0.2rem 0.55rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:0.15rem; position:relative; }
    .tabbar button .ic { font-size:1.25rem; line-height:1; }
    .tabbar button .lb { font-size:0.66rem; font-weight:700; }
    .tabbar button.active { color:#c4b5fd; }
    .tabbar button.active .ic { transform:translateY(-1px); }
    .tab-badge { position:absolute; top:0.15rem; right:50%; transform:translateX(1.2rem); min-width:16px; height:16px; padding:0 4px; box-sizing:border-box; background:#ec4899; color:#fff; border-radius:999px; font-size:0.62rem; font-weight:800; line-height:16px; text-align:center; display:none; }
    .tab-badge.show { display:block; }

    .toast { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:rgba(20,20,40,0.97); border:1px solid rgba(129,140,248,0.5); color:#e4e4e7; padding:0.7rem 1.1rem; border-radius:10px; font-size:0.88rem; font-weight:700; z-index:60; box-shadow:0 6px 24px rgba(0,0,0,0.5); opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show { opacity:1; } .toast.err { border-color:rgba(239,68,68,0.6); color:#fca5a5; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">📚 トリリオン塾生アプリ</div>
    <!-- 純粋な通塾生(is_tsujuku_app)には不要なので既定で非表示。AIプランも持つ生徒のみ feed 後に表示。 -->
    <a class="back" id="mypageLink" href="mypage.html" style="display:none;">マイページ</a>
  </header>

  <main class="wrap">
    <div id="gate"></div>

    <section id="view-schedule" class="view" hidden>
      <h1 class="view-title">📅 予定<span class="sub">週間の時間割と、授業ごとの配布ファイル・出欠の連絡</span></h1>
      <div id="scheduleBody"><div class="loading">読み込み中…</div></div>
    </section>

    <section id="view-homework" class="view" hidden>
      <h1 class="view-title">📝 宿題<span class="sub">出された宿題をアプリ内のドリルで解いて提出(自動採点)</span></h1>
      <div id="homeworkBody"><div class="loading">読み込み中…</div></div>
    </section>

    <section id="view-videos" class="view" hidden>
      <h1 class="view-title">🎬 動画アーカイブ<span class="sub">授業の録画をいつでも見返せます</span></h1>
      <div id="videosBody"><div class="loading">読み込み中…</div></div>
    </section>

    <section id="view-messages" class="view" hidden>
      <h1 class="view-title">💬 メッセージ<span class="sub">塾長に質問・連絡できます</span></h1>
      <div id="messagesBody"><div class="loading">読み込み中…</div></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="schedule" class="active"><span class="ic">📅</span><span class="lb">予定</span></button>
    <button data-tab="homework"><span class="ic">📝</span><span class="lb">宿題</span><span class="tab-badge" id="hwBadge"></span></button>
    <button data-tab="videos"><span class="ic">🎬</span><span class="lb">動画</span></button>
    <button data-tab="messages"><span class="ic">💬</span><span class="lb">メッセージ</span><span class="tab-badge" id="msgBadge"></span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="auth-guard.js?v=20260625-juku-app"></script>
  <script>
  (function () {
    const BACKEND_URL = (window.location.hostname === 'localhost' && window.location.port === '8090')
      ? 'http://localhost:8000' : window.location.origin;

    function token() {
      return (window.AuthGuard && window.AuthGuard.getToken && window.AuthGuard.getToken())
        || localStorage.getItem('ai_juku_session_token') || '';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function safeHref(u) {
      try { var p = new URL(u, location.href); return (p.protocol === 'http:' || p.protocol === 'https:') ? u : '#'; }
      catch (e) { return '#'; }
    }
    function fmtKB(b) { if (!b) return ''; var kb = b / 1024; return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB'; }
    function fmtDur(sec) { if (!sec) return ''; var m = Math.floor(sec / 60), s = sec % 60; return m + '分' + (s ? (' ' + s + '秒') : ''); }
    function fmtDate(s) { if (!s) return ''; return String(s).slice(0, 16).replace('T', ' '); }
    function ytId(url) {
      if (!url) return null;
      try {
        var u = new URL(url);
        if (u.hostname.indexOf('youtu.be') >= 0) return (u.pathname.slice(1).split('/')[0]) || null;
        if (u.hostname.indexOf('youtube.com') >= 0) {
          if (u.pathname.indexOf('/embed/') === 0) return u.pathname.split('/')[2] || null;
          if (u.pathname.indexOf('/shorts/') === 0) return u.pathname.split('/')[2] || null;
          return u.searchParams.get('v');
        }
      } catch (e) {}
      return null;
    }
    var _toastTimer = null;
    function toast(msg, isErr) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
      clearTimeout(_toastTimer); _toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
    }
    async function api(path, opts) {
      opts = opts || {};
      var headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      var tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
      var res = await fetch(BACKEND_URL + path, Object.assign({}, opts, { headers }));
      if (!res.ok) {
        var detail = '';
        try { var j = await res.json(); detail = (j && j.detail) || ''; } catch (e) {}
        var err = new Error(typeof detail === 'string' && detail ? detail : ('HTTP ' + res.status));
        err.status = res.status; throw err;
      }
      return res.json();
    }

    // ---------- state ----------
    var feedData = null, hwLoaded = false, msgLoaded = false;
    var TABS = ['schedule', 'homework', 'videos', 'messages'];

    function showTab(name) {
      TABS.forEach(function (t) {
        var v = document.getElementById('view-' + t);
        if (v) v.hidden = (t !== name);
      });
      Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); }
      if (name === 'homework' && !hwLoaded) loadHomework();
      if (name === 'messages' && !msgLoaded) loadMessages();
    }

    // ===================== 予定 (schedule) =====================
    var scheduleBody = document.getElementById('scheduleBody');

    // 🗓 週間時間割 (2026年度 授業スケジュール・入塾申込書より)。全通塾生に塾全体の時間割として表示。
    // 変更時はこの TIMETABLE を編集する (毎週くり返しの固定時間割)。
    var TIMETABLE = {
      year: '2026年度',
      weekdays: [
        { day: '月', items: [
          { p: '1限', t: '19:15–20:15', c: '中学応用', d: '受験・中3' },
          { p: '2限', t: '20:25–21:25', c: '英文法 Lv.1', d: '標準・高1/2' },
          { p: '3限', t: '21:35–22:35', c: '長文読解 Lv.1', d: '標準・高1/2' }
        ] },
        { day: '火', items: [
          { p: '1限', t: '19:15–20:15', c: '中学基礎', d: '定期テスト・中1/2' },
          { p: '2限', t: '20:25–21:25', c: '英文法 Lv.2', d: '難関・高3' },
          { p: '3限', t: '21:35–22:35', c: '長文読解 Lv.2', d: '難関・高3' }
        ] },
        { day: '水', items: [
          { p: '1限', t: '19:15–20:15', c: '中学2年 英語', d: '' },
          { p: '2限', t: '20:25–21:25', c: 'GMARCH', d: '大学別演習' },
          { p: '3限', t: '21:35–22:35', c: '国公立コース 英文法', d: '' }
        ] },
        { day: '木', items: [
          { p: '1限', t: '19:15–20:15', c: '英検準1級対策', d: '中高合同' },
          { p: '2限', t: '20:25–21:25', c: '早慶クラス', d: '大学別演習' },
          { p: '3限', t: '21:35–22:35', c: '国公立コース 長文読解', d: '' }
        ] },
        { day: '金', items: [
          { p: '1限', t: '19:15–20:15', c: '高2 英文法', d: '' },
          { p: '2限', t: '20:25–21:25', c: '英検2級対策', d: '中高合同' }
        ] }
      ],
      special: [
        { day: '日', label: '日曜 Special', t: '21:15–22:15', c: '高校国語', d: '現代文・古文' }
      ]
    };
    function ttRow(p, t, c, d) {

    // ===================== 📅 カレンダー (休塾日・特別予定・日本の祝日 自動) =====================
    function _pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function _ymd(y, m, d) { return y + '-' + _pad2(m) + '-' + _pad2(d); }
    function _ymdOf(dt) { return _ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
    // 日本の国民の祝日を年から自動計算 (春分/秋分=国立天文台式・ハッピーマンデー・振替休日・国民の休日)
    function jpHolidays(year) {
      var H = {};
      function set(m, d, name) { H[_ymd(year, m, d)] = name; }
      function nthMon(m, n) { var first = new Date(year, m - 1, 1).getDay(); return (1 + ((8 - first) % 7)) + (n - 1) * 7; }
      set(1, 1, '元日'); set(1, nthMon(1, 2), '成人の日');
      set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
      set(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '春分の日');
      set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日'); set(5, 5, 'こどもの日');
      set(7, nthMon(7, 3), '海の日'); set(8, 11, '山の日'); set(9, nthMon(9, 3), '敬老の日');
      set(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '秋分の日');
      set(10, nthMon(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
      // 国民の休日: 前後が祝日に挟まれた平日 (例: 2026/9/22)
      Object.keys(H).slice().forEach(function (k) {
        var mid = new Date(k + 'T00:00:00'); mid.setDate(mid.getDate() + 1);
        var aft = new Date(mid); aft.setDate(aft.getDate() + 1);
        var km = _ymdOf(mid);
        if (!H[km] && H[_ymdOf(aft)] && mid.getDay() !== 0 && mid.getDay() !== 6) H[km] = '国民の休日';
      });
      // 振替休日: 祝日が日曜なら、その後の最初の非祝日
      Object.keys(H).slice().sort().forEach(function (k) {
        var dt = new Date(k + 'T00:00:00');
        if (dt.getDay() === 0) { var sub = new Date(dt); do { sub.setDate(sub.getDate() + 1); } while (H[_ymdOf(sub)]); H[_ymdOf(sub)] = '振替休日'; }
      });
      return H;
    }

      try {
        var r = await api('/api/student/class/attendance', { method: 'POST', body: JSON.stringify({ session_id: Number(sess), status: st, reason: reason }) });
        allBtns.forEach(function (b) { b.className = 'att-btn att-set' + (b.getAttribute('data-st') === st ? ' sel-' + st : ''); });
        var se = wrap.querySelector('.att-status');
        if (se) { se.className = 'att-status att-saved'; se.textContent = '✓ 申告済み: ' + (r.label || st) + '（変更も可能）'; }
        toast('出欠を記録しました（' + (r.label || st) + '）');
      } catch (e) { toast(e.message || '記録に失敗しました', true); }
      finally { allBtns.forEach(function (b) { b.disabled = false; }); }
    }

    // ===================== 動画 (videos) =====================
    function renderVideos() {
      var body = document.getElementById('videosBody');
      var recs = [];
      ((feedData && feedData.sessions) || []).forEach(function (s) {
        (s.recordings || []).forEach(function (r) { recs.push({ rec: r, sess: s.title, date: s.session_date }); });
      });
      ((feedData && feedData.loose_recordings) || []).forEach(function (r) { recs.push({ rec: r, sess: null, date: null }); });
      if (!recs.length) { body.innerHTML = '<div class="empty">🎬 まだ録画はありません。<br>授業の録画が登録されるとここに並びます。</div>'; return; }
      body.innerHTML = recs.map(function (x, i) {
        var r = x.rec;
        var id = r.provider === 'youtube' ? ytId(r.video_url) : null;
        var dur = r.duration_sec ? (' ・ ' + esc(fmtDur(r.duration_sec))) : '';
        var ctx = x.sess ? ('<div class="card-meta">' + (x.date ? (esc(x.date) + ' ・ ') : '') + esc(x.sess) + '</div>') : '';
        var player;
        if (id) {
          player = '<button class="btn btn-ghost rec-toggle" data-yt="' + esc(id) + '" data-i="' + i + '">▶ 再生</button>'
            + '<div class="rec-player" data-pi="' + i + '" hidden></div>';
        } else {
          player = '<a class="btn btn-ghost" href="' + esc(safeHref(r.video_url)) + '" target="_blank" rel="noopener">↗ 開く</a>';
        }
        return '<div class="card"><div class="card-title" style="font-size:0.98rem;">🎬 ' + esc(r.title) + '<span class="res-sub">' + dur + '</span></div>'
          + ctx + '<div class="row-actions">' + player + '</div></div>';
      }).join('');
      body.querySelectorAll('.rec-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var pl = body.querySelector('.rec-player[data-pi="' + btn.getAttribute('data-i') + '"]');
          if (!pl) return;
          if (pl.hidden) {
            pl.innerHTML = '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/' + encodeURIComponent(btn.getAttribute('data-yt'))
              + '?rel=0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
            pl.hidden = false; btn.textContent = '■ 閉じる';
          } else { pl.innerHTML = ''; pl.hidden = true; btn.textContent = '▶ 再生'; }
        });
      });
    }

    // ===================== 宿題 (homework) =====================
    async function loadHomework() {
      var body = document.getElementById('homeworkBody');
      body.innerHTML = '<div class="loading">読み込み中…</div>';
      try {
        var d = await api('/api/student/homework');
        hwLoaded = true;
        renderHomework(d);
        updateBadge('hwBadge', (d.summary && d.summary.open) || 0);
      } catch (e) {
        if (e.status === 403) { body.innerHTML = '<div class="empty">この機能は通塾生のみ利用できます。</div>'; }
        else { body.innerHTML = '<div class="notice err"><h2>読み込みに失敗しました</h2>' + esc(e.message || '') + '</div>'; }
      }
    }
    function renderHomework(d) {
      var body = document.getElementById('homeworkBody');
      var items = (d && d.items) || [];
      if (!items.length) { body.innerHTML = '<div class="empty">📝 今は出ている宿題はありません。</div>'; return; }
      var today = new Date().toISOString().slice(0, 10);
      body.innerHTML = items.map(function (it) {
        var done = it.status === 'completed';
        var overdue = !done && it.due_date && it.due_date < today;
        var statusChip = done ? '<span class="chip chip-done">完了</span>'
          : (overdue ? '<span class="chip chip-over">期限切れ</span>' : '<span class="chip chip-open">未提出</span>');
        var subj = it.subject ? ' <span class="chip chip-subj">' + esc(it.subject) + '</span>' : '';
        var topicChip = it.topic ? ' <span class="chip chip-topic">🎯 ' + esc(it.topic) + '</span>' : '';
        var due = it.due_date ? ('<div class="card-meta">📅 期限: ' + esc(it.due_date) + '</div>') : '';
        // 宿題に単元(topic)があれば dojo-drill をその単元で自動起動 (?w_subject=&w_topic=)
        var qp = [];
        if (it.subject) qp.push('w_subject=' + encodeURIComponent(it.subject));
        if (it.topic) qp.push('w_topic=' + encodeURIComponent(it.topic));
        var drillUrl = 'dojo-drill.html' + (qp.length ? ('?' + qp.join('&')) : '');
        var actions = '<div class="row-actions">';
        if (!done) {
          actions += '<a class="btn btn-primary" href="' + esc(drillUrl) + '">📝 ドリルで解く</a>'
            + '<button class="btn btn-green hw-done" data-id="' + it.id + '">✓ 提出（完了）にする</button>';
        } else {
          actions += '<a class="btn btn-ghost" href="' + esc(drillUrl) + '">🔁 もう一度解く</a>';
        }
        actions += '</div>';
        return '<div class="card">' + statusChip + subj + topicChip + '<div class="card-title">' + esc(it.title || '宿題') + '</div>'
          + due + (it.description ? ('<div class="card-body">' + esc(it.description) + '</div>') : '')
          + (done && it.completed_at ? ('<div class="muted" style="margin-top:0.4rem;">提出: ' + esc(fmtDate(it.completed_at)) + '</div>') : '')
          + actions + '</div>';
      }).join('');
      body.querySelectorAll('.hw-done').forEach(function (btn) {
        btn.addEventListener('click', function () { completeHomework(btn); });
      });
    }
    async function completeHomework(btn) {
      var id = btn.getAttribute('data-id');
      btn.disabled = true; var orig = btn.textContent; btn.textContent = '送信中…';
      try {
        await api('/api/student/homework/' + id + '/complete', { method: 'POST', body: JSON.stringify({ student_note: '' }) });
        toast('提出しました！おつかれさま 🎉');
        hwLoaded = false; await loadHomework();
      } catch (e) { toast(e.message || '失敗しました', true); btn.disabled = false; btn.textContent = orig; }
    }

    // ===================== メッセージ (messages) =====================
    async function loadMessages() {
      var body = document.getElementById('messagesBody');
      if (!msgLoaded) body.innerHTML = '<div class="loading">読み込み中…</div>';
      try {
        var d = await api('/api/messages/me?limit=50');
        msgLoaded = true;
        renderMessages(d);
        updateBadge('msgBadge', d.unread_count || 0);
      } catch (e) {
        body.innerHTML = '<div class="notice err"><h2>読み込みに失敗しました</h2>' + esc(e.message || '') + '</div>';
      }
    }
    function renderMessages(d) {
      var body = document.getElementById('messagesBody');
      var msgs = (d && d.messages) || [];
      var compose = '<div class="compose">'
        + '<div class="block-label">✍️ 塾長にメッセージを送る</div>'
        + '<label>件名（任意）</label><input id="msgSubject" type="text" placeholder="例: 数学の宿題について">'
        + '<label>本文</label><textarea id="msgBody" style="min-height:70px;" placeholder="質問や連絡を書いてください"></textarea>'
        + '<div class="row-actions"><button class="btn btn-primary" id="msgSendBtn">送信</button></div></div>';
      var list = msgs.length ? msgs.map(function (m) {
        var out = m.direction === 'out';
        var who = out ? '自分 → 塾長' : '塾長';
        var att = m.attachment ? ('<div style="margin-top:0.5rem;"><button class="btn btn-ghost msg-att" data-id="' + m.id + '" data-fn="' + esc(m.attachment.filename || 'file') + '">📎 ' + esc(m.attachment.filename || '添付') + '</button></div>') : '';
        return '<div class="msg ' + (out ? 'out' : 'in') + (m.is_unread ? ' unread' : '') + '" data-id="' + m.id + '" data-unread="' + (m.is_unread ? 1 : 0) + '">'
          + '<div class="msg-head"><span class="msg-from ' + (out ? 'out' : '') + '">' + esc(who) + '</span><span>' + esc(fmtDate(m.created_at)) + '</span></div>'
          + (m.subject ? ('<div class="msg-subj">' + esc(m.subject) + '</div>') : '')
          + '<div class="msg-body">' + esc(m.body || '') + '</div>' + att + '</div>';
      }).join('') : '<div class="empty">まだメッセージはありません。上から送ってみましょう。</div>';
      body.innerHTML = compose + '<div class="block-label" style="margin-top:0.3rem;">📨 やりとり</div>' + list;

      document.getElementById('msgSendBtn').addEventListener('click', sendMessage);
      body.querySelectorAll('.msg-att').forEach(function (b) {
        b.addEventListener('click', function () { downloadMsgAttachment(b); });
      });
      // 受信した未読を既読化（best-effort）
      body.querySelectorAll('.msg[data-unread="1"]').forEach(function (el) {
        var id = el.getAttribute('data-id');
        api('/api/messages/me/' + id + '/read', { method: 'POST' }).then(function () {
          el.classList.remove('unread'); el.setAttribute('data-unread', '0');
        }).catch(function () {});
      });
      if (msgs.some(function (m) { return m.is_unread; })) updateBadge('msgBadge', 0);
    }
    async function sendMessage() {
      var btn = document.getElementById('msgSendBtn');
      var subject = (document.getElementById('msgSubject').value || '').trim();
      var bodyTxt = (document.getElementById('msgBody').value || '').trim();
      if (!bodyTxt) { toast('本文を入力してください', true); return; }
      btn.disabled = true; var orig = btn.textContent; btn.textContent = '送信中…';
      try {
        await api('/api/student/messages/send', { method: 'POST', body: JSON.stringify({ subject: subject, body: bodyTxt }) });
        document.getElementById('msgSubject').value = ''; document.getElementById('msgBody').value = '';
        toast('送信しました');
        msgLoaded = false; await loadMessages();
      } catch (e) { toast(e.message || '送信に失敗しました', true); }
      finally { btn.disabled = false; btn.textContent = orig; }
    }
    async function downloadMsgAttachment(btn) {
      var id = btn.getAttribute('data-id'), fn = btn.getAttribute('data-fn') || 'file';
      try {
        var res = await fetch(BACKEND_URL + '/api/messages/me/' + id + '/attachment', { headers: { 'Authorization': 'Bearer ' + token() } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var blob = await res.blob(); var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (e) { toast('添付の取得に失敗しました', true); }
    }

    function updateBadge(id, n) {
      var b = document.getElementById(id);
      if (!b) return;
      if (n > 0) { b.textContent = n > 99 ? '99+' : n; b.classList.add('show'); }
      else { b.textContent = ''; b.classList.remove('show'); }
    }

    // ---------- boot ----------
    function showAppChrome() {
      document.getElementById('tabbar').hidden = false;
    }
    async function boot() {
      var gate = document.getElementById('gate');
      try {
        feedData = await api('/api/student/class/feed');
      } catch (e) {
        if (e.status === 403) {
          gate.innerHTML = '<div class="notice"><h2>📚 通塾生専用アプリです</h2>'
            + 'このアプリは通塾生向けです。ご不明な点は塾長までお問い合わせください。'
            + '<div style="margin-top:0.9rem;"><a class="btn btn-ghost" href="mypage.html">← マイページに戻る</a></div></div>';
          return;
        }
        if (e.status === 401) { gate.innerHTML = '<div class="notice"><h2>ログインが必要です</h2><a class="btn btn-primary" href="login.html">ログイン</a></div>'; return; }
        gate.innerHTML = '<div class="notice err"><h2>⚠️ 読み込みに失敗しました</h2>' + esc(e.message || '')
          + '<div style="margin-top:0.7rem;"><button class="btn btn-ghost" onclick="location.reload()">再読み込み</button></div></div>';
        return;
      }
      // 認可OK → アプリ表示
      showAppChrome();
      // マイページ導線: 純粋な通塾生(is_tsujuku_app===true)には出さない(owner方針)。
      //   AIプランも持つ生徒(false)や旧バックエンド(undefined)では出す=AI管理へ戻れる。
      if (feedData && feedData.is_tsujuku_app !== true) {
        var _ml = document.getElementById('mypageLink'); if (_ml) _ml.style.display = '';
      }
      renderSchedule();
      renderVideos();
      showTab('schedule');
      // 塾長登録の休塾日/予定 + 自分の出欠を読み込んで再描画（祝日カレンダーは即表示済み）
      Promise.all([loadCalendar(), loadMyAttend()]).then(function () { renderSchedule(); });
      // バッジ（宿題未提出・メッセージ未読）を先読み
      api('/api/student/homework').then(function (d) { updateBadge('hwBadge', (d.summary && d.summary.open) || 0); }).catch(function () {});
      api('/api/messages/me/unread-count').then(function (d) { updateBadge('msgBadge', d.unread_count || 0); }).catch(function () {});
      // タブ
      Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
        b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
      });
    }
    boot();
  })();
  </script>
</body>
</html>

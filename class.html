<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f0f1e">
  <title>トリリオン塾生アプリ</title>
  <script src="cache-purge.js?v=20260721-inherit-notice"></script>
  <style>
    :root { --accent:#818cf8; --accent2:#a78bfa; --bg:#0f0f1e; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #0f0f1e, #1a1a2e); color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; margin: 0; padding-bottom: 72px; }
    a { color: #c4b5fd; }
    .appbar { display:flex; align-items:center; justify-content:space-between; padding:0.9rem 1.1rem; background:rgba(0,0,0,0.5); border-bottom:1px solid rgba(255,255,255,0.08); position:sticky; top:0; z-index:30; backdrop-filter:blur(8px); }
    .appbar .brand { font-size:1.02rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#818cf8); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .appbar .back { padding:0.4rem 0.8rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:#e4e4e7; text-decoration:none; font-size:0.78rem; font-weight:700; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .view-title { font-size:1.25rem; font-weight:800; margin:0.5rem 0 1rem; }
    .view-title .sub { display:block; font-size:0.8rem; font-weight:500; color:#a1a1aa; margin-top:0.2rem; }

    .notice { padding:1.2rem 1.3rem; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.35); border-radius:12px; line-height:1.7; }
    .notice h2 { margin:0 0 0.5rem; font-size:1.1rem; color:#fcd34d; }
    .notice.err { background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.40); }
    .notice.err h2 { color:#fca5a5; }
    .loading { text-align:center; color:#a1a1aa; padding:2.5rem; }
    .muted { color:#a1a1aa; font-size:0.82rem; }
    .empty { text-align:center; color:#a1a1aa; padding:2rem 1rem; line-height:1.7; }

    /* カード共通 */
    .card { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.10); border-radius:14px; padding:1rem 1.1rem; margin-bottom:0.9rem; }
    .chip { display:inline-block; padding:0.14rem 0.55rem; border-radius:999px; font-size:0.74rem; font-weight:800; }
    .chip-date { background:rgba(129,140,248,0.18); border:1px solid rgba(129,140,248,0.4); color:#c7d2fe; }
    .chip-subj { background:rgba(167,139,250,0.16); border:1px solid rgba(167,139,250,0.35); color:#ddd6fe; }
    .chip-topic { background:rgba(56,189,248,0.16); border:1px solid rgba(56,189,248,0.4); color:#bae6fd; }
    .chip-open { background:rgba(251,191,36,0.18); border:1px solid rgba(251,191,36,0.4); color:#fde68a; }
    .chip-done { background:rgba(16,185,129,0.18); border:1px solid rgba(16,185,129,0.4); color:#6ee7b7; }
    .chip-over { background:rgba(239,68,68,0.18); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; }
    .card-title { font-size:1.05rem; font-weight:800; margin:0.45rem 0 0.2rem; }
    .card-meta { color:#a1a1aa; font-size:0.82rem; }
    .card-body { margin-top:0.5rem; color:#cbd5e1; font-size:0.88rem; line-height:1.65; white-space:pre-wrap; }
    /* 🗓 週間時間割 */
    .tt-intro { color:#a1a1aa; font-size:0.8rem; margin:0.1rem 0 0.7rem; line-height:1.55; }
    .tt-day { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:0.7rem 0.85rem; margin-bottom:0.6rem; }
    .tt-day-h { display:inline-block; padding:0.12rem 0.65rem; border-radius:8px; background:rgba(129,140,248,0.20); border:1px solid rgba(129,140,248,0.42); color:#c7d2fe; font-weight:800; font-size:0.86rem; margin-bottom:0.3rem; }
    .tt-day.sun .tt-day-h { background:rgba(251,191,36,0.18); border-color:rgba(251,191,36,0.42); color:#fde68a; }
    .tt-row { display:flex; gap:0.55rem; align-items:baseline; padding:0.42rem 0; border-top:1px solid rgba(255,255,255,0.06); }
    .tt-row:first-of-type { border-top:0; }
    .tt-period { flex-shrink:0; min-width:2.2em; font-size:0.74rem; font-weight:800; color:#a5b4fc; }
    .tt-class { flex:1; min-width:0; font-size:0.9rem; font-weight:700; line-height:1.4; word-break:break-word; }
    .tt-class .tt-detail { display:block; font-size:0.74rem; color:#a1a1aa; font-weight:500; margin-top:0.05rem; }
    .tt-time { flex-shrink:0; font-size:0.72rem; color:#9ca3af; font-variant-numeric:tabular-nums; }
    .sec-divider { margin:1.5rem 0 0.7rem; font-size:0.95rem; font-weight:800; color:#e4e4e7; border-bottom:1px solid rgba(255,255,255,0.12); padding-bottom:0.35rem; }
    /* 📅 カレンダー */
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin:0.1rem 0 0.55rem; }
    .cal-title { font-weight:800; font-size:1.02rem; }
    .cal-nav { width:36px; height:36px; border-radius:9px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#e4e4e7; font-size:1.2rem; line-height:1; cursor:pointer; font-family:inherit; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .cal-wd { text-align:center; font-size:0.7rem; font-weight:700; color:#a1a1aa; padding:0.15rem 0; }
    .cal-wd.sun { color:#fca5a5; } .cal-wd.sat { color:#93c5fd; }
    .cal-cell { position:relative; aspect-ratio:1/1; min-height:38px; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; padding-top:0.2rem; overflow:hidden; }
    .cal-cell.empty { background:transparent; border:0; }
    .cal-cell .cal-d { font-size:0.8rem; font-weight:700; color:#e4e4e7; }
    .cal-cell.sun .cal-d { color:#fca5a5; } .cal-cell.sat .cal-d { color:#93c5fd; }
    .cal-cell.holiday { background:rgba(251,191,36,0.10); border-color:rgba(251,191,36,0.28); }
    .cal-cell.holiday .cal-d { color:#fcd34d; }
    .cal-cell.closed { background:rgba(239,68,68,0.20); border-color:rgba(239,68,68,0.48); }
    .cal-cell.closed .cal-d { color:#fecaca; }
    .cal-cell.today { box-shadow:0 0 0 2px #818cf8 inset; }
    .cal-tag { font-size:0.56rem; font-weight:800; line-height:1; margin-top:2px; padding:1px 3px; border-radius:4px; }
    .cal-tag.closed { background:#ef4444; color:#fff; }
    .cal-tag.hol { color:#fcd34d; }
    .cal-dot { width:5px; height:5px; border-radius:50%; background:#818cf8; margin-top:3px; }
    .cal-cell.event { background:rgba(129,140,248,0.15); border-color:rgba(129,140,248,0.42); }
    .cal-cell.event .cal-d { color:#c7d2fe; }
    .cal-ev { font-size:0.56rem; line-height:1.16; font-weight:700; color:#c7d2fe; margin-top:1px; padding:0 2px; width:100%; box-sizing:border-box; text-align:center; word-break:break-word; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
    .cal-legend { display:flex; gap:0.9rem; flex-wrap:wrap; margin:0.55rem 0 0.2rem; font-size:0.74rem; color:#cbd5e1; }
    .cal-legend i.lg { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:0.25rem; vertical-align:middle; }
    .cal-legend i.lg.closed { background:#ef4444; } .cal-legend i.lg.event { background:#818cf8; } .cal-legend i.lg.hol { background:rgba(251,191,36,0.6); }
    .cal-list-h { font-size:0.8rem; font-weight:800; color:#a5b4fc; margin:0.65rem 0 0.25rem; }
    .cal-li { font-size:0.84rem; padding:0.22rem 0; display:flex; gap:0.5rem; line-height:1.4; }
    .cal-li-d { flex-shrink:0; font-weight:800; color:#c7d2fe; min-width:2.8em; font-variant-numeric:tabular-nums; }
    .cal-li > span:not(.cal-li-d) { min-width:0; word-break:break-word; }
    .cal-note { margin:0.55rem 0 0.1rem; padding:0.5rem 0.7rem; background:rgba(129,140,248,0.12); border:1px solid rgba(129,140,248,0.32); border-radius:9px; font-size:0.8rem; line-height:1.5; font-weight:700; color:#c7d2fe; }
    .block { margin-top:0.85rem; }
    .block-label { font-size:0.78rem; font-weight:800; color:#a5b4fc; margin-bottom:0.4rem; }
    .res-row { display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0.7rem; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.10); border-radius:9px; margin:0.35rem 0; }
    .res-icon { font-size:1.05rem; flex-shrink:0; }
    .res-name { flex:1; font-size:0.9rem; font-weight:600; min-width:0; word-break:break-word; }
    .res-sub { font-size:0.72rem; color:#a1a1aa; }

    .btn { display:inline-block; padding:0.5rem 0.95rem; border:none; border-radius:9px; font-weight:800; font-size:0.85rem; cursor:pointer; text-decoration:none; font-family:inherit; }
    .btn-primary { background:linear-gradient(135deg,#818cf8,#6366f1); color:#fff; }
    .btn-ghost { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#e4e4e7; }
    .btn-green { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }
    .btn:disabled { opacity:0.5; cursor:default; }
    .row-actions { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.8rem; }

    /* 📝 自動採点ドリル (科目別 単元ドリル = grammar_drill)。宿題タブ内で解答→即採点まで完結する。 */
    .gd-head { margin-bottom:0.9rem; }
    .gd-q { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:0.85rem 0.95rem; margin-bottom:0.75rem; }
    .gd-q.unanswered { border-color:rgba(251,191,36,0.65); box-shadow:0 0 0 1px rgba(251,191,36,0.35); }
    .gd-no { font-size:0.74rem; font-weight:800; color:#a5b4fc; }
    .gd-stem { font-size:0.95rem; font-weight:700; line-height:1.65; margin:0.3rem 0 0.6rem; white-space:pre-wrap; word-break:break-word; }
    /* 📖 長文型ドリルの本文 (1 本文に複数設問)。本文は 1 回だけ出す。太字にしない (壁のような文字にならないように) */
    .gd-passage { background:rgba(129,140,248,0.07); border:1px solid rgba(129,140,248,0.32); border-radius:12px; padding:0.9rem 1rem; margin:0.4rem 0 0.8rem; font-size:0.93rem; line-height:1.8; white-space:pre-wrap; word-break:break-word; }
    .gd-passage .gd-ptitle { font-weight:800; color:#c7d2fe; margin-bottom:0.45rem; font-size:0.9rem; }
    .gd-passage .gd-blank { font-weight:800; color:#fde68a; }
    .gd-passage details { margin-top:0.6rem; } .gd-passage summary { cursor:pointer; color:#a5b4fc; font-size:0.82rem; }
    .gd-passage .gd-ja { margin-top:0.4rem; color:#cbd5e1; font-size:0.86rem; line-height:1.7; }
    /* 📊 本文の表 (取込仕様 §2「［表］」+「｜」・2026-10-17)。スマホでは列を折り返さず横にスクロールする (折り返すと列がずれる) */
    .gd-passage .gd-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; margin:0.3rem 0; }
    .gd-passage .gd-table { border-collapse:collapse; font-size:0.8rem; line-height:1.45; }
    .gd-passage .gd-table th, .gd-passage .gd-table td { border:1px solid rgba(165,180,252,0.35); padding:0.28rem 0.6rem; white-space:nowrap; text-align:left; vertical-align:top; }
    .gd-passage .gd-table th { background:rgba(129,140,248,0.18); color:#c7d2fe; font-weight:700; }
    /* タップ領域は 44pt 以上を確保 (スマホで押しにくいと誤タップが増える) */
    .gd-choice { display:flex; gap:0.55rem; align-items:flex-start; padding:0.7rem 0.65rem; margin:0.32rem 0; background:rgba(0,0,0,0.22); border:1px solid rgba(255,255,255,0.10); border-radius:9px; font-size:0.9rem; line-height:1.5; cursor:pointer; word-break:break-word; }
    div.gd-choice { cursor:default; }   /* 復習表示 (label でなく div) は押せないので手の形にしない */
    .gd-choice input { margin:0.15rem 0 0; flex-shrink:0; width:19px; height:19px; accent-color:#818cf8; }
    .gd-choice.sel { background:rgba(129,140,248,0.16); border-color:rgba(129,140,248,0.5); }
    .gd-choice.ok { background:rgba(16,185,129,0.16); border-color:rgba(16,185,129,0.5); color:#6ee7b7; }
    .gd-choice.ng { background:rgba(239,68,68,0.14); border-color:rgba(239,68,68,0.45); color:#fca5a5; }
    .gd-mark { flex-shrink:0; font-weight:800; }
    .gd-exp { margin-top:0.55rem; padding:0.6rem 0.7rem; background:rgba(129,140,248,0.10); border:1px solid rgba(129,140,248,0.28); border-radius:9px; font-size:0.84rem; line-height:1.65; color:#cbd5e1; white-space:pre-wrap; word-break:break-word; }
    .gd-score { text-align:center; padding:1rem 0.9rem; margin-bottom:1rem; background:linear-gradient(135deg,rgba(129,140,248,0.18),rgba(167,139,250,0.10)); border:1px solid rgba(129,140,248,0.42); border-radius:14px; }
    .gd-score .n { display:block; font-size:2rem; font-weight:800; color:#c7d2fe; line-height:1.2; }
    .gd-msg { text-align:center; color:#fca5a5; font-size:0.84rem; font-weight:700; min-height:1.2em; margin:0.3rem 0 0.6rem; }
    .gd-submit-wrap { text-align:center; margin-bottom:0.6rem; }

    /* 出欠 */
    .att { margin-top:0.9rem; padding:0.8rem 0.9rem; background:rgba(99,102,241,0.08); border:1px solid rgba(99,102,241,0.28); border-radius:10px; }
    .att-row { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .att-btn { padding:0.5rem 1rem; border-radius:8px; border:1.5px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); color:#e4e4e7; font-weight:800; font-size:0.88rem; cursor:pointer; font-family:inherit; }
    .att-btn.sel-present { background:rgba(16,185,129,0.25); border-color:#10b981; color:#6ee7b7; }
    .att-btn.sel-absent { background:rgba(239,68,68,0.22); border-color:#ef4444; color:#fca5a5; }
    .att-btn.sel-late { background:rgba(251,191,36,0.20); border-color:#fbbf24; color:#fde68a; }
    .att-reason { margin-top:0.55rem; }
    .att-reason textarea, .compose textarea, .compose input { width:100%; box-sizing:border-box; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:#e4e4e7; padding:0.55rem; font-size:0.88rem; font-family:inherit; }
    .att-reason textarea { min-height:48px; }
    .att-status { margin-top:0.5rem; font-size:0.84rem; font-weight:700; }
    .att-saved { color:#6ee7b7; }

    /* 動画 */
    /* 再生ボタンと同じ .row-actions(flex) 内にあるため、幅指定が無いとプレーヤーが潰れて高さ0になる。
       全幅で自分の行に折り返させて 16:9 の枠を確保する。 */
    .rec-player { flex-basis:100%; width:100%; }
    .video-wrap { position:relative; width:100%; padding-top:56.25%; margin-top:0.55rem; border-radius:10px; overflow:hidden; background:#000; }
    .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

    /* メッセージ */
    .msg { background:rgba(255,255,255,0.04); border-radius:10px; padding:0.8rem 0.9rem; margin-bottom:0.6rem; }
    .msg.in { border-left:3px solid #818cf8; }
    .msg.out { border-left:3px solid #34d399; }
    .msg.unread { background:rgba(129,140,248,0.10); }
    .msg-head { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; font-size:0.74rem; color:#a1a1aa; }
    .msg-from { font-weight:800; color:#c7d2fe; }
    .msg-from.out { color:#6ee7b7; }
    .msg-subj { font-weight:700; margin:0.3rem 0 0.2rem; font-size:0.92rem; }
    .msg-body { font-size:0.88rem; line-height:1.6; color:#e4e4e7; white-space:pre-wrap; }
    .compose { background:rgba(0,0,0,0.28); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:0.9rem; margin-bottom:1.2rem; }
    .compose label { display:block; font-size:0.74rem; color:#a1a1aa; margin:0.5rem 0 0.25rem; }

    /* タブバー */
    .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; background:rgba(10,10,22,0.96); border-top:1px solid rgba(255,255,255,0.10); backdrop-filter:blur(10px); padding-bottom:env(safe-area-inset-bottom); }
    .tabbar button { flex:1; background:none; border:0; color:#9ca3af; font-family:inherit; padding:0.5rem 0.2rem 0.55rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:0.15rem; position:relative; }
    .tabbar button .ic { font-size:1.25rem; line-height:1; }
    .tabbar button .lb { font-size:0.66rem; font-weight:700; }
    .tabbar button.active { color:#c4b5fd; }
    .tabbar button.active .ic { transform:translateY(-1px); }
    .tab-badge { position:absolute; top:0.15rem; right:50%; transform:translateX(1.2rem); min-width:16px; height:16px; padding:0 4px; box-sizing:border-box; background:#ec4899; color:#fff; border-radius:999px; font-size:0.62rem; font-weight:800; line-height:16px; text-align:center; display:none; }
    .tab-badge.show { display:block; }
    /* 🆕 新しい宿題のお知らせ (2026-10-15 塾長決定「アプリを開けば分かる」: 宿題のお知らせは LINE でなくアプリの中で)。
       宿題タブ以外の画面の上に出す帯 (押すと宿題タブ)。押しやすい高さ (44px 以上)・色はタブのバッジと同じピンク */
    .hw-notice { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; width:100%; box-sizing:border-box; min-height:44px; margin:0 0 0.9rem; padding:0.6rem 0.9rem; background:rgba(236,72,153,0.14); border:1px solid rgba(236,72,153,0.55); border-radius:12px; color:#fbcfe8; font-family:inherit; font-size:0.92rem; font-weight:800; line-height:1.45; text-align:left; cursor:pointer; }
    .hw-notice .hw-notice-go { flex-shrink:0; font-size:0.8rem; color:#f9a8d4; }
    .hw-notice.warn { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.5); color:#fecaca; }
    .hw-notice.warn .hw-notice-go { color:#fca5a5; }
    /* ⏰ 〆今日 の帯とチップ (2026-10-18 塾長「②の残りも作っておいて」)。〆を過ぎた = 赤 (warn / chip-over)・〆今日 = 橙 */
    .hw-notice.soon { background:rgba(251,146,60,0.12); border-color:rgba(251,146,60,0.55); color:#fed7aa; }
    .hw-notice.soon .hw-notice-go { color:#fdba74; }
    .chip-soon { background:rgba(251,146,60,0.20); border:1px solid rgba(251,146,60,0.55); color:#fed7aa; }
    .chip-new { background:rgba(236,72,153,0.20); border:1px solid rgba(236,72,153,0.55); color:#fbcfe8; }
    /* 💾 単元ドリルの途中保存 (2026-10-18)。一覧のカードの「💾 途中 4/10」 */
    .chip-draft { background:rgba(20,184,166,0.18); border:1px solid rgba(20,184,166,0.5); color:#99f6e4; }

    /* 📺 今週見るスタサプ: 講座名 (1 行で省略記号) と「第N講「題名」」(2 行まで) を分ける = スマホでも第N講が切れない。
       nowrap は使わない (長い題名が画面幅を押し広げない。日本語はどこでも折れる) */
    .sp-card { border-color:rgba(251,113,133,0.35); background:rgba(251,113,133,0.06); }
    .sp-card .card-title { margin-top:0; font-size:0.98rem; }
    .sp-row { margin-top:0.45rem; padding-top:0.45rem; border-top:1px solid rgba(255,255,255,0.07); min-width:0; }
    .sp-row:first-of-type { border-top:0; padding-top:0; }
    .sp-subj { font-size:0.72rem; color:#fda4af; font-weight:800; }

    function safeHref(u) {

    function fmtKB(b) { if (!b) return ''; var kb = b / 1024; return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB'; }
    function fmtDur(sec) { if (!sec) return ''; var m = Math.floor(sec / 60), s = sec % 60; return m + '分' + (s ? (' ' + s + '秒') : ''); }
    function ytId(url) {
      if (!url) return null;

    // 帯の文言と色は hw-notice.js の banner() (新しい宿題 / 〆を過ぎた / 〆今日)。〆の帯は「見た」に関係なく未提出が残るあいだ出し続ける

    function ttRow(p, t, c, d) {

    // ===================== 📅 カレンダー (休塾日・特別予定・日本の祝日 自動) =====================
    function _pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function _ymd(y, m, d) { return y + '-' + _pad2(m) + '-' + _pad2(d); }
    function _ymdOf(dt) { return _ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
    // 日本の国民の祝日を年から自動計算 (春分/秋分=国立天文台式・ハッピーマンデー・振替休日・国民の休日)
    function jpHolidays(year) {
      var H = {};
      function set(m, d, name) { H[_ymd(year, m, d)] = name; }
      function nthMon(m, n) { var first = new Date(year, m - 1, 1).getDay(); return (1 + ((8 - first) % 7)) + (n - 1) * 7; }
      set(1, 1, '元日'); set(1, nthMon(1, 2), '成人の日');
      set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
      set(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '春分の日');
      set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日'); set(5, 5, 'こどもの日');
      set(7, nthMon(7, 3), '海の日'); set(8, 11, '山の日'); set(9, nthMon(9, 3), '敬老の日');
      set(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '秋分の日');
      set(10, nthMon(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
      // 国民の休日: 前後が祝日に挟まれた平日 (例: 2026/9/22)
      Object.keys(H).slice().forEach(function (k) {
        var mid = new Date(k + 'T00:00:00'); mid.setDate(mid.getDate() + 1);
        var aft = new Date(mid); aft.setDate(aft.getDate() + 1);
        var km = _ymdOf(mid);

      });
      // 振替休日: 祝日が日曜なら、その後の最初の非祝日
      Object.keys(H).slice().sort().forEach(function (k) {
        var dt = new Date(k + 'T00:00:00');
        if (dt.getDay() === 0) { var sub = new Date(dt); do { sub.setDate(sub.getDate() + 1); } while (H[_ymdOf(sub)]); H[_ymdOf(sub)] = '振替休日'; }
      });
      return H;
    }
    var calEvents = {};   // 'YYYY-MM-DD' -> { kind:'closed'|'event', title }
    // 取得状態。未取得・失敗のまま「休塾日はありません」と断言すると誤情報になるので3値で持つ
    var calLoadState = 'loading';   // 'loading' | 'ok' | 'error'
    // 多重発火ガードは飛行中の Promise ごと持つ。boolean のロックだと、応答が返らないまま固まったときに

    var calInflight = null;

    var calY, calM;
    (function () { var n = new Date(); calY = n.getFullYear(); calM = n.getMonth() + 1; })();

            ? '<div class="notice err" style="margin:0 0 0.55rem;"><h2>⚠️ 予定を読み込めませんでした</h2>' + esc(GD_NET_MSG)
            + '<div style="text-align:center;margin-top:0.7rem;"><button class="btn btn-ghost cal-reload">🔄 再読み込み</button></div></div>'
            : '<div class="muted" style="padding:0 0 0.45rem;">休塾日・予定を読み込み中…</div>')
        + '<div class="cal-head"><button class="cal-nav" id="calPrev" aria-label="前の月">‹</button>'
        + '<div class="cal-title">' + calY + '年 ' + calM + '月</div>'
        + '<button class="cal-nav" id="calNext" aria-label="次の月">›</button></div>'
        // 0.55 = 「明らかに薄い」と分かりつつ日付のコントラストが AA (4.9:1) を保てる濃度。
        // error は再取得が成功するまで解除されないので、読めなくなるほど薄くしてはいけない。
        + '<div class="cal-grid"' + (pending ? ' style="opacity:0.55;"' : '') + '>';
      wd.forEach(function (w, i) { h += '<div class="cal-wd' + (i === 0 ? ' sun' : '') + (i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
      for (var b = 0; b < startDow; b++) h += '<div class="cal-cell empty"></div>';
      for (var day = 1; day <= daysIn; day++) {
        var key = _ymd(calY, calM, day);
        var dow = new Date(calY, calM - 1, day).getDay();
        var ev = calEvents[key], hn = hol[key];
        var cls = 'cal-cell';
        if (key === todayK) cls += ' today';
        if (ev && ev.kind === 'closed') cls += ' closed';
        else if (ev && ev.kind === 'event') cls += ' event';
        else if (hn) cls += ' holiday';
        if (dow === 0) cls += ' sun'; if (dow === 6) cls += ' sat';
        var mark = '';
        if (ev && ev.kind === 'closed') mark = '<span class="cal-tag closed">休</span>';
        else if (ev && ev.kind === 'event') mark = '<span class="cal-ev">' + esc(ev.title || '予定') + '</span>';
        else if (hn) mark = '<span class="cal-tag hol">祝</span>';
        h += '<div class="' + cls + '"><span class="cal-d">' + day + '</span>' + mark + '</div>';
      }
      h += '</div>';
      // 凡例は盤面の色の意味を説明するもの = 盤面が確定してから出す
      if (!pending) h += '<div class="cal-legend"><span><i class="lg closed"></i>休塾日</span><span><i class="lg event"></i>予定</span><span><i class="lg hol"></i>祝日</span></div>';
      var items = [], hasNatsuki = false;
      for (var dd = 1; dd <= daysIn; dd++) {
        var k = _ymd(calY, calM, dd), e = calEvents[k], hnm = hol[k];
        // closed は原則「🔴 休塾日」。title があれば理由 (例: お盆休塾) を併記する
        if (e && e.kind === 'closed') items.push({ d: dd, t: '🔴 休塾日' + (e.title ? '（' + esc(e.title) + '）' : '') });
        else if (e && e.kind === 'event') {
          items.push({ d: dd, t: '📌 ' + esc(e.title || '予定') });
          if (/夏期講習/.test(e.title || '')) hasNatsuki = true;
        }
        if (hnm) items.push({ d: dd, t: '🎌 ' + esc(hnm) });
      }
      // 一覧も同様。未確定のうちは出さない (祝日はクライアント計算なので items は非空になり得るが、
      // それを出すと「休塾日は無い」と読めてしまう)。告知は上の pending ブロックで出済み。
      if (!pending) {
        if (items.length) {
          items.sort(function (a, b) { return a.d - b.d; });
          h += '<div class="cal-list-h">今月の休塾日・予定</div>'
            + items.map(function (it) { return '<div class="cal-li"><span class="cal-li-d">' + calM + '/' + it.d + '</span><span>' + it.t + '</span></div>'; }).join('');
        } else {
          h += '<div class="muted" style="padding:0.45rem 0;">今月の休塾日・予定はありません。</div>';
        }
      }
      if (hasNatsuki) h += '<div class="cal-note">📌 夏期講習中も、通常授業（週間時間割）はこれまで通りあります。</div>';
      return h;
    }

    // ===================== 🙋 今日の出欠 (クラス×日付・自己申告) =====================
    var attendMine = {};   // 'YYYY-MM-DD|label' -> { status, source }
    var _DAY2DOW = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
    async function loadMyAttend() {
      try {
        var d = await api('/api/student/class/attend');
        attendMine = {};
        (d.records || []).forEach(function (r) { attendMine[r.date + '|' + r.class_label] = { status: r.status, source: r.source }; });
      } catch (e) { attendMine = {}; }
    }
    // 指定曜日(0=日..6=土)の授業一覧を時間割から。受講クラス設定済みならその所属だけに絞る(未設定=全表示の移行フォールバック)。
    function _classesForDow(dow) {
      var out = [];
      TIMETABLE.weekdays.forEach(function (wd) {
        if (_DAY2DOW[wd.day] === dow) wd.items.forEach(function (it) { out.push({ label: wd.day + '曜' + it.p + ' ' + it.c, time: it.t, title: it.c }); });
      });
      TIMETABLE.special.forEach(function (sp) { if (_DAY2DOW[sp.day] === dow) out.push({ label: sp.day + '曜 ' + sp.c, time: sp.t, title: sp.c }); });
      var my = (feedData && feedData.my_classes) || [];
      if (my.length) out = out.filter(function (c) { return my.indexOf(c.label) >= 0; });
      return out;
    }
    function todayClasses() { return _classesForDow(new Date().getDay()); }
    function todayAttendHtml() {
      var classes = todayClasses();
      if (!classes.length) return '';   // 今日は授業がない曜日
      var now = new Date(), dateStr = _ymdOf(now);
      var lbl = { present: '出席', absent: '欠席', late: '遅刻' };
      var h = '<div class="block-label" style="font-size:0.95rem; margin-bottom:0.3rem;">🙋 今日の出欠（' + (now.getMonth() + 1) + '/' + now.getDate() + '）</div>'
        + '<div class="tt-intro">本日のクラスの出欠を申告してください。</div>';
      classes.forEach(function (c) {
        var rec = attendMine[dateStr + '|' + c.label];
        var cur = rec && rec.status, byAdmin = rec && rec.source === 'admin';
        var mk = function (st, label) {
          return '<button class="att-btn att2-set' + (cur === st ? ' sel-' + st : '') + '" data-label="' + esc(c.label)
            + '" data-date="' + dateStr + '" data-st="' + st + '"' + (byAdmin ? ' disabled' : '') + '>' + label + '</button>';
        };
        var statusLine = byAdmin ? '<div class="att-status att-saved">🏫 塾長が記録: ' + esc(lbl[cur] || cur) + '</div>'
          : (cur ? '<div class="att-status att-saved">✓ 申告済み: ' + esc(lbl[cur] || cur) + '（変更も可能）</div>'
            : '<div class="att-status muted">まだ申告していません</div>');
        h += '<div class="card" style="padding:0.75rem 0.85rem;"><div style="font-weight:700; font-size:0.93rem;">' + esc(c.title)
          + ' <span class="muted" style="font-weight:500;">' + esc(c.time) + '</span></div>'
          + '<div class="att-row" style="margin-top:0.55rem;">' + mk('present', '出席') + mk('absent', '欠席') + mk('late', '遅刻') + '</div>'
          + statusLine + '</div>';
      });
      return '<div class="sec-divider">🙋 今日の出欠</div>' + h;
    }
    // 🗓 これからの出欠（事前連絡）: 明日から14日間、所属クラスの授業日を日付ごとに出し、欠席/遅刻を前もって申告できる。
    //   受講クラス未設定の生徒には出さない（全クラス羅列＝受講しないコマへの誤申告を防ぐ。今日の出欠は移行fallbackで従来通り）。
    var _WDJP = ['日', '月', '火', '水', '木', '金', '土'];
    function upcomingAttendHtml() {
      var my = (feedData && feedData.my_classes) || [];
      if (!my.length) return '';   // 受講クラス未設定なら事前連絡は出さない
      var lbl = { present: '出席', absent: '欠席', late: '遅刻' };
      var base = new Date(); base.setHours(0, 0, 0, 0);
      var groups = [];
      for (var i = 1; i <= 14; i++) {
        var dt = new Date(base); dt.setDate(base.getDate() + i);
        var key = _ymdOf(dt);
        var ev = calEvents[key];
        if (ev && ev.kind === 'closed') continue;   // 休塾日はスキップ
        if (beforeStart() && key.slice(0, 7) < feedData.start_month) continue;   // 📅 受講開始月より前の日付は出さない
        var cls = _classesForDow(dt.getDay());
        if (cls.length) groups.push({ date: key, dt: dt, classes: cls });
      }
      if (!groups.length) return '';
      var h = '<div class="sec-divider">🗓 これからの出欠（事前連絡）</div>'
        + '<div class="tt-intro">先の授業について、欠席・遅刻を前もって連絡できます（あとから変更も可能）。</div>';
      groups.forEach(function (g) {
        h += '<div class="block-label" style="font-size:0.9rem; margin:0.9rem 0 0.3rem;">'
          + (g.dt.getMonth() + 1) + '/' + g.dt.getDate() + '（' + _WDJP[g.dt.getDay()] + '）</div>';
        g.classes.forEach(function (c) {
          var rec = attendMine[g.date + '|' + c.label];
          var cur = rec && rec.status, byAdmin = rec && rec.source === 'admin';
          var mk = function (st, label) {
            return '<button class="att-btn att2-set' + (cur === st ? ' sel-' + st : '') + '" data-label="' + esc(c.label)
              + '" data-date="' + g.date + '" data-st="' + st + '"' + (byAdmin ? ' disabled' : '') + '>' + label + '</button>';
          };
          var statusLine = byAdmin ? '<div class="att-status att-saved">🏫 塾長が記録: ' + esc(lbl[cur] || cur) + '</div>'
            : (cur ? '<div class="att-status att-saved">✓ 連絡済み: ' + esc(lbl[cur] || cur) + '（変更も可能）</div>'
              : '<div class="att-status muted">未連絡</div>');
          h += '<div class="card" data-att-verb="連絡済み" style="padding:0.7rem 0.8rem;"><div style="font-weight:700; font-size:0.9rem;">' + esc(c.title)
            + ' <span class="muted" style="font-weight:500;">' + esc(c.time) + '</span></div>'
            + '<div class="att-row" style="margin-top:0.5rem;">' + mk('present', '出席') + mk('absent', '欠席') + mk('late', '遅刻') + '</div>'
            + statusLine + '</div>';
        });
      });
      return h;
    }
    async function reportAttend2(btn) {
      if (btn.disabled) return;
      var label = btn.getAttribute('data-label'), date = btn.getAttribute('data-date'), st = btn.getAttribute('data-st');
      var card = btn.closest('.card'), all = card.querySelectorAll('.att2-set');
      all.forEach(function (b) { b.disabled = true; });
      var locked = false;
      try {
        var r = await api('/api/student/class/attend', { method: 'POST', body: JSON.stringify({ class_label: label, att_date: date, status: st }) });
        if (r.locked) { locked = true; toast('塾長が記録済みのため変更できません', true); }
        else {
          attendMine[date + '|' + label] = { status: st, source: 'self' };
          all.forEach(function (b) { b.className = 'att-btn att2-set' + (b.getAttribute('data-st') === st ? ' sel-' + st : ''); });
          var se = card.querySelector('.att-status');
          if (se) { se.className = 'att-status att-saved'; se.textContent = '✓ ' + (card.getAttribute('data-att-verb') || '申告済み') + ': ' + (r.label || st) + '（変更も可能）'; }
          toast('出欠を記録しました（' + (r.label || st) + '）');
        }
      } catch (e) { toast(e.message || '記録に失敗しました', true); }
      finally { if (!locked) all.forEach(function (b) { b.disabled = false; }); }
    }

    function sessionHtml(s) {
      var date = s.session_date ? esc(s.session_date) : '日付未定';
      var time = [s.start_time, s.end_time].filter(Boolean).join('〜');
      var meta = [];
      if (time) meta.push('🕐 ' + esc(time));
      if (s.location) meta.push('📍 ' + esc(s.location));
      var subj = s.subject ? ' <span class="chip chip-subj">' + esc(s.subject) + '</span>' : '';
      var h = '<div class="card"><div><span class="chip chip-date">' + date + '</span></div>'
        + '<div class="card-title">' + esc(s.title) + subj + '</div>';
      if (meta.length) h += '<div class="card-meta">' + meta.join(' ・ ') + '</div>';
      if (s.notes) h += '<div class="card-body">' + esc(s.notes) + '</div>';
      if (s.files && s.files.length) {
        h += '<div class="block"><div class="block-label">📄 配布ファイル</div>'
          + s.files.map(fileRow).join('') + '</div>';
      }
      if (s.recordings && s.recordings.length) {
        h += '<div class="block"><div class="block-label">🎬 録画</div>'
          + '<div class="muted">「動画」タブでまとめて視聴できます（このコマ: ' + s.recordings.length + '本）</div></div>';
      }
      // 📅 受講開始月より前の授業には出欠ボタンを出さない (サーバも 400 で断る)。日付未定・開始月以降の授業は従来どおり。
      var _pre = beforeStart() && s.session_date && String(s.session_date).slice(0, 7) < feedData.start_month;
      h += _pre ? '<div class="att-status muted">🙋 出欠の連絡は受講開始（' + esc(monthLabel(feedData.start_month)) + '）の授業から</div>' : attendanceHtml(s);
      h += '</div>';
      return h;
    }
    // 📎 [file-open-link 2026-09-04 塾長報告「送ったPDFが開けないことがある」]
    //   従来の「fetch → blob → <a download> を JS でクリック」は iPhone/iPad の Safari や LINE 内ブラウザで
    //   無反応・白紙・開けないファイルになることがある。open_url (短命トークン付き) が来ていれば
    //   **普通のリンクを新しいタブで開く** = 端末の PDF ビューアで確実に開く。無ければ従来ボタン (旧API互換)。
    function fileRow(f) {
      var sub = f.file_size ? ('<span class="res-sub"> ・ ' + esc(fmtKB(f.file_size)) + '</span>') : '';
      var action = f.open_url
        ? '<a class="btn btn-primary file-open" href="' + esc(BACKEND_URL + f.open_url) + '" target="_blank" rel="noopener" data-id="' + f.id + '">' + fileOpenLabel(f.mime) + '</a>'
        : '<button class="btn btn-primary file-dl" data-id="' + f.id + '" data-fn="' + esc(f.filename || f.title) + '">⬇ 取得</button>';
      return '<div class="res-row"><span class="res-icon">📄</span>'
        + '<span class="res-name">' + esc(f.title) + sub + '</span>' + action + '</div>';
    }
    // 📎 クラス別 配布ファイル (時間割クラスごと・全通塾生に表示)
    function labeledFilesHtml() {
      var lf = (feedData && feedData.labeled_files) || [];
      if (!lf.length) return '';
      var groups = {}, order = [];
      lf.forEach(function (f) {
        var k = f.class_label || 'その他';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(f);
      });
      var h = '<div class="sec-divider">📎 クラス別 配布ファイル</div>';
      order.forEach(function (k) {
        h += '<div class="card"><div class="card-title" style="font-size:0.98rem;">' + esc(k) + '</div>'
          + groups[k].map(fileRow).join('') + '</div>';
      });
      return h;
    }
    function attendanceHtml(s) {
      var cur = s.my_attendance && s.my_attendance.status;
      var mk = function (st, label) {
        return '<button class="att-btn att-set' + (cur === st ? ' sel-' + st : '')
          + '" data-sess="' + s.id + '" data-st="' + st + '">' + label + '</button>';
      };
      var reasonVal = (s.my_attendance && s.my_attendance.reason) ? esc(s.my_attendance.reason) : '';
      var statusLine = cur
        ? '<div class="att-status att-saved">✓ 申告済み: ' + esc({ present: '出席', absent: '欠席', late: '遅刻' }[cur] || cur) + '（変更も可能）</div>'
        : '<div class="att-status muted">まだ申告していません</div>';
      return '<div class="att" data-sess-wrap="' + s.id + '"><div class="block-label">🙋 出欠の連絡</div>'
        + '<div class="att-row">' + mk('present', '出席') + mk('absent', '欠席') + mk('late', '遅刻') + '</div>'
        + '<div class="att-reason"><textarea data-reason="' + s.id + '" placeholder="（任意）欠席・遅刻の理由や連絡">' + reasonVal + '</textarea></div>'
        + statusLine + '</div>';
    }
    // 📅 [2026-09-24] 'YYYY-MM' → '2026年10月'
    function monthLabel(m) {
      var mm = /^(\d{4})-(\d{2})$/.exec(String(m || ''));
      return mm ? (Number(mm[1]) + '年' + Number(mm[2]) + '月') : '';
    }
    function beforeStart() { return !!(feedData && feedData.before_start === true && feedData.start_month); }
    function renderSchedule() {
      var sessions = (feedData && feedData.sessions) || [];
      var lf = (feedData && feedData.loose_files) || [];
      var parts = [];
      if (beforeStart()) {
        // 📅 受講開始前 (翌月開始を先に承認した生徒): 出欠は出さない。予定表・配信されたドリル・メッセージは使える。
        parts.push('<div class="notice" style="margin-bottom:0.9rem;"><h2>📅 受講開始は ' + esc(monthLabel(feedData.start_month)) + ' です</h2>'
          + 'それまでも、予定表・塾長から配信されたドリル・メッセージは使えます。<br>'
          + '出欠の連絡は ' + esc(monthLabel(feedData.start_month)) + ' の授業から、この画面でできます。'
          + '授業の録画は ' + esc(monthLabel(feedData.start_month)) + ' 以降の授業分が「🎬 動画」タブに並びます。</div>');
        // 🗓 開始月の授業 (例: 9月末に 10/1〜 の分) は前もって欠席/遅刻を連絡できる (upcomingAttendHtml が開始前の日付を飛ばす)
        parts.push(upcomingAttendHtml());
      } else {
        // 🙋 今日の出欠（今日のクラスがある時のみ）
        parts.push(todayAttendHtml());
        // 🗓 これからの出欠（事前連絡・受講クラス設定済みの生徒のみ）
        parts.push(upcomingAttendHtml());
      }
      // 📅 カレンダー（休塾日・特別予定・祝日）
      parts.push(calendarHtml());
      // 🗓 週間時間割（常時表示）
      parts.push(timetableHtml());
      // 📎 クラス別 配布ファイル（あれば）
      parts.push(labeledFilesHtml());
      // 📅 個別の授業（日付つき・プリント配布/録画/出欠）
      parts.push('<div class="sec-divider">📅 個別の授業（配布物・出欠）</div>');
      var indiv = [];
      if (sessions.length) indiv.push(sessions.map(sessionHtml).join(''));
      if (lf.length) {
        indiv.push('<div class="block-label" style="margin-top:1rem;">🗂️ その他の配布ファイル</div>'
          + '<div class="card">' + lf.map(fileRow).join('') + '</div>');
      }
      if (!indiv.length) indiv.push('<div class="empty" style="padding:1.4rem 1rem;">この先の個別授業（プリント配布・録画・出欠）はまだありません。</div>');
      parts.push(indiv.join(''));
      scheduleBody.innerHTML = parts.join('');
      wireSchedule();
    }
    // 📎 open_url のトークンは 30 分で失効する。ページを開きっぱなしにして後で押した場合に備え、
    //   期限が近ければリンク遷移を止めて feed を取り直し、新しい URL を同じタブで開く
    //   (await の後の window.open は Safari のポップアップ制限で止まるため location.assign を使う)。
    function dlStale() {
      var ttl = (feedData && feedData.dl_ttl_seconds) || 1800;
      return !feedLoadedAt || (Date.now() - feedLoadedAt) > (ttl - 120) * 1000;
    }
    async function openFileFresh(a) {
      var id = a.getAttribute('data-id');
      try {
        feedData = await api('/api/student/class/feed'); feedLoadedAt = Date.now();
        var all = [].concat(feedData.loose_files || [], feedData.labeled_files || []);
        (feedData.sessions || []).forEach(function (s) { all = all.concat(s.files || []); });
        // 取り直したトークンで画面上の全リンクを張り直す (押した1本だけだと他のファイルが古いURLのまま残る)
        var byId = {};
        all.forEach(function (x) { if (x.open_url) byId[String(x.id)] = x.open_url; });
        scheduleBody.querySelectorAll('a.file-open').forEach(function (x) {
          var u = byId[String(x.getAttribute('data-id'))];
          if (u) x.href = BACKEND_URL + u;
        });
        if (byId[String(id)]) { location.assign(BACKEND_URL + byId[String(id)]); return; }
      } catch (e) {}
      toast('ファイルを開けませんでした。アプリを閉じて開き直してください', true);
    }
    function wireSchedule() {
      scheduleBody.querySelectorAll('button.file-dl').forEach(function (btn) {
        btn.addEventListener('click', function () { downloadFile(btn); });
      });
      scheduleBody.querySelectorAll('a.file-open').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          if (dlStale()) { ev.preventDefault(); openFileFresh(a); }
        });
      });
      scheduleBody.querySelectorAll('.att-set').forEach(function (btn) {
        btn.addEventListener('click', function () { reportAttendance(btn); });
      });
      scheduleBody.querySelectorAll('.att2-set').forEach(function (btn) {
        btn.addEventListener('click', function () { reportAttend2(btn); });
      });
      var pv = document.getElementById('calPrev'), nx = document.getElementById('calNext');
      if (pv) pv.addEventListener('click', function () { changeMonth(-1); });
      if (nx) nx.addEventListener('click', function () { changeMonth(1); });

    async function downloadFile(btn) {
      var id = btn.getAttribute('data-id'), fn = btn.getAttribute('data-fn') || 'lesson_file';

      try {

        if (!res.ok) throw new Error('HTTP ' + res.status);
        var blob = await res.blob(); var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

      finally { btn.disabled = false; btn.textContent = orig; }

    // ===================== 宿題 (homework) =====================
    // 宿題タブには 2 系統が同居する:
    //   (A) クラス宿題 homework_assignments … 塾長が「クラスに宿題を出す」で配布。dojo-drill へのリンク。
    //   (B) 科目別 単元ドリル grammar_drill  … 塾長が CEO「科目別 単元ドリル」で配信。固定N問・サーバ採点。
    // (B) は AI 管理の生徒(mypage)と同じ機構で、2026-07-31 に塾生アプリでも解けるようにした。
    var gdDrills = [];          // (B) の一覧。取得失敗時は [] だが gdFailed=true で「0件」と区別する。
    var gdFailed = false;

    // 宿題とドリルを並行取得。★ドリル側が落ちても宿題の表示は続ける (取得失敗 ≠ 0件)。
    function _settle(p) { return p.then(function (d) { return { ok: true, d: d }; }, function (e) { return { ok: false, e: e }; }); }
    // 未提出のドリル = completed 以外 (2026-10-15: 提出 API と同じ。デスクトップの予約タスクが書く 'assigned' も未提出。
    //   以前は 'open' だけを見ていて、'assigned' のドリルが「完了」と表示され、バッジにも数えられていなかった)。
    //   判定は hw-notice.js と 1 か所 (読めない端末でも同じ規則に倒す)
    function gdIsOpen(x) { return window.AJHwNotice ? window.AJHwNotice.isOpenDrill(x) : (!!x && x.status !== 'completed'); }
    function gdOpenCount() { return gdDrills.filter(gdIsOpen).length; }
    // 生の "Failed to fetch" 等を生徒に見せない
    var GD_NET_MSG = '通信できませんでした。電波の良い場所でもう一度おためしください。';
    function gdErrMsg(e) {
      var m = (e && e.message) || '';
      // 403 はサーバが「AI機能はご利用いただけません」と返すが、塾生アプリの生徒には意味不明。
      // (静的が先に反映されて API がまだ旧版のときに起きる。数十秒で解消する)
      if (e && e.status === 403) return 'いまは開けませんでした。少し待ってから、もう一度おためしください。';
      // ★status で判定する。FastAPI 既定の 500 は detail が "Internal Server Error" なので
      //   文字列判定だけだと英語のまま生徒に出る (同じ障害で日本語と英語が混在した)
      if (e && e.status >= 500) return GD_NET_MSG;
      if (!m || /failed to fetch|networkerror|load failed/i.test(m)) return GD_NET_MSG;
      return m;
    }

    async function loadHomework() {
      var body = document.getElementById('homeworkBody');
      hwListShown = true;   // 宿題タブは一覧 (読み込み中を含む)。ドリル・解答用紙を開くと false
      body.__hsCtl = null;  // 解答用紙の画面はもう出ていない (提出の返事が後から来ても一覧を描き替えない)
      body.innerHTML = '<div class="loading">読み込み中…</div>';
      var r = await Promise.all([
        _settle(api('/api/student/homework')),
        _settle(api('/api/student/grammar-drills'))
      ]);
      var hwRes = r[0], gdRes = r[1];
      // ★403 は「まだ API が旧版 (AIなし枠ゲートに /grammar-drill が未登録)」でも起きる。
      //   静的(Vercel 数秒)が API(Railway ~1分)より先に反映されるので、その窓でエラー扱いにすると
      //   ドリル0件の生徒にまで赤バナーが出る → 403 は静かに「0件」とみなす。
      gdFailed = !gdRes.ok && !(gdRes.e && gdRes.e.status === 403);
      gdDrills = gdRes.ok ? ((gdRes.d && gdRes.d.items) || []) : [];
      if (!hwRes.ok) {
        var e = hwRes.e;
        if (e.status === 403) {
          // 宿題 API は通塾生コースの生徒だけ (403 = コース外)。単元ドリルは誰にでも配れるので、
          // 配られたドリルがあればドリルだけ出す (2026-10-15: 帯とバッジがドリルを数えるのに、開くと行き止まりだった)
          if (!gdDrills.length) { body.innerHTML = '<div class="empty">この機能は通塾生のみ利用できます。</div>'; return; }
          hwLoaded = true;
          hwRenderAndMark({ items: [] }, null, []);
          updateBadge('hwBadge', gdOpenCount());
          return;
        }
        // 宿題APIが落ちても、取得できたドリルは出す (片方の失敗で両方消えるのを防ぐ)
        // ★hwLoaded は true にする: false のままだとタブを移動して戻った瞬間に showTab が
        //   loadHomework() を再実行し、解答中のドリルを確認なしで捨ててしまう (戻るconfirmの迂回路)
        hwLoaded = true;
        hwRenderAndMark({ items: [] }, gdErrMsg(e), null);
        // ★両方落ちたときはバッジを触らない (未提出があるのに 0 に見えるのを防ぐ)
        if (gdRes.ok) updateBadge('hwBadge', gdOpenCount());
        return;
      }
      hwLoaded = true;
      hwRenderAndMark(hwRes.d, null, (hwRes.d && hwRes.d.items) || []);
      // ★ドリルが取れなかったときはバッジを更新しない (0件と誤って「宿題なし」に見えるのを防ぐ。
      //   古い数字が残るほうが、未提出を見落とすより安全)
      if (!gdFailed) updateBadge('hwBadge', ((hwRes.d.summary && hwRes.d.summary.open) || 0) + gdOpenCount());
    }
    // 🆕 一覧を描く前に「新しい」を数えてカードに 🆕 新着を付け、描いた後に「見た」と記録する (2026-10-15)。
    //   hwItems: 取れた宿題の一覧 (403 = コース外は [])・取れなかったら null。ドリルは gdFailed なら null。
    //   取れなかった一覧は記録を変えない (失敗で「新しい」を消したり作ったりしない)
    var hwLastHwItems = null;   // 帯を数え直すための、最後に取れた宿題の一覧 (取れなかったら null)
    function hwRenderAndMark(d, errMsg, hwItems) {
      var drills = gdFailed ? null : gdDrills;
      hwLastHwItems = hwItems;
      hwNotice = hwComputeNotice(drills, hwItems);
      hwNewDrill = (hwNotice && hwNotice.newDrillMap) || {};
      hwNewHw = (hwNotice && hwNotice.newHwMap) || {};
      renderHomework(d, errMsg);
      if (window.AJHwNotice) {
        try { window.AJHwNotice.markSeen(hwSid(), drills, hwItems); } catch (e) { /* 記録できなくても表示は続ける */ }
        hwNotice = hwComputeNotice(drills, hwItems);
      }
      renderHwNotice();
    }
    // ⏰ 提出した直後 (一覧を読み直す前) に帯を数え直す: 出したドリル / 宿題を完了として数える
    //   (結果の画面から宿題タブ以外へ直接移っても、出したものの 〆 の帯が残らない。一覧に戻れば読み直しで正しい数になる)
    function hwNoticeAfterSubmit(hwDoneId) {
      try {
        var hw = hwLastHwItems ? hwLastHwItems.map(function (h) {
          return (hwDoneId != null && h && String(h.id) === String(hwDoneId)) ? Object.assign({}, h, { status: 'completed' }) : h;
        }) : null;
        hwNotice = hwComputeNotice(gdFailed ? null : gdDrills, hw);
        if (hwDoneId != null) hwLastHwItems = hw;
      } catch (e) { /* 数え直せなくても提出は済んでいる */ }
    }
    function _reloadBtn() { return '<div style="text-align:center;margin-top:0.7rem;"><button class="btn btn-ghost hw-reload">🔄 再読み込み</button></div>'; }
    function _errBox(title, msg) { return '<div class="notice err" style="margin-bottom:0.9rem;"><h2>⚠️ ' + esc(title) + '</h2>' + esc(msg) + _reloadBtn() + '</div>'; }
    function renderHomework(d, errMsg) {
      var body = document.getElementById('homeworkBody');
      var items = (d && d.items) || [];
      var openDrills = gdDrills.filter(gdIsOpen);
      var doneDrills = gdDrills.filter(function (x) { return !gdIsOpen(x); });
      // ★両方落ちたときに同じ赤い箱と再読み込みボタンを2つ並べない (どっちを押すのか分からなくなる)
      var errBox = (errMsg && gdFailed) ? _errBox('読み込めませんでした', GD_NET_MSG)
        : errMsg ? _errBox('宿題を読み込めませんでした', errMsg)
          : gdFailed ? _errBox('ドリルを読み込めませんでした', GD_NET_MSG) : '';
      if (!items.length && !gdDrills.length) {
        // ★読み込みに失敗しているときに「ありません」と言い切らない (生徒が1行目だけ読んで離脱する)
        body.innerHTML = errBox
          + (errBox ? '' : '<div class="empty">📝 今は出ている宿題はありません。<br>新しい宿題やドリルが出るとここに届きます。</div>');
        _wireReload(body);
        return;
      }
      // ★期限切れは JST の今日で判定する (サーバの summary.overdue・hw-notice.js と同じ)。以前は toISOString = UTC の日付で、
      //   0:00〜9:00 の間は「昨日が期限」の宿題が期限切れにならなかった (2026-10-18)
      var today = jstToday();
      // 📄 添付プリントを開くボタンは、サーバに POST /api/student/homework/{id}/print があるとき (print_open) だけ出す
      var canOpenPrint = !!(d && d.print_open === true);
      // 📝 記号の解答用紙 (2026-10-18) は、サーバに解答用紙の表があるとき (answer_sheet_ready) だけ。一覧を控えて「答える」で開く
      hwSheetReady = !!(d && d.answer_sheet_ready === true);
      hwPrintOpen = canOpenPrint;
      hwItemsById = {};
      items.forEach(function (it) { if (it && it.id != null) hwItemsById[String(it.id)] = it; });
      var hwHtml = items.map(function (it) {
        var sheetSt = hwSheetState(it);
        // 解答用紙の宿題も「提出 = completed」(やり直しで open に戻る)。数え方は hw-notice.js・サーバの summary と同じ
        var done = it.status === 'completed';
        // ⏰ 〆 (2026-10-18): 未提出は「未提出」+「〆今日」/「〆を過ぎました」(JST の今日・判定と文言は hw-notice.js と 1 か所)
        var statusChip = (done ? '<span class="chip chip-done">完了</span>' : '<span class="chip chip-open">未提出</span>')
          + (done ? '' : gdDueChip(it.due_date, today));
        if (sheetSt === 'submitted') {
          var sc = window.AJHwSheet.scoreText(it.answer_sheet);
          if (sc) statusChip += ' <span class="chip chip-topic">' + esc(sc) + '</span>';
          if (it.answer_sheet.late) statusChip += ' <span class="chip chip-over">期限後</span>';
        }
        if (!done && hwIsNew(hwNewHw, it.id)) statusChip += ' <span class="chip chip-new">🆕 新着</span>';
        // 科目 'chugaku' は中学(高校受験)ドリルへの内部キー。生の chugaku を生徒に見せない。
        // 単元チップが「中学英語 …」等で始まるときは科目チップが重複するだけなので出さない。
        // (ラベルは週次プリントの subjJa と同じ規約: chugaku → 中学)
        var subjLabel = gdSubjJa(it.subject) || it.subject;   // 'english' 等の生コードを見せない
        if (it.subject === 'chugaku') {
          subjLabel = /^中学/.test(it.topic || '') ? '' : '中学';
        }
        var subj = subjLabel ? ' <span class="chip chip-subj">' + esc(subjLabel) + '</span>' : '';
        var topicChip = it.topic ? ' <span class="chip chip-topic">🎯 ' + esc(it.topic) + '</span>' : '';
        var due = it.due_date ? ('<div class="card-meta">📅 期限: ' + esc(it.due_date) + '</div>') : '';
        // 宿題に単元(topic)があれば dojo-drill をその単元で自動起動 (?w_subject=&w_topic=)
        var qp = [];
        if (it.subject) qp.push('w_subject=' + encodeURIComponent(it.subject));
        if (it.topic) qp.push('w_topic=' + encodeURIComponent(it.topic));
        // 📝 [2026-09-24] 宿題 ID も渡す。dojo-drill はこれがあると宿題に紐づくルートに結果を保存する
        //   (塾生アプリのみ枠=AIなし は /api/question-attempts が 403 で、宿題のドリルが「保存できませんでした」で終わっていた)。
        qp.push('hw=' + encodeURIComponent(String(it.id)));
        var drillUrl = 'dojo-drill.html' + (qp.length ? ('?' + qp.join('&')) : '');
        var actions = '<div class="row-actions">';
        // 📝 [2026-09-24] ドリルのボタンは単元 (topic) のある宿題だけ。単元が無いと dojo-drill 側で開くドリルが決まらず、

    function gdLocalDate(s, withTime) {
      if (!s) return '';
      var t = String(s).replace(/^\s+|\s+$/g, '').replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1');
      if (!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(t)) t += 'Z';
      var ms = Date.parse(t);
      if (isNaN(ms)) return String(s).slice(0, 16);
      var j = new Date(ms + 9 * 3600 * 1000);   // JST の壁時計を UTC の欄で読む
      var ymd = j.getUTCFullYear() + '-' + _pad2(j.getUTCMonth() + 1) + '-' + _pad2(j.getUTCDate());
      return withTime ? (ymd + ' ' + _pad2(j.getUTCHours()) + ':' + _pad2(j.getUTCMinutes())) : ymd;
    }
    // JST の今日 'YYYY-MM-DD' (宿題の期限切れの判定。サーバ _today_jst・hw-notice.js todayJst と同じ)
    function jstToday(nowMs) {
      var ms = (typeof nowMs === 'number' && !isNaN(nowMs)) ? nowMs : Date.now();
      return new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10);
    }
    // ⏰ 〆のチップ (2026-10-18 塾長「②の残りも作っておいて」): 〆の日 'YYYY-MM-DD' (クラス宿題の期限・クラス自動宿題のドリルはサーバの due_date =
    //   題名の「〆M/D」) と JST の今日 →「〆今日」(橙) /「〆を過ぎました」(赤) / ''。判定と文言は hw-notice.js (dueState / dueChipText) の 1 か所
    //   (hw-notice.js が読めない端末だけ同じ規則 = 日付の文字列の比較に倒す)
    function gdDueState(due, today) {
      var H = window.AJHwNotice, t = today || jstToday();
      if (H && H.dueState) return H.dueState(due, t);
      var d = String(due == null ? '' : due).slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
      return d < t ? 'over' : (d === t ? 'today' : '');
    }
    function gdDueChip(due, today) {
      var st = gdDueState(due, today);
      if (!st) return '';
      var H = window.AJHwNotice;
      var txt = (H && H.dueChipText) ? H.dueChipText(st) : (st === 'over' ? '〆を過ぎました' : '〆今日');
      return ' <span class="chip ' + (st === 'over' ? 'chip-over' : 'chip-soon') + '">' + esc(txt) + '</span>';
    }
    // カードの 2 行目 (HTML・値は esc 済み)。未提出: 問題数・自動採点・出題日 / 完了: スコア・提出日時。
    // ★ドリルの種類ごとの文言 (〆のある宿題・習熟度テストなど) はここに足す (2026-10-15: カードの組み立てを 1 か所に)
    function gdMetaText(it) {
      var title = String(it.title || 'ドリル');
      if (!gdIsOpen(it)) {
        return 'スコア ' + esc(String(it.score_correct == null ? 0 : it.score_correct)) + ' / ' + esc(String(it.score_total || 0))
          + (it.completed_at ? (' ・ 提出: ' + esc(gdLocalDate(it.completed_at, true))) : '');
      }
      var n = Number(it.score_total || 0);   // 未設定(NULL)の古い配信があるので「全 0 問」を出さない
      var showN = n > 0 && title.indexOf(n + '問') < 0;   // タイトルに「25問」が入っていれば重ねない
      // 🧪 習熟度テスト (2026-10-15): 授業で一斉に解くテスト。提出は 1 回だけで、出した直後に答えと解説が出る
      //   (「いつでもOK」「その場で自動採点」と書かない = 宿題のドリルと思って先に開かせない)
      // 🏫 クラス自動宿題 (2026-10-15): 題名に期限「〆M/D」が入っているときは「いつでもOK」と書かない (題名と食い違う)
      var how = it.subject === 'proficiency_test' ? '授業の指示どおりに解いて提出 ・ 提出は1回だけ'
        : (title.indexOf('〆') >= 0 ? 'その場で自動採点' : 'その場で自動採点 ・ いつでもOK');
      return (showN ? ('全 ' + n + ' 問 ・ ') : '') + how
        + (it.assigned_at ? (' ・ 出題 ' + esc(gdLocalDate(it.assigned_at))) : '');
    }
    // 一覧に出すドリルカード (宿題カードと同じ見た目に揃える)
    function gdCardHtml(it) {
      var done = !gdIsOpen(it);
      var chip = done ? '<span class="chip chip-done">完了</span>' : '<span class="chip chip-open">未提出</span>';
      if (!done) chip += gdDueChip(it.due_date);   // ⏰ クラス自動宿題の 〆 (サーバの due_date)
      if (!done && hwIsNew(hwNewDrill, it.drill_id)) chip += ' <span class="chip chip-new">🆕 新着</span>';
      var pg = done ? null : gdDraftProgress(it);   // 💾 この端末に途中まで答えてある
      if (pg) chip += ' <span class="chip chip-draft">💾 ' + esc(gdDraftLib().progressLabel(pg)) + '</span>';
      var sj = gdSubjJa(it.subject);
      var title = String(it.title || 'ドリル');
      var subjChip = sj ? ' <span class="chip chip-subj">' + esc(sj) + '</span>' : '';
      // 科目まるごと配信は unit が科目名と同じ (例「数学」「英文法」) になる → チップ2連発を避ける。
      // 既定タイトルは「{単元}ドリル（標準・25問）」なので、タイトルが単元で始まるときもチップは不要。
      // indexOf >= 0: 既定タイトルは「{単元}ドリル（…）」だが「🎯弱点対策 {単元}ドリル」のように
      // 単元が途中に来る配信もあるので、前方一致ではなく含有で見る
      var unitDup = !it.unit || gdIsSubjectUnit(it.unit, it.subject, sj) || title.indexOf(it.unit) >= 0;
      var unitChip = unitDup ? '' : (' <span class="chip chip-topic">🎯 ' + esc(it.unit) + '</span>');
      var meta = gdMetaText(it);
      var actions = '<div class="row-actions"><button class="btn ' + (done ? 'btn-ghost' : 'btn-primary') + ' gd-open" data-id="'
        + esc(String(it.drill_id)) + '">' + (done ? '🔁 解説を見る' : (pg ? '▶ 続きから解く' : '▶ 解いて提出する')) + '</button></div>';
      return '<div class="card">' + chip + subjChip + unitChip
        + '<div class="card-title">' + esc(gdTitle(it.title)) + '</div>'
        + '<div class="card-meta">' + meta + '</div>' + actions + '</div>';
    }

    // 📊 [表 2026-10-17 塾長「アプリ側で表を直しておいて」] 取込仕様 §2 の表 = 「［表］」の行 + 「｜」区切りの行 (1 行目 = 見出し) を <table> にする。
    //   s は**エスケープ済み**の本文 (生の本文を入れない)。表は「［表］」の次の行から「｜」の無い行 (空行) の手前まで。
    //   ★本文カードは pre-wrap なので表の HTML に改行・字下げを入れない。「［表］」の行は消し、表の直後の改行 1 つは表が吸う (空行を増やさない)。
    //   半角 | は表にしない (仕様は全角 ｜ だけ)。列の数がそろわない行は空のセルで埋める。表の無い本文は 1 文字も変えない。
    //   同じ規則が mypage.js / ceo.html の _gdPassageTables にある (test_passage_table_render.py が 3 つを突き合わせる)。
    function gdPassageTables(s) {
      s = String(s);
      if (s.indexOf('［表］') < 0) return s;
      var L = s.split('\n'), out = '', prev = '', i = 0;
      while (i < L.length) {
        var j = i + 1;
        if (L[i].trim() === '［表］') while (j < L.length && L[j].indexOf('｜') >= 0) j++;
        if (j === i + 1) { out += (prev === 'text' ? '\n' : '') + L[i]; prev = 'text'; i++; continue; }
        var rows = L.slice(i + 1, j).map(function (r) { return r.split('｜'); }), n = 0;
        rows.forEach(function (r) { n = Math.max(n, r.length); });
        var trs = rows.map(function (r, k) {
          var t = k ? 'td' : 'th', c = '';
          for (var x = 0; x < n; x++) c += '<' + t + '>' + (x < r.length ? r[x].trim() : '') + '</' + t + '>';
          return '<tr>' + c + '</tr>';
        });
        out += (prev === 'text' ? '\n' : '') + '<div class="gd-table-wrap"><table class="gd-table"><thead>' + trs[0] + '</thead>'
          + (trs.length > 1 ? '<tbody>' + trs.slice(1).join('') + '</tbody>' : '') + '</table></div>';
        prev = 'table'; i = j;
      }
      return out;
    }
    // 1問ぶん。review=true は採点後/提出ずみの復習表示 (正解・自分の解答・解説を出す)。
    // 📖 [長文型 2026-09-24] 本文カード。空所番号「( 1 )」は目立たせる。完了後 (review) は全訳を折りたたみで出す。
    function gdPassageHtml(p, review) {
      if (!p) return '';
      var body = gdPassageTables(esc(p.body || '').replace(/\(\s*(\d{1,2})\s*\)/g, '<span class="gd-blank">( $1 )</span>'));
      var ja = (review && p.body_ja) ? '<details><summary>📖 全訳を見る</summary><div class="gd-ja">' + gdPassageTables(esc(p.body_ja)) + '</div></details>' : '';
      return '<div class="gd-passage gd-nomath">' + (p.title ? '<div class="gd-ptitle">📖 ' + esc(p.title) + '</div>' : '') + body + ja + '</div>';
    }
    // 設問の配列を「本文カード → その本文の設問…」の順に並べた HTML にする (本文の無い設問は従来どおり)
    function gdBlocksHtml(items, passages, review, itemHtml) {
      var seen = {}, out = '';
      (items || []).forEach(function (q) {
        var pid = q.passage_id != null ? String(q.passage_id) : '';
        if (pid && !seen[pid]) { seen[pid] = true; out += gdPassageHtml(passages && passages[pid], review); }
        out += itemHtml(q);
      });
      return out;
    }
    function gdQuestionHtml(q, review) {
      var choices = q.choices || [];
      var inner, noMark = '';
      if (review) {
        var ans = (q.answer == null) ? null : Number(q.answer);
        var mine = (q.your_answer == null || q.your_answer === '') ? null : Number(q.your_answer);
        // 25問だと「どれを間違えたか」を探すのが大変 → 問番号の横に正誤を出す
        noMark = (mine == null) ? ' —' : (mine === ans ? ' ✅' : ' ❌');
        inner = choices.map(function (c, i) {
          var isAns = (ans != null && i === ans), isMine = (mine != null && i === mine);
          var cls = 'gd-choice' + (isAns ? ' ok' : (isMine ? ' ng' : ''));
          var tail = isAns ? (isMine ? ' ✅ 正解（あなたの解答）' : ' ✅ 正解') : (isMine ? ' ❌ あなたの解答' : '');
          return '<div class="' + cls + '"><span class="gd-mark">' + gdMark(i) + '</span><span>' + esc(c) + tail + '</span></div>';
        }).join('');
        if (mine == null) inner += '<div class="card-meta" style="margin-top:0.3rem;">（未解答）</div>';
        if (q.explanation) inner += '<div class="gd-exp"><b>💡 解説</b><br>' + esc(q.explanation) + '</div>';
      } else {
        var nm = 'gdq' + q.question_id;
        inner = choices.map(function (c, i) {
          return '<label class="gd-choice"><input type="radio" name="' + esc(nm) + '" data-qid="' + esc(String(q.question_id)) + '" value="' + i + '">'
            + '<span><span class="gd-mark">' + gdMark(i) + '</span> ' + esc(c) + '</span></label>';
        }).join('');
      }
      return '<div class="gd-q"><div class="gd-no">問 ' + esc(String(q.no)) + noMark + '</div>'
        + '<div class="gd-stem">' + esc(q.stem) + '</div>' + inner + '</div>';
    }

    async function gdOpen(drillId) {
      var body = document.getElementById('homeworkBody');
      hwListShown = false;
      gdCur = null;
      body.innerHTML = '<div class="loading">読み込み中…</div>';
      gdScrollTop();
      var data;
      try { data = await api('/api/student/grammar-drill/' + encodeURIComponent(drillId)); }
      catch (e) {
        body.innerHTML = gdBackHtml() + _errBox('ドリルを開けませんでした', gdErrMsg(e));
        gdWireBack(body); _wireReload(body); return;
      }
      var drill = data.drill || {}, qs = data.questions || [];
      var review = (data.status === 'completed');
      if (review) gdDraftClear(drillId);   // 💾 提出ずみ (別の端末で出した等) の下書きは使わない
      var DL = gdDraftLib(), persist = false;
      if (DL && !review) { try { persist = DL.canPersist(hwSid()); } catch (e) { persist = false; } }
      // ★ drill.level は 'standard,advanced' 等の内部コードなので生徒には出さない (単元だけ見せる)
      var head = gdBackHtml()
        + '<div class="gd-head"><div class="card-title" style="margin-top:0;">' + esc(gdTitle(drill.title)) + '</div>'
        + (drill.unit ? '<div class="card-meta">' + esc(drill.unit) + '</div>' : '')
        + (review
          ? '<div class="gd-score" style="margin-top:0.7rem;">✅ 完了<span class="n">'
            + esc(String(data.score_correct == null ? 0 : data.score_correct)) + ' / ' + esc(String(data.score_total || 0)) + '</span>'
            + '<div class="card-meta" style="margin-top:0.25rem;">'
            + ((data.score_total && data.score_correct === data.score_total) ? '🎉 全問正解！解説でもう一度確認しておこう' : 'まちがえた問題（❌）の解説を読み直しましょう')
            + '</div>' + gdAiHintHtml() + '</div>'
          // 問題が0件のときは提出ボタン自体が出ないので、この案内文も出さない (矛盾防止)
          : (qs.length ? '<div class="card-meta" style="margin-top:0.35rem;">全 ' + qs.length + ' 問。すべて答えてから「提出して採点する」を押してください。'
            + (persist ? '<br>💾 答えはこの端末に自動で保存されます（途中でやめても続きから解けます）' : '') + '</div>' : ''))
        + '</div>';
      if (!qs.length) {
        body.innerHTML = head + '<div class="empty">このドリルには表示できる問題がありません。塾長にご連絡ください。</div>';
        gdWireBack(body); gdWireAskAi(body); return;
      }
      var blocks = gdBlocksHtml(qs, data.passages || {}, review, function (q) { return gdQuestionHtml(q, review); });
      // ★ 解答中は末尾に「戻る」を置かない = 提出ボタンのすぐ下にあると押し間違えて解答が消えるため
      body.innerHTML = head
        + (review ? (blocks + gdBackHtml())
          : '<div id="gdForm">' + blocks + '</div><div class="gd-msg" id="gdMsg"></div>'
            + '<div class="gd-submit-wrap"><button class="btn btn-green" id="gdSubmitBtn" data-total="' + qs.length + '">📤 提出して採点する</button></div>');
      gdWireBack(body); gdWireAskAi(body);   // 💡 完了表示 (review) の AI学習アプリ案内の配線 (解答中は要素が無いので no-op)
      if (!review) {
        var form = document.getElementById('gdForm');
        if (form) {
          form.addEventListener('change', function (ev) {  // 選択中の肢をハイライト (スマホで押した実感を出す)
            var inp = ev.target;
            if (!inp || inp.type !== 'radio') return;
            form.querySelectorAll('input[name="' + inp.name + '"]').forEach(function (o) {
              var lb = o.closest('.gd-choice'); if (lb) lb.classList.toggle('sel', o.checked);
            });
            // ★答えたら未回答マークと警告文を更新する。残したままだと「タップが効いていない」に見える
            var qb = inp.closest('.gd-q'); if (qb) qb.classList.remove('unanswered');
            var m = document.getElementById('gdMsg');
            if (m && m.textContent) {
              var left = qs.length - form.querySelectorAll('input[type="radio"]:checked').length;
              m.textContent = left > 0 ? ('⚠ あと ' + left + ' 問') : '';
            }
            gdDraftSave(form);   // 💾 選ぶたびにこの端末に保存
          });
          // 💾 前に途中まで答えていたら戻す
          gdCur = { id: drillId, qs: qs, stored: '' };
          var restored = gdDraftRestore(form, drillId, qs);
          if (restored) toast('💾 前に答えた ' + restored + ' 問を戻しました' + (qs.length > restored ? '（あと ' + (qs.length - restored) + ' 問）' : ''));
        }
        var sbtn = document.getElementById('gdSubmitBtn');
        if (sbtn) sbtn.addEventListener('click', function () { gdSubmit(drillId, qs.length, sbtn); });
      }
      gdApplyMath(body, JSON.stringify(qs));
    }

    async function gdSubmit(drillId, total, btn) {
      var body = document.getElementById('homeworkBody');
      var form = document.getElementById('gdForm'), msg = document.getElementById('gdMsg');
      if (!form) return;
      var answers = {};
      form.querySelectorAll('input[type="radio"]:checked').forEach(function (inp) {
        answers[inp.getAttribute('data-qid')] = Number(inp.value);
      });
      var n = Object.keys(answers).length;
      form.querySelectorAll('.gd-q.unanswered').forEach(function (q) { q.classList.remove('unanswered'); });
      if (total && n < total) {
        // ★ 25問だと未回答を目で探せない → 印を付けて最初の未回答へスクロールする
        var nos = [], first = null;
        form.querySelectorAll('.gd-q').forEach(function (q) {
          if (q.querySelector('input[type="radio"]:checked')) return;
          q.classList.add('unanswered');
          if (!first) first = q;
          var lb = q.querySelector('.gd-no');
          if (lb && nos.length < 3) nos.push(lb.textContent.replace(/\s+/g, ''));
        });
        var warn = '⚠ ' + nos.join('・') + ((total - n) > nos.length ? ' ほか' : '') + ' がまだです（あと ' + (total - n) + ' 問）';
        if (msg) msg.textContent = warn;
        // スクロールすると上の文字は画面外に去るので、トーストでも残数を伝える
        toast(warn.replace('⚠ ', ''), true);
        if (first) { try { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { first.scrollIntoView(); } }
        return;
      }
      if (msg) msg.textContent = '';
      btn.disabled = true; btn.textContent = '⏳ 採点中…';
      var res;
      try {
        res = await api('/api/student/grammar-drill/' + encodeURIComponent(drillId) + '/submit',
          { method: 'POST', body: JSON.stringify({ answers: answers }) });
      } catch (e) {
        // 二重提出 (別端末で先に出した等) は失敗ではないので、提出ずみの画面を開き直す
        if (e.status === 409) { gdDraftClear(drillId); toast('このドリルは提出ずみです'); hwLoaded = false; gdOpen(drillId); return; }
        if (msg) msg.textContent = '❌ 提出できませんでした。' + gdErrMsg(e);
        btn.disabled = false; btn.textContent = '📤 提出して採点する';
        return;
      }
      hwLoaded = false;  // 一覧に戻ったら最新(完了扱い)で読み直す
      gdDraftClear(drillId);   // 💾 出したので途中保存は消す (通信に失敗したときは上で戻る = 残す)
      // このドリルは提出済みになったので、一覧に戻る前にタブのバッジを減らしておく
      gdDrills.forEach(function (x) { if (String(x.drill_id) === String(drillId)) x.status = 'completed'; });
      hwNoticeAfterSubmit(null);   // ⏰ 出したドリルの 〆 の帯を消す
      var badge = document.getElementById('hwBadge');
      var curTxt = (badge && badge.textContent) || '';
      var cur = parseInt(curTxt, 10);
      // '99+' は実数が分からないので触らない (すぐ後の loadHomework が正しい数に直す)
      if (curTxt.indexOf('+') < 0 && cur > 0) updateBadge('hwBadge', cur - 1);
      gdRenderResult(body, res);
    }

    // 💡 [2026-09-24 塾長方針] AIなし (塾生アプリのみ) の生徒にだけ、単元ドリルを解き終えた画面 (提出直後・解説の見直し) に
    //   AI学習アプリの案内を 1 つ。自由演習の入口は作らない方針なので、導線は「💬 塾長に聞く」(メッセージタブ) だけ。
    //   判定は feed.ai_home_available の 1 値 (AIあり・旧バックエンド (undefined)・feed 未取得では出ない)。
    function gdAiHintHtml() {
      if (!(feedData && feedData.ai_home_available === false)) return '';
      return '<div class="card-meta" style="margin-top:0.6rem;line-height:1.6;">💡 AI学習アプリ（月額 +5,000 円）なら、全科目の自動採点ドリル・弱点分析・24 時間 AI チューターも使えます。</div>'
        + '<div style="margin-top:0.4rem;"><button type="button" class="btn btn-ghost gd-ask-ai" style="padding:0.3rem 0.8rem;font-size:0.82rem;">💬 塾長に聞く</button></div>';
    }
    function gdWireAskAi(body) {
      // showTab は IIFE 内なので inline onclick では呼べない (動画タブ「塾長に知らせる」と同じ配線)
      Array.prototype.forEach.call(body.querySelectorAll('.gd-ask-ai'), function (b) {
        b.addEventListener('click', function () { showTab('messages'); });
      });
    }
    function gdRenderResult(body, res) {
      var results = (res && res.results) || [];
      var correct = (res && res.score_correct != null) ? res.score_correct : 0;
      var total = (res && res.score_total != null) ? res.score_total : results.length;
      var pct = (res && res.percentage != null) ? res.percentage : (total ? Math.round(100 * correct / total) : 0);
      var word = pct >= 80 ? '🎉 よくできました!' : (pct >= 60 ? '👍 もう一歩!' : '📖 まちがえた問題の解説を読みましょう');
      var blocks = gdBlocksHtml(results, (res && res.passages) || {}, true, function (r) {
        return gdQuestionHtml({
          no: r.no, question_id: r.question_id, stem: r.stem, choices: r.choices,
          answer: r.correct_answer, your_answer: r.your_answer, explanation: r.explanation
        }, true);
      });
      body.innerHTML = gdBackHtml()
        + '<div class="gd-score">採点結果<span class="n">' + esc(String(correct)) + ' / ' + esc(String(total)) + '</span>'

    // 数式の描画。英語ドリルには数式が無いので、必要な問題が来たときだけ KaTeX を後から読み込む
    // (/vendor/ 同梱・CDN 禁止。読み込み失敗時は素のテキストのまま=表示は壊れない)。
    var _gdKatex = null;
    function gdLoadKatex() {
      if (_gdKatex) return _gdKatex;
      _gdKatex = new Promise(function (resolve) {
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = '/vendor/katex/katex.min.css?v=0.16.11';
        document.head.appendChild(css);
        var s1 = document.createElement('script');
        s1.src = '/vendor/katex/katex.min.js?v=0.16.11';
        s1.onerror = function () { resolve(false); };
        s1.onload = function () {
          var s2 = document.createElement('script');
          s2.src = '/vendor/katex/auto-render.min.js?v=0.16.11';
          s2.onload = function () { resolve(true); };
          s2.onerror = function () { resolve(false); };
          document.head.appendChild(s2);
        };
        document.head.appendChild(s1);
      });
      return _gdKatex;
    }
    function gdApplyMath(root, rawText) {
      if (!root || !/\$|\\\(|\\\[|\\frac|\\sqrt|\\times|\\geq|\\leq/.test(rawText || '')) return;
      gdLoadKatex().then(function (ok) {
        if (!ok || typeof window.renderMathInElement !== 'function') return;
        try {
          window.renderMathInElement(root, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false },
              { left: '$', right: '$', display: false }
            ],
            // trust:false = \href/\url を無効化 (問題文由来のリンク注入を塞ぐ・既定値だが明示して固定)
            throwOnError: false, errorColor: '#f87171', strict: 'ignore', trust: false,
            ignoredClasses: ['gd-nomath']   // 📖 長文の本文は数式扱いしない ($20 などを壊さない)
          });
        } catch (e) { /* 描画できなくても素のテキストで読める */ }
      });
    }

          // ★送った日時は naive UTC (サーバの CURRENT_TIMESTAMP)。gdLocalDate で JST にする (以前は文字列を切っただけで 9 時間早く出ていた・2026-10-18)

    // ===================== 📺 今週見るスタサプ (2026-10-10 段階 B) =====================
    // GET /api/student/class/sapuri → {items:[{subject, topic, course_name, lessons:[{seq,title}], to_seq, ...}]} (最大 3 件)。
    // サーバが対象生徒 (授業コースの在籍生) にだけ、弱点に合う回を返す。0 件・対象外・失敗 (旧サーバの 404 等) はカードごと出さない。
    // ★題名はこの生徒に推薦した回だけ (サーバが絞る)。値はすべて esc() を通す。
    var SP_SUBJ_JA = { math: '数学', physics: '物理', chemistry: '化学', biology: '生物', english: '英語', japanese: '国語', social: '社会' };
    // 最初の講から講番号が 1 つずつ続く範囲の最後 (2 講以上続くときだけ。飛び飛びは null)。サーバの _sapuri_run_end と同じ。
    function spRunEnd(ls) {
      if (!ls.length) return null;
      var a = Number(ls[0].seq), end = a;
      for (var i = 1; i < ls.length; i++) { if (Number(ls[i].seq) !== end + 1) break; end += 1; }
      return end > a ? end : null;
    }
    // → {course, lesson} (講座名 / 「第N講「題名」（第b講まで）」)。講座だけ (講なし) はこのカードに出さない (サーバも返さない)
    function spLineParts(it) {
      if (!it || typeof it !== 'object') return null;
      var course = String(it.course_name == null ? '' : it.course_name).trim();
      var ls = Array.isArray(it.lessons) ? it.lessons.filter(function (l) { return l && isFinite(Number(l.seq)) && l.seq !== null && l.seq !== ''; }) : [];
      if (!course || !ls.length) return null;
      var a = Number(ls[0].seq);
      // to_seq はサーバが「講番号が続くときだけ」入れる (null = 範囲なし)。キーが無い旧形式は lessons の連続部分から
      var to = ('to_seq' in it) ? ((it.to_seq != null && isFinite(Number(it.to_seq))) ? Number(it.to_seq) : null) : spRunEnd(ls);
      var title = String(ls[0].title == null ? '' : ls[0].title).trim();
      return { course: course, lesson: '第' + a + '講' + (title ? '「' + title + '」' : '') + (to > a ? '（第' + to + '講まで）' : '') };
    }
    // 📺 見た回 (2026-10-10): 「☐ 見た」/「✅ 見た (10/10)」のボタン。lesson に watched (bool) の印があるときだけ出す
    //   (印の無い旧サーバと組み合わさる間は 404 になるボタンを出さない)。日付はサーバの日本時間の日付文字列を切るだけ (new Date しない)。
    function spMD(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s == null ? '' : s));
      return m ? (Number(m[2]) + '/' + Number(m[3])) : '';
    }
    function spWatchLabel(on, date) {
      var md = spMD(date);
      return on ? ('✅ 見た' + (md ? ' (' + md + ')' : '')) : '☐ 見た';
    }
    function spWatchBtnHtml(lesson, surface) {
      if (!lesson || typeof lesson !== 'object' || !lesson.lesson_key || typeof lesson.watched !== 'boolean') return '';
      var on = lesson.watched === true;
      return '<button type="button" class="sp-watch-btn" data-key="' + esc(lesson.lesson_key) + '" data-on="' + (on ? '1' : '0') + '"'
        + ' data-surface="' + esc(surface || 'class') + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
        + esc(spWatchLabel(on, lesson.watched_date_jst)) + '</button>';
    }
    // GET /api/student/class/sapuri/progress → 折りたたみの一覧 (新しい順・日付つき)。0 件なら ''
    function spWatchedListHtml(d, open) {
      var items = (d && Array.isArray(d.items)) ? d.items : [];
      if (!items.length) return '';
      var total = Number(d.total);
      var rows = items.map(function (x) {
        if (!x || !x.lesson_key) return '';
        var t = String(x.course_name || '') + (x.seq != null ? ' 第' + x.seq + '講' : '') + (x.title ? '「' + x.title + '」' : '');
        var md = spMD(x.watched_date_jst);
        return '<div class="sp-wrow"><div class="sp-wtext">' + (md ? '<span class="sp-wdate">' + esc(md) + '</span>' : '') + esc(t) + '</div>'
          + spWatchBtnHtml({ lesson_key: x.lesson_key, watched: true, watched_date_jst: x.watched_date_jst }, 'list') + '</div>';
      }).join('');
      return '<details class="card sp-card sp-watched"' + (open ? ' open' : '') + '><summary>📺 見たスタサプ (' + esc(isFinite(total) && total > 0 ? total : items.length) + ' 講)</summary>'
        + '<div class="card-meta" style="margin-top:0.3rem;">新しい順です。押し間違えたら「✅ 見た」を押すと取り消せます。</div>' + rows + '</details>';
    }
    function sapuriCardHtml(items) {
      var rows = [];
      (Array.isArray(items) ? items : []).slice(0, 3).forEach(function (it) {
        var p = spLineParts(it);
        if (!p) return;
        var t = p.course + ' ' + p.lesson;
        var subj = SP_SUBJ_JA[String(it.subject || '').toLowerCase()] || '';
        var topic = String(it.topic == null ? '' : it.topic).trim();
        var head = (subj ? subj : '') + (subj && topic ? '・' : '') + topic;
        rows.push('<div class="sp-row" title="' + esc(t) + '">' + (head ? '<div class="sp-subj">' + esc(head) + '</div>' : '')
          + '<div class="sp-course">' + esc(p.course) + '</div><div class="sp-line">' + esc(p.lesson) + '</div>'
          + spWatchBtnHtml(it.lessons && it.lessons[0], 'class') + '</div>');
      });
      if (!rows.length) return '';
      return '<div class="card sp-card"><div class="card-title">📺 今週見るスタサプ</div>'
        + '<div class="card-meta" style="margin-bottom:0.35rem;">あなたの弱点に合う回です。スタディサプリのアプリで見たら「☐ 見た」を押しましょう（次に開いたとき、その弱点の次の回が出ます）。見てから、宿題やドリルに取り組みましょう。</div>'
        + rows.join('') + '</div>';
    }
    async function loadSapuriWatched() {
      var box = document.getElementById('sapuriWatched');

        // 隠すのは最初の読み込みの失敗と旧サーバ (404)・対象外 (403)・401 だけ (2026-10-10 レビュー指摘)
        if (spWatchedKeepOnError(e, !!box.innerHTML)) return;
        box.innerHTML = ''; box.hidden = true;
      }
    }
    function spWatchedKeepOnError(e, hasList) {
      var st = e && e.status;
      return hasList && st !== 401 && st !== 403 && st !== 404;
    }
    var _spWatchBusy = {};
    function spWatchErrText(e) {
      var st = e && e.status;
      if (st === 403) return '授業コースの生徒だけが記録できます';
      if (st === 400) return (e && e.message) || 'この回は記録できません';
      if (st === 404 || st === 405) return 'サーバの更新待ちです。数分後にもう一度';
      if (st === 429) return '少し時間をおいてください';
      if (st === 503) return '準備中です（デプロイ直後）';
      return '記録できませんでした';
    }
    async function spWatchClick(btn) {

        var nowOn = !!(r && r.watched);
        same.forEach(function (b) {

        try {
          var _sp = new URLSearchParams(location.search); _sp.delete('tab');
          var _qs = _sp.toString();
          history.replaceState(null, '', location.pathname + (_qs ? '?' + _qs : '') + (_hashHw ? '' : location.hash));
        } catch (e) {}
      }
      // 塾長登録の休塾日/予定 + 自分の出欠を読み込んで再描画（祝日カレンダーは即表示済み）
      Promise.all([loadCalendar(), loadMyAttend()]).then(function () { renderSchedule(); });
      // バッジ（宿題未提出・メッセージ未読）を先読み。宿題タブは クラス宿題 + 単元ドリル の未提出合計。
      Promise.all([
        _settle(api('/api/student/homework')),
        _settle(api('/api/student/grammar-drills'))
      ]).then(function (r) {
        // 宿題 API の 403 (通塾生コース外) は「宿題 0 件」と同じ (単元ドリルは配られうる。loadHomework と同じ扱い)
        var hwOk = r[0].ok || !!(r[0].e && r[0].e.status === 403);
        var hwItems = r[0].ok ? ((r[0].d && r[0].d.items) || []) : (hwOk ? [] : null);
        var drills = r[1].ok ? ((r[1].d && r[1].d.items) || []) : null;
        // 🆕 帯は取れた一覧だけで数える (取れた一覧は「新しい」を足すだけ。取れなかった側を「無い」とは言わない)。
        //   宿題タブを先に開いて「見た」と記録済みなら、その記録で数える (帯は出ない)
        hwNotice = hwComputeNotice(drills, hwItems);
        renderHwNotice();
        // ★片方でも取れなければバッジを出さない (部分合計 = 未提出があるのに少なく見える。
        //   loadHomework と同じ方針。タブを開けば正しい数字と赤バナーが出る)
        if (!hwOk || !drills) return;
        var n = (r[0].ok ? ((r[0].d.summary && r[0].d.summary.open) || 0) : 0) + drills.filter(gdIsOpen).length;
        updateBadge('hwBadge', n);
      }).catch(function () {});
      api('/api/messages/me/unread-count').then(function (d) { updateBadge('msgBadge', d.unread_count || 0); }).catch(function () {});
      loadSapuriCard();
      loadSapuriWatched();
      // 📺 見た回のボタン (カードと一覧の両方)。予定タブに 1 回だけ委任する
      var vs = document.getElementById('view-schedule');
      if (vs && !vs.__spWatchBound) {
        vs.__spWatchBound = true;
        vs.addEventListener('click', function (ev) {
          var b = ev.target && ev.target.closest ? ev.target.closest('.sp-watch-btn') : null;
          if (b) { ev.preventDefault(); spWatchClick(b); }
        });
      }
      // タブ
      Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
        b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
      });
    }
    boot();
  })();
  </script>
</body>
</html>

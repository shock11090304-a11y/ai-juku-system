# Render.com deployment config
# https://render.com/docs/blueprint-spec
#
# ⚠️ これは現行の本番構成ではない (旧 Render 時代の残置)。
#    本番 API は Railway (https://ai-juku-api-production.up.railway.app)。
#    このファイル中の https://ai-juku.onrender.com は既に本番ではないので、
#    ここの cron 定義をそのまま別サービスへ写すと死んだホストを叩き続ける。
#    定期実行の設定を触るときは Railway 側のダッシュボードを見ること。
#    なお週次レポートは server/main.py の _weekly_reports_scheduler が
#    API プロセス内で毎週日曜 JST 19:00 に実行するのが本命で、外部 cron は予備。
#
# 使い方:
# 1. このリポジトリをGitHubにpush
# 2. Render.com で "New Blueprint" から選択
# 3. 環境変数を設定 (Stripe/LINE/Anthropic のキー)

services:
  - type: web
    name: ai-juku-api
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # 現行プラン (2026-04-26 ピボット後・5プラン体制)
      # env 未設定でも main.py は lookup_key で fallback 検索するが、
      # env 明示のほうが Stripe API call 1回省略 + 監査時に明確
      - key: STRIPE_PRICE_FOUNDER_SPECIAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_FAMILY
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_STUDENT_ADDON
        sync: false
      # 旧プラン名 (2026-04-26 ピボット前・後方互換 fallback only / 値設定不要)
      - key: STRIPE_PRICE_AI
        sync: false
      - key: STRIPE_PRICE_HYBRID
        sync: false
      - key: STRIPE_PRICE_INTENSIVE
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://ai-juku.onrender.com
    plan: starter  # $7/月

  # ⚠️ この cron はもう使わない。予備配信は
  #    .github/workflows/weekly-reports-backup.yml (日曜 20:05 JST) が担当する。
  #
  #    ここは元々 curl でエンドポイントを叩いていたが、リポジトリ直下に
  #    Python を示すファイル (requirements.txt 等・実体は server/ の中) が無いため
  #    Nixpacks が言語を判定できず、curl も python3 も入らない最小イメージになる。
  #    そのため Railway 側の同名 cron は 2026-06 以前から毎週失敗し続けていた:
  #        2026-08-02  /bin/bash: line 1: curl: command not found
  #        2026-08-03  python3 に置き換えても同じ理由で CRASHED
  #    イメージを作り直すより、Python が確実にある GitHub Actions へ移すほうが確実。
  - type: cron
    name: ai-juku-weekly-reports
    runtime: docker
    dockerCommand: python3 scripts/trigger_weekly_reports.py
    schedule: "0 11 * * 0"  # 毎週日曜 20:00 JST (UTC 11:00)
    envVars:
      - key: CRON_SECRET
        fromService:
          name: ai-juku-api
          type: web
          envVarKey: CRON_SECRET

      物質の構成と変化に関する次の問い (問1〜問2) に答えよ。マークする数字を $①〜④$ から 1 つ選べ。
      原子量: H=1.0, C=12, O=16
    approach: <strong>問1</strong> 標準状態では気体 1 mol が 22.4 L。
    solution: |
      <strong>問1 → 正解 ②</strong>
      V = 0.50 mol × 22.4 L/mol = 11.2 L
      <strong>問2 → 正解 ④</strong>
      モル濃度 = 溶質の物質量 ÷ 溶液の体積。


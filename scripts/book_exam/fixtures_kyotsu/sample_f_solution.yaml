      有機化合物に関する次の問い (問1) に答えよ。
      問1 エタノールの分子式はどれか。 ① CH₄O ② C₂H₆O ③ C₃H₈O ④ C₂H₄O₂
    solution: |
      <strong>問1 → 正解 ②</strong>
      エタノール C₂H₅OH の分子式は C₂H₆O。

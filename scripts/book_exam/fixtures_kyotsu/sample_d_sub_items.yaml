sections:
  - qnum: "1"
    score: 25
    topic: 唐 宋 モンゴル帝国
    problem: |
      次の文章を読み、下の問い(問 A〜問 C)に答えよ。(配点 25 点)
      7 世紀に建国された唐は、律令にもとづく統治をおこなった。
    sub_items:
      - 問 A　下線部ア『唐』に関する記述として正しいものを一つ選べ。
      - 問 B　下線部イ『宋』の時代の社会・経済に関する記述として正しいものを一つ選べ。
      - 問 C　次のア〜エの出来事を年代順に正しく並べたものを一つ選べ。
    sub_items_choices:
      - ① 科挙制度は唐代に廃止された　② 均田制・府兵制・三省六部を整えた　③ 文治主義を採った　④ 王安石が新法を行った
      - ① 交子・会子が流通した　② 屯田制が始まった　③ 均田制が完成した　④ 佃戸が消滅した
      - ① ア→ウ→エ→イ　② ア→エ→ウ→イ　③ イ→ア→ウ→エ　④ ウ→ア→イ→エ
    solution: |
      **問 A 正解: ②**
      唐 — 均田制・府兵制・三省六部が正しい組合せ。①科挙は廃止されていない。
      **問 B 正解: ①**
      宋代経済革命 — 紙幣(交子・会子)の流通。
      **問 C 正解: ①**
      年代順はア→ウ→エ→イ。

# 形 D — sub_items + sub_items_choices + solution に正解
#         (世界史・日本史の実物の形。2026-08-14 に実機の --probe 出力から書き起こした)
#
# ★ 実物の要点:
#   ・小問の文は sub_items (文字列の一覧)
#   ・選択肢は sub_items_choices — **1 小問ぶんが 1 本の文字列** に
#     「① … ② … ③ … ④ …」と詰まっている。数えるには ①②③ が
#     1 から連番で並んでいることを確かめる (本文にも丸数字が出るため)
#   ・正解は solution の「**問 A 正解: ②**」(世界史) /
#     「問 1　正解: **①**」(日本史)。飾りを剥がしてから抜く


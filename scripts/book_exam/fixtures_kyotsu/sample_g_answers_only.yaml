# 正解の並びだけ読める形 (英語R の実物の形) — JSON では取り込めず、一括入力用
#         (2026-08-14 に実機の --probe 出力から書き起こした)
#
# ★ 実物の要点:
#   ・answer_key: [{number: 1, answer: '第1問 問1 = ③ (June 15)', explanation}, …]
#     — answer が自由文で、丸数字 1 つを含む
#   ・選択肢の数は元データのどこにも書かれていない (本文の図に入っている)
#   → JSON 取り込みは不可。正解の並びだけ出して、登録画面の
#     「正解だけをまとめて入れる」(§17.8) に貼る。
#   --selftest は「承知のうえで外され、正解の並びが読めること」を検査する。


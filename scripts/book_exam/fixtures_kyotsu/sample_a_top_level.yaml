# 形 A — トップレベルの answer_key に正解が並ぶ (英語R / 国語 / 物理 の想定)
#
# ★ これは実物ではない。別セッションの調査報告から書き起こした **想定の形**。
#   convert_kyotsu_yaml.py --selftest がこれを変換して、
#   「形 A のアダプタが動くこと」だけを確かめる。
#   実物がこの形と違えば変換は落ちる (推測しないので黙って通らない)。
#   そのときは --probe の出力を見て、この見本とアダプタを直すこと。

title: 共通テスト物理 マーク式
subject: 物理
date: 2026-06-03

# ★ ①②③ で書かれていれば起算が確定する (① は必ず 1 番目)。
#   素の整数 (1, 2, 3) だと 0 起算か 1 起算か決められず、変換器は止まる。
#
# ★ 実物の形 (2026-08-14 に --probe で確認): 値の並びではなく
#   {number, answer} の一覧。問番号が付いているので、変換器は **番号で突き合わせる**
#   (並び順に頼ると、設問を拾う順と食い違ったとき全問ずれて誰も気づけない)。
answer_key:
  - number: 1
    answer: ②
  - number: 2
    answer: ①
  - number: 3
    answer: ④

sections:
  - id: 第1問
    title: 力学
    questions:
      - number: 1
        stem: 水平な床の上で、質量 2.0 kg の物体に一定の力を加えたところ、加速度が 1.5 m/s^2 であった。加えた力の大きさとして最も適当なものを選べ。
        choices:
          - 1.5 N
          - 3.0 N
          - 4.5 N
          - 6.0 N
        explanation: 運動方程式 ma = F より F = 2.0 × 1.5 = 3.0 N。
        points: 5
      - number: 2
        stem: 同じ物体を静止させたまま保つとき、床から受ける垂直抗力の大きさとして最も適当なものを選べ。重力加速度は 9.8 m/s^2 とする。
        choices:
          - 19.6 N
          - 9.8 N
          - 4.9 N
          - 2.0 N
        explanation: 鉛直方向のつり合いより N = mg = 2.0 × 9.8 = 19.6 N。
        points: 5

  - id: 第2問
    title: 波動
    questions:
      - number: 3
        stem: 振動数 500 Hz、波長 0.68 m の音波が空気中を伝わるとき、この音波の速さとして最も適当なものを選べ。
        choices:
          - 170 m/s
          - 250 m/s
          - 300 m/s
          - 340 m/s
        explanation: v = fλ = 500 × 0.68 = 340 m/s。
        points: 5

title: 共通テスト世界史 マーク式
subject: 世界史
date: 2026-06-03

sections:
  - id: 第1問
    questions:
      - number: 1
        stem: ローマ共和政において、平民の権利を守るために設置された官職として最も適当なものを選べ。
        choices:
          - 独裁官
          - 執政官
          - 護民官
          - 監察官
        explanation: |
          問1 → 正解 ③
          護民官は前 494 年の聖山事件を経て設置され、平民会の決議を主導し、
          パトリキ出身の政務官の決定に拒否権を行使できた。
          独裁官は非常時の職、執政官は最高政務官、監察官は戸口調査を担った。

      - number: 2
        stem: 唐の律令体制において、成年男子に土地を支給した制度として最も適当なものを選べ。
        choices:
          - 屯田制
          - 均田制
          - 荘園制
          - 佃戸制
        explanation: |
          **問 2 正解: ②**
          均田制は北魏に始まり唐が受け継いだ土地支給制度で、租庸調制の前提をなす。
          屯田制は後漢末から三国期、荘園と佃戸は唐後期以降に広がった。

  - id: 第2問
    questions:
      - number: 3
        stem: 第二次世界大戦後のヨーロッパ復興を目的としてアメリカが実施した経済援助計画として最も適当なものを選べ。
        choices:
          - トルーマン=ドクトリン
          - マーシャル=プラン
          - コミンフォルム
          - シューマン=プラン
        explanation: |
          問 3 正解: ②
          マーシャル=プランは 1947 年に発表された欧州復興援助計画。
          トルーマン=ドクトリンは同年の封じ込め宣言で、援助計画そのものではない。

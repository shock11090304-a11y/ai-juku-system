<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 東大英語チャレンジ — シェア画像</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  /* Threads/X 推奨アスペクト比 1:1 (1080x1080) を再現する正方形 */
  .card {
    width: min(100vw, 100vh, 600px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    padding: 8% 7%;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #831843 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  /* 装飾光 */
  .card::before {
    content: '';
    position: absolute;
    top: -30%; right: -30%;
    width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.25) 0%, transparent 60%);
    border-radius: 50%;
    z-index: 0;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -30%; left: -30%;
    width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 60%);
    border-radius: 50%;
    z-index: 0;
  }
  .card > * { position: relative; z-index: 1; }

  .top-tag {
    display: inline-block;
    align-self: flex-start;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    color: #fff;
    font-size: clamp(0.7rem, 2vw, 1rem);
    font-weight: 900;
    padding: 0.4em 0.95em;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }

  .center {
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5% 0;
  }

  .lead {
    font-size: clamp(0.95rem, 3vw, 1.5rem);
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    margin-bottom: 0.6em;
    line-height: 1.5;
  }
  .lead strong {
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .score-num {
    font-size: clamp(5rem, 22vw, 12rem);
    font-weight: 900;
    line-height: 0.95;
    background: linear-gradient(135deg, #34d399 0%, #10b981 60%, #059669 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 60px rgba(52, 211, 153, 0.45);
    letter-spacing: -0.04em;
  }
  .score-num .slash { color: rgba(255,255,255,0.5); -webkit-text-fill-color: rgba(255,255,255,0.5); font-size: 0.7em; }
  .score-label {
    font-size: clamp(0.85rem, 2.4vw, 1.3rem);
    font-weight: 800;
    color: #34d399;
    margin-top: 0.4em;
    letter-spacing: 0.08em;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5%;
    margin-top: 7%;
  }
  .stat {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 4% 3%;
    text-align: center;
  }
  .stat-v {
    font-size: clamp(0.95rem, 3vw, 1.5rem);
    font-weight: 900;
    color: #fbbf24;
    line-height: 1;
    margin-bottom: 0.3em;
  }
  .stat-l {
    font-size: clamp(0.6rem, 1.6vw, 0.85rem);
    color: rgba(255,255,255,0.7);
    font-weight: 600;
  }

  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 5%;
  }
  .price {
    font-size: clamp(0.85rem, 2.5vw, 1.3rem);
    font-weight: 900;
    color: #fff;
    line-height: 1.3;
  }
  .price .yen {
    font-size: clamp(1.5rem, 5vw, 2.6rem);
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
    line-height: 1;
  }
  .brand {
    text-align: right;
    font-size: clamp(0.7rem, 1.8vw, 0.95rem);
    color: rgba(255,255,255,0.7);
    font-weight: 700;
    line-height: 1.4;
  }
  .brand .url { color: rgba(251,191,36,0.9); display: block; font-size: 0.85em; }

  /* スクショヘルプ */
  .hint {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.4);
    z-index: 10;
  }
  @media (display-mode: standalone) { .hint { display: none; } }
</style>
</head>
<body>
<div class="card">
  <span class="top-tag">⚡ AI vs 東大入試 2024</span>

  <div class="center">
    <div class="lead">¥14,500/月 の AI チューターが<br><strong>東大英語 2024</strong> を解いてみたら</div>
    <div class="score-num">4<span class="slash"> / </span>4</div>
    <div class="score-label">全問正解 (100%)</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-v">9 分</div>
      <div class="stat-l">所要時間</div>
    </div>
    <div class="stat">
      <div class="stat-v">100%</div>
      <div class="stat-l">正答率</div>
    </div>
    <div class="stat">
      <div class="stat-v">¥14,500</div>
      <div class="stat-l">月額</div>
    </div>
  </div>

  <div class="bottom">
    <div class="price">
      個別塾<br>
      <span class="yen">¥30,000+</span>
    </div>
    <div class="brand">
      AI学習コーチ塾<br>
      <span class="url">trillion-ai-juku.com</span>
    </div>
  </div>
</div>
<div class="hint">📸 iPhone: ボリューム上 + サイドボタン同時押しでスクショ → Threads に添付</div>
</body>
</html>

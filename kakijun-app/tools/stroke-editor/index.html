<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ストロークエディタ（開発者用）</title>
    <style>
      body { font-family: sans-serif; margin: 12px; display: flex; gap: 16px; background: #fafafa; }
      canvas { border: 1px solid #bbb; background: #fff; cursor: crosshair; touch-action: none; }
      #side { width: 460px; display: flex; flex-direction: column; gap: 8px; }
      textarea { width: 100%; height: 260px; font-family: monospace; font-size: 11px; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .row label { font-size: 12px; color: #555; }
      input, select, button { font-size: 13px; padding: 3px 6px; }
      #strokes { font-size: 12px; }
      #strokes .stroke-row { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
      #strokes .active { background: #fff3d6; }
      #help { font-size: 11px; color: #777; line-height: 1.6; }
    </style>
  </head>
  <body>
    <canvas id="cv" width="512" height="512"></canvas>
    <div id="side">
      <div class="row">
        <label>id <input id="m-id" value="hira_" size="10" /></label>
        <label>字 <input id="m-char" value="" size="2" /></label>
        <label>読み <input id="m-reading" value="" size="4" /></label>
        <label>type
          <select id="m-type">
            <option>hiragana</option><option>katakana</option>
            <option>number</option><option>unpitsu</option>
          </select>
        </label>
        <label>group <input id="m-group" value="a-gyo" size="8" /></label>
      </div>
      <div class="row">
        <label>hint
          <select id="s-hint">
            <option>tate</option><option>yoko</option><option>naname</option>
            <option>magari</option><option>maru</option><option>haneru</option><option>harau</option>
          </select>
        </label>
        <label>ending
          <select id="s-ending">
            <option>tome</option><option>hane</option><option>harai</option>
          </select>
        </label>
        <button id="commit">次の画へ ✓</button>
        <button id="undo-pt">点を戻す</button>
      </div>
      <div id="strokes"></div>
      <div class="row">
        <button id="copy">JSON をコピー</button>
        <button id="load">JSON を読み込む</button>
        <button id="clear">全部消す</button>
      </div>
      <textarea id="json" spellcheck="false" placeholder="ここに JSON。読み込むボタンで編集し直せます"></textarea>
      <div id="help">
        クリック: 制御点を追加 / ドラッグ: 移動 / 右クリック: 削除<br />
        「次の画へ」で現在の画を確定。確定済みの画はクリックで選択して再編集できます。<br />
        プレビューは実アプリと同じ Catmull-Rom スプライン描画です。
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

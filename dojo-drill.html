    // ───────── helpers (university-exam.html と同一の堅牢な解決ロジック) ─────────
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    // 🧱 2026-06-24 markdown 表 → HTML table。本文に「| a | b |」+「|---|---|」+データ行があれば罫線表に。
    //   セルは escapeHtml 済。markUnderlines の sentinel 衝突を避けるため、抽出は markUnderlines より前に行い
    //   (_ddPassageHtml 参照)、placeholder(U+E020/E021)を formatScientific 通過後に table HTML へ復元する。
    const _DDT0 = String.fromCharCode(0xE020), _DDT1 = String.fromCharCode(0xE021);
    const _DDT_RE = new RegExp(_DDT0 + '(\\d+)' + _DDT1, 'g');
    function _ddBuildTable(block) {
      const lines = block.split('\n').filter(l => l.trim() !== '');
      if (lines.length < 2) return null;
      const sep = lines[1].trim();
      if (!/-/.test(sep) || !/^[\s:|-]+$/.test(sep)) return null;
      const cells = l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const header = cells(lines[0]);
      let h = '<table class="dd-tbl"><thead><tr>' + header.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr></thead><tbody>';
      lines.slice(2).forEach(l => { h += '<tr>' + cells(l).map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>'; });
      return h + '</tbody></table>';
    }
    function _ddExtractTables(src, store) {
      const lines = String(src == null ? '' : src).split('\n'); const out = [];
      for (let i = 0; i < lines.length;) {
        const sep = lines[i + 1];
        if (lines[i].indexOf('|') >= 0 && sep != null && /-/.test(sep) && sep.indexOf('|') >= 0 && /^[\s:|-]+$/.test(sep.trim())) {
          let j = i + 2;
          while (j < lines.length && lines[j].indexOf('|') >= 0 && lines[j].trim() !== '') j++;
          const html = _ddBuildTable(lines.slice(i, j).join('\n'));
          if (html) { store.push(html); out.push(_DDT0 + (store.length - 1) + _DDT1); i = j; continue; }
        }
        out.push(lines[i]); i++;
      }
      return out.join('\n');
    }
    // 🖼 inline SVG を sanitize。★正規表現サニタイズは HTML パーサとの解釈差で `/onmouseover=` 等が
    //   すり抜ける(レビューで実証されたXSS)。innerHTML と同じ text/html でパースし、DOM 木を allowlist で
    //   歩いて (a)許可外要素を除去 (b)on* 属性を全除去 (c)href/xlink:href は安全スキームのみ (d)危険な style を除去
    //   → 直列化。文字列正規表現を一切信用しない。失敗時は fail-closed で空文字 (図非表示)。
    const _DD_SVG_OK = new Set(['svg', 'g', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon',
      'path', 'text', 'tspan', 'defs', 'lineargradient', 'radialgradient', 'stop', 'title', 'desc',
      'marker', 'clippath', 'use', 'symbol', 'pattern']);
    function _ddSanitizeSvg(s) {
      if (!s || typeof s !== 'string' || s.indexOf('<svg') < 0) return '';
      try {
        const doc = new DOMParser().parseFromString('<div>' + s + '</div>', 'text/html');
        const svg = doc.body && doc.body.querySelector('svg');
        if (!svg) return '';
        const clean = (el) => {
          // 属性: on* は全除去、href/xlink:href は javascript:/data: を除去、style は url()/expression を除去
          Array.from(el.attributes).forEach((a) => {
            const n = a.name.toLowerCase();
            if (/(?:^|:)on/.test(n)) { el.removeAttribute(a.name); return; }                  // on* / xlink:on* 等を除去
            if (n === 'href' || n === 'xlink:href') { if (!/^\s*#/.test(a.value)) el.removeAttribute(a.name); return; }  // フラグメント(#id)参照以外の href は全除去(外部fetch/javascript:/data: を遮断)
            if (n === 'style' && /url\s*\(|expression|javascript:/i.test(a.value)) el.removeAttribute(a.name);
          });
          Array.from(el.children).forEach((c) => {
            if (!_DD_SVG_OK.has(c.tagName.toLowerCase())) { c.remove(); return; }
            clean(c);
          });
        };
        clean(svg);
        return svg.outerHTML;
      } catch (e) { return ''; }
    }

    function _ddPassageHtml(text, qs) {

    // 🎯 [傍線部表示 2026-06-15] 本文にマークアップが無くても、設問が引用する傍線部/下線部「…」を

    //   sentinel を挿入し formatScientific が <u class=exam-underline data-mark> に復元。見つからなければ無処理。
    function markUnderlines(passage, qs) {

    function deriveUnit(q, preset) {
      if (q && q.unit && String(q.unit).trim()) return String(q.unit).trim().slice(0, 60);

    // 🎯 [習得クローズドループ 2026-06-17] マイページの弱点「コーチの一手」から ?w_subject=&w_topic= で来たとき、
    //   その弱点単元に最も近いドリルを自動で開く (ワンタップ演習)。一致しなければ通常メニューのまま。
    function findPresetForWeakness(wTopic, wSubject) {
      const wt = String(wTopic || '').trim();
      if (!wt) return null;
      const pref = (u) => String(u == null ? '' : u).split(/[（(：:]/)[0].trim();
      const wtPref = pref(wt);
      // 🧒 2026-07-03 中学生(chugaku)の弱点は subject="chugaku"・topic=単元filter。候補を CHU_UNIT_PRESETS

      const isChu = String(wSubject || '').toLowerCase() === 'chugaku';
      const cands = isChu ? CHU_UNIT_PRESETS.slice() : UNIT_PRESETS.concat(PRESETS);

      //   日本史/世界史の区別が付かないため、曖昧時は「誤った科目を開かず」メニューに戻すのが安全。
      const SUBJ_HINT = { social: ['日本史', '世界史', '地理', '倫理', '政経', '公民', '社会'], physics: ['物理'], chemistry: ['化学'], biology: ['生物'], english: ['英'], japanese: ['国語', '古文', '漢文', '現代文'], math: ['数学'] };
      const hints = SUBJ_HINT[String(wSubject || '').toLowerCase()] || null;
      const subjOk = (p) => !hints || hints.some(h => subjOf(p).indexOf(h) >= 0);
      // 候補が 1 件なら確定。複数なら subject で絞り、なお複数(例: 日本史/世界史 共に「中世」)なら
      //   誤誘導を避けて null を返す (= 通常メニュー表示)。
      const pick = (arr) => {
        if (arr.length === 1) return arr[0];
        if (arr.length > 1) { const f = arr.filter(subjOk); return f.length === 1 ? f[0] : null; }
        return null;
      };
      // 1) topic 完全一致 (記録 topic が preset.topic 由来のとき。例「物理 力学」)
      let r = pick(cands.filter(p => p.topic === wt));

      const pm = cands.filter(p => p.filter && wtPref.startsWith(p.filter));

      r = pick(cands.filter(p => p.topic && (wt.indexOf(p.topic) >= 0 || p.topic.indexOf(wt) >= 0)));
      if (r) return r;
      // 4) 🎯 発展(連動大問)弱点: 記録 topic は小問固有の unit (例「発展 化学平衡(Kc)」) で preset.topic と
      //    一致しないため 1〜3 で漏れる。topic「発展」始まり + subject から対応する発展カードへ。
      //    化学/物理は発展カード1枚で確定起動。数学は IA/IIB 2枚で曖昧→誤誘導回避でメニューに戻す。
      if (/発展/.test(wt)) {

        const wants = SUBJ_EXAM[String(wSubject || '').toLowerCase()];
        if (wants) { const ep = PRESETS.filter(p => wants.indexOf(p.part) >= 0); if (ep.length === 1) return ep[0]; }
      }

      if (!u || !c) return;
      document.querySelectorAll('.univ-chip').forEach(b => b.classList.toggle('active', b.dataset.univ === univKey));
      let html = `<div class="subj-h" style="color:#6ee7b7;">${escapeHtml(u.name)} の大問を選ぶ</div><div class="preset-grid">`;
      u.parts.forEach(p => {
        const item = UNIV_FLAT.find(x => x.univKey === u.key && x.part === p.part && x.grade === p.grade);
        if (item) html += presetCard(item, p.label);
      });
      html += `</div>`;
      c.innerHTML = html;
      c.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => startDrill(ALL[parseInt(b.dataset.idx, 10)])));
      c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    async function startDrill(preset) {
      drillOrigin = null;  // 手動選択は元弱点クレジット無し (弱点リンク経由のときだけ呼び出し側が直後に再設定)
      document.getElementById('presetView').style.display = 'none';
      const dv = document.getElementById('drillView');
      dv.style.display = '';
      dv.innerHTML = '<div class="loading">問題を読み込み中…</div>';
      try {
        // 🔀 増量プールを活かす: agg モードは多めに取得して後でシャッフル(毎回違う小問)。
        //   非agg(共テ/大学別)も多めに取り、server側の random.choice の母数を増やして単発でも問題が変わるように。
        const lim = preset.agg ? Math.min(50, preset.agg * 8) : 30;
        let url = `${BACKEND_URL}/api/exam-questions/bank?exam=${encodeURIComponent(preset.exam)}&part=${encodeURIComponent(preset.part)}&eiken_grade=${encodeURIComponent(preset.grade)}&limit=${lim}`;
        if (preset.filter) url += `&topic=${encodeURIComponent(preset.filter)}`;   // 単元フィルタ (bank が SQL LIKE)
        const d = await (await fetch(url)).json();
        let daimon, qs;
        if (preset.agg) {
          // 単元別: 1問/payload の独立小問を agg 問ぶん集約して 1 セットに。
          //   🔧 2026-06-20: 各小問にその大問の passage(共通設定「\vec{a}=(3,1),\vec{b}=(-1,2)とする」等)を
          //   _passage として引き継ぐ。集約+シャッフルで親大問の前提が剥がれ、passage に条件を置いた
          //   小問(ベクトル/倫理/社会の資料問題など)が「条件落ち」で解けなくなっていたため、小問単位で
          //   前提を保持し renderDrill で各問の上に表示して自己完結化する。
          const pool = (d && Array.isArray(d.all)) ? d.all : (d && d.selected ? [d.selected] : []);
          let questions = [];
          pool.forEach(it => {
            const _p = (it && (it.passage || it.audio_script || it.prompt)) || '';
            ((it && Array.isArray(it.questions)) ? it.questions : []).forEach(q => {
              if (q && q.stem) questions.push(_p ? { ...q, _passage: _p } : q);
            });
          });
          // 🎯 unitExact: 小問 unit の接頭辞 (「(」「（」「:」「：」の前) が filter と完全一致する小問だけに厳密化。
          //   タグ付き理科プールで「力学」フィルタが「熱力学」を部分一致で巻き込むのを防ぐ。
          //   一致 0 件 (= unit 未タグの AI 生成プール等) は従来の LIKE 結果のまま使う (graceful fallback)。
          if (preset.unitExact && preset.filter) {
            const pref = (u) => String(u == null ? '' : u).split(/[（(：:]/)[0].trim();
            // 接頭辞が filter で始まる小問だけ採用。「熱力学」は「力学」で始まらないので巻き込まない。
            // 「指数」は「指数関数・対数関数」「指数・対数」を拾い「数列」を除く。
            const exact = questions.filter(q => pref(q.unit).startsWith(preset.filter));
            if (exact.length) questions = exact;
          }
          // 🔀 集約した小問をシャッフルしてから agg 問取り出す → 増量プールから毎回違う問題が出て弱点が浮き彫りに
          for (let _i = questions.length - 1; _i > 0; _i--) { const _j = Math.floor(Math.random() * (_i + 1)); const _t = questions[_i]; questions[_i] = questions[_j]; questions[_j] = _t; }
          daimon = { passage: '', questions: questions.slice(0, preset.agg), _question_id: (pool[0] && pool[0]._question_id) || null };
          qs = daimon.questions;
        } else {
          daimon = d && d.selected;
          qs = daimon && Array.isArray(daimon.questions) ? daimon.questions.filter(q => q && q.stem) : [];
        }
        if (!daimon || !qs.length) {
          dv.innerHTML = `<div class="loading">この問題はまだ準備中です。<br><button class="btn btn-ghost" id="back">← 別のドリルを選ぶ</button></div>`;
          document.getElementById('back').addEventListener('click', backToPresets);
          return;
        }
        cur = { preset, daimon, qs, startedAt: Date.now() };
        renderDrill();
      } catch (e) {
        dv.innerHTML = `<div class="loading">読込エラー: ${escapeHtml(e.message)}<br><button class="btn btn-ghost" id="back">← 戻る</button></div>`;
        document.getElementById('back').addEventListener('click', backToPresets);
      }
    }

    function renderDrill() {
      const { preset, daimon, qs } = cur;
      const passage = daimon.passage || daimon.audio_script || daimon.prompt || '';
      let body = `<div class="timer-bar"><div><strong>${escapeHtml(preset.name)}</strong> <span class="muted">/ 全${qs.length}問</span></div><div class="timer" id="timer">--:--</div></div>`;
      if (passage) {
        const label = daimon.audio_script ? '【放送内容（読んで解答）】\n' : '';
        // 設問が引用する傍線部/下線部を本文中で下線+ラベル表示 (案A)・markdown表はHTML table化
        body += `<div class="passage">${_ddPassageHtml(label + passage, qs)}</div>`;
      }
      // 🖼 2026-06-24 大問レベルの図 (figure_svg) を本文の下に描画 (sanitize 済 inline SVG)
      { const _fig = _ddSanitizeSvg(daimon.figure_svg || daimon.figure || ''); if (_fig) body += `<div class="dd-figure">${_fig}</div>`; }
      qs.forEach((q, qi) => {
        const choices = normChoices(q.choices);
        const isMC = choices.length > 0;
        body += `<div class="q-block" data-qi="${qi}">`;
        // 🔧 2026-06-20: agg集約で大問から引き継いだ共通設定(前提)を小問の上に表示し自己完結化。
        //   非agg時は q._passage が無い(本文は上部に1回表示)ので二重表示にはならない。
        if (q._passage) {
          body += `<div class="passage">${_ddPassageHtml(q._passage, [q])}</div>`;
        }
        body += `<div class="q-stem">問${qi + 1}. ${formatScientific(q.stem)}</div>`;
        { const _qfig = _ddSanitizeSvg(q.figure_svg || q.figure || ''); if (_qfig) body += `<div class="dd-figure">${_qfig}</div>`; }
        if (isMC) {
          body += `<div class="choices">` + choices.map((c, ci) =>
            `<div class="choice" data-qi="${qi}" data-ci="${ci}"><span class="choice-key">${String.fromCharCode(65 + ci)}.</span><span>${formatScientific(c)}</span></div>`
          ).join('') + `</div>`;
        } else {
          body += `<div class="q-free"><textarea placeholder="解答を入力（記述・自己採点）" data-qi="${qi}"></textarea></div>`;
        }
        body += `<div class="selfmark" data-qi="${qi}" style="display:none;"></div>
          <div class="reason" data-qi="${qi}"></div>
          <div class="expl" data-qi="${qi}"></div>
        </div>`;
      });
      body += `<div class="actions"><button class="btn btn-primary" id="gradeBtn">📝 採点する</button><button class="btn btn-ghost" id="quitBtn">← やめて戻る</button></div>`;
      const dv = document.getElementById('drillView');
      dv.innerHTML = body;
      _ddApplyKatex(dv);  // 🧮 本文/設問/選択肢の LaTeX 数式を描画

      // choice select
      dv.querySelectorAll('.choice').forEach(el => el.addEventListener('click', () => {
        const qi = el.dataset.qi;
        dv.querySelectorAll(`.choice[data-qi="${qi}"]`).forEach(c => c.classList.remove('sel'));
        el.classList.add('sel');
      }));
      document.getElementById('gradeBtn').addEventListener('click', () => grade(false));
      document.getElementById('quitBtn').addEventListener('click', () => { stopTimer(); backToPresets(); });
      startTimer(preset.min * 60);
    }

    function startTimer(sec) {
      remainSec = sec;
      const el = document.getElementById('timer');
      const tick = () => {
        const m = Math.floor(remainSec / 60), s = remainSec % 60;
        el.textContent = `${m}:${String(s).padStart(2, '0')}`;
        el.classList.toggle('warn', remainSec <= 120 && remainSec > 30);
        el.classList.toggle('danger', remainSec <= 30);
        if (remainSec <= 0) { stopTimer(); grade(true); return; }
        remainSec--;
      };
      tick();
      timerId = setInterval(tick, 1000);
    }
    function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

    function grade(timeUp) {
      stopTimer();
      const dv = document.getElementById('drillView');
      const { qs, preset } = cur;
      cur.results = [];
      qs.forEach((q, qi) => {
        const choices = normChoices(q.choices);
        const isMC = choices.length > 0;
        const block = dv.querySelector(`.q-block[data-qi="${qi}"]`);
        const exEl = block.querySelector(`.expl[data-qi="${qi}"]`);
        const smEl = block.querySelector(`.selfmark[data-qi="${qi}"]`);
        const reasonEl = block.querySelector(`.reason[data-qi="${qi}"]`);
        let isCorrect = null, autoGraded = false, correctIdx = -1;
        if (isMC) {
          correctIdx = resolveAnswerIndex(q.answer, choices);
          const selEl = block.querySelector(`.choice[data-qi="${qi}"].sel`);
          const userIdx = selEl ? parseInt(selEl.dataset.ci, 10) : -1;
          block.querySelectorAll(`.choice[data-qi="${qi}"]`).forEach(c => {
            const ci = parseInt(c.dataset.ci, 10); c.style.cursor = 'default';
            if (correctIdx >= 0 && ci === correctIdx) c.classList.add('correct');
            else if (ci === userIdx) c.classList.add('wrong');
          });
          if (correctIdx >= 0 && userIdx >= 0) { isCorrect = (userIdx === correctIdx); autoGraded = true; }
        }
        // 解説 + 正答表示
        const ansText = (isMC && correctIdx >= 0) ? `${String.fromCharCode(65 + correctIdx)}. ${formatScientific(choices[correctIdx])}` : formatScientific(String(q.answer == null ? '' : q.answer));
        exEl.innerHTML = `<div class="expl-ans">正解: ${ansText}</div>${q.explanation ? `<div style="margin-top:0.3rem;">${formatScientific(q.explanation)}</div>` : ''}`;
        exEl.classList.add('show');
        _ddApplyKatex(exEl);  // 🧮 正答・解説内の LaTeX 数式を描画
        // 自己採点 (自動採点できない記述/未選択) → ○×ボタン
        if (!autoGraded) {
          smEl.style.display = 'flex';
          smEl.innerHTML = `<span class="muted">自己採点:</span><button data-m="correct">⭕ 正解</button><button data-m="wrong">❌ 不正解</button>`;
          smEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
            const mk = btn.dataset.m;
            cur.results[qi].isCorrect = (mk === 'correct');
            smEl.querySelectorAll('button').forEach(b => b.classList.remove('on-correct', 'on-wrong'));
            btn.classList.add(mk === 'correct' ? 'on-correct' : 'on-wrong');
            toggleReason(qi, mk === 'wrong');
            updateFinalizeHint();
          }));
        }
        // 理由 select (不正解時に表示)
        reasonEl.innerHTML = `<span class="muted">つまずき理由:</span> <select data-qi="${qi}">${REASONS.map(r => `<option value="${r.v}">${r.t}</option>`).join('')}</select>`;
        reasonEl.querySelector('select').addEventListener('change', updateFinalizeHint);
        if (autoGraded && isCorrect === false) reasonEl.classList.add('show');

        cur.results[qi] = { qi, sub_id: q.id || `q${qi + 1}`, unit: deriveUnit(q, preset), isMC, isCorrect, autoGraded, correctIdx };
      });
      // 採点後のフッタ: 確定ボタン
      const act = dv.querySelector('.actions');
      act.innerHTML = `<button class="btn btn-primary" id="finalizeBtn">✅ 結果を記録して弱点に反映</button><button class="btn btn-ghost" id="quitBtn2">← やめて戻る</button>
        <div class="muted" id="finalizeHint" style="width:100%; margin-top:0.3rem;"></div>`;
      document.getElementById('finalizeBtn').addEventListener('click', finalize);
      document.getElementById('quitBtn2').addEventListener('click', backToPresets);
      if (timeUp) { const tb = document.querySelector('.timer'); if (tb) { tb.textContent = '時間切れ'; tb.classList.add('danger'); } }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateFinalizeHint();
    }

    function toggleReason(qi, show) {
      const r = document.querySelector(`.reason[data-qi="${qi}"]`);
      if (r) r.classList.toggle('show', show);
    }
    function getReason(qi) {
      const sel = document.querySelector(`.reason[data-qi="${qi}"] select`);
      return sel ? sel.value : '';
    }
    function updateFinalizeHint() {
      // 不正解なのに理由未選択の小問数
      const pending = cur.results.filter(r => r.isCorrect === false && !getReason(r.qi)).length;
      const ungraded = cur.results.filter(r => r.isCorrect === null).length;
      const hint = document.getElementById('finalizeHint');
      if (!hint) return;
      if (ungraded > 0) hint.textContent = `※ ${ungraded}問が未採点です（⭕/❌ をタップ）。そのまま記録もできます。`;
      else if (pending > 0) hint.textContent = `💡 不正解 ${pending}問の「つまずき理由」を選ぶと、弱点分析がより深くなります（任意）。`;
      else hint.textContent = '記録の準備ができました。';
    }

    async function finalize() {
      // 🛡️ 2026-07-02 二重送信ガード: await 中の再クリック/リトライで同一解答が question_attempts に
      //   重複記録され、弱点集計(qa_attempts/正答率・習得判定)が歪むのを防ぐ。処理完了で必ず解除。
      if (finalize._running) return;
      finalize._running = true;
      const _fb = document.getElementById('finalizeBtn');
      if (_fb) { _fb.disabled = true; _fb.textContent = '⏳ 記録中...'; }
      try {
      const { preset, daimon, qs, results, startedAt } = cur;
      const graded = results.filter(r => r.isCorrect !== null);
      const correct = graded.filter(r => r.isCorrect).length;
      const totalElapsedMs = Date.now() - startedAt;
      const perMs = graded.length ? Math.round(totalElapsedMs / graded.length) : null;
      // 記録: 小問ごとに 1 attempt (topic 単位で十分なサンプル数を弱点集計に渡す)
      const tk = token();
      const subAttempts = results.map(r => ({ sub_id: r.sub_id, unit: r.unit, is_correct: r.isCorrect === null ? null : (r.isCorrect ? 1 : 0), reason: getReason(r.qi) || null, auto_graded: r.autoGraded }));
      let recorded = 0;
      if (tk && graded.length) {
        const reqs = graded.map(r => fetch(`${BACKEND_URL}/api/question-attempts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}` },
          body: JSON.stringify({
            source: 'practice',
            exam_question_id: daimon._question_id || null,
            exam_id: preset.exam, part_key: preset.part,
            topic: r.unit || preset.topic,
            is_correct: r.isCorrect ? 1 : 0,
            elapsed_ms: perMs,
            metadata: {
              drill: true, drill_preset: preset.name, sub_id: r.sub_id, sub_unit: r.unit || null,
              reason: getReason(r.qi) || null, auto_graded: r.autoGraded,
              year_simulated: daimon.year_simulated || null
            }
          })
        }).then(res => { if (res && res.ok) recorded++; }).catch(() => {}));
        await Promise.all(reqs);
        // 🎯 [習得ループ完成 2026-06-17] 弱点リンク経由なら、採点結果を「元の弱点(subject,topic)」にも記録。
        //   写真質問由来の弱点は採点信号(is_correct)を持たず qa_attempts=0 のままで卒業不能 → ここで
        //   採点済み credit を与え、正答率80%・5問で卒業できるようにする(=ループが全弱点で閉じる)。
        //   自然単元(r.unit||preset.topic)と同 topic の小問は除外(自然POSTで計上済=二重計上防止)。
        if (tk && drillOrigin && drillOrigin.topic && graded.length) {
          const originReqs = graded
            .filter(r => (r.unit || preset.topic) !== drillOrigin.topic)
            .map(r => fetch(`${BACKEND_URL}/api/question-attempts`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}` },
              body: JSON.stringify({
                source: 'practice', exam_id: preset.exam, part_key: preset.part,
                subject: drillOrigin.subject || undefined,
                topic: drillOrigin.topic,
                is_correct: r.isCorrect ? 1 : 0,
                elapsed_ms: perMs,
                metadata: { drill: true, drill_preset: preset.name, sub_id: r.sub_id, weakness_credit: true, origin_topic: drillOrigin.topic }
              })
            }).then(() => {}).catch(() => {}));
          await Promise.all(originReqs);
        }
        // 🎯 [習得クローズドループ 2026-06-17] 記録直後に「自分の弱点だけ」を即時再集計 →
        //   毎朝の cron を待たず TOP3 / 習得(卒業)判定に反映 (解く→改善が即見える)。失敗は非致命。
        if (recorded > 0) {
          try {
            await fetch(`${BACKEND_URL}/api/student/weakness/refresh-self`, {
              method: 'POST', headers: { 'Authorization': `Bearer ${tk}` }
            });
          } catch (_) { /* noop */ }
        }
      }
      renderResult({ correct, total: graded.length, elapsedMs: totalElapsedMs, recorded, subAttempts });
      } catch (e) {
        // 万一 renderResult 等で例外が出ても、ボタンが「⏳記録中...」disabled で固まらないよう復帰させる
        if (_fb) { _fb.disabled = false; _fb.textContent = '✅ 結果を記録して弱点に反映'; }
        throw e;
      } finally {
        finalize._running = false;
      }
    }

    function renderResult({ correct, total, elapsedMs, recorded, subAttempts }) {
      document.getElementById('drillView').style.display = 'none';
      const rv = document.getElementById('resultView');
      rv.style.display = '';
      const mm = Math.floor(elapsedMs / 60000), ss = Math.floor((elapsedMs % 60000) / 1000);
      const rate = total ? Math.round((correct / total) * 100) : 0;
      // 理由集計
      const reasonCounts = {};
      subAttempts.forEach(s => { if (s.is_correct === 0 && s.reason) reasonCounts[s.reason] = (reasonCounts[s.reason] || 0) + 1; });
      const reasonLabel = { understanding: '理解不足', careless: 'ケアレスミス', time: '時間切れ', misread: '読み違い', other: 'その他' };
      const reasonHtml = Object.keys(reasonCounts).length
        ? `<div class="weak-box"><strong style="color:#d8b4fe;">つまずき傾向:</strong> ${Object.entries(reasonCounts).map(([k, v]) => `${reasonLabel[k] || k} ×${v}`).join(' / ')}</div>` : '';
      // 🎯 間違えた小問の単元集計 (小問→単元の炙り出し)
      const missedUnits = {};
      subAttempts.forEach(s => { if (s.is_correct === 0 && s.unit) missedUnits[s.unit] = (missedUnits[s.unit] || 0) + 1; });
      const unitHtml = Object.keys(missedUnits).length
        ? `<div class="weak-box" style="background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.35);"><strong style="color:#fca5a5;">🎯 弱点が出た単元:</strong> ${Object.entries(missedUnits).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${escapeHtml(k)} ×${v}`).join(' / ')}<div class="muted" style="margin-top:0.3rem;">この単元が弱点として記録され、マイページの分析に反映されます。</div></div>` : '';
      const recNote = recorded > 0
        ? `<div class="muted" style="margin-top:0.6rem;">✅ ${recorded}問分を記録しました。マイページの「🎯 弱点 TOP3」に<strong style="color:#86efac;">すぐ反映</strong>されます。正答率80%以上を5問で「習得（卒業）」になり、弱点から外れます。</div>`
        : `<div class="muted" style="margin-top:0.6rem; color:#fca5a5;">⚠️ 結果を保存できませんでした（未ログイン or 通信エラー）。マイページからログインすると弱点分析に反映されます。</div>`;
      rv.innerHTML = `<div class="result-card">
        <div class="result-score">${rate >= 80 ? '🎉' : rate >= 50 ? '👍' : '💪'} ${correct} / ${total} 問正解（${rate}%）</div>
        <div class="muted" style="margin-top:0.3rem;">所要時間: ${mm}分${String(ss).padStart(2, '0')}秒 ${cur.preset ? '／ 目安 ' + cur.preset.min + '分' : ''}</div>
        ${unitHtml}
        ${reasonHtml}
        ${recNote}
        <div class="actions" style="margin-top:1rem;">
          <button class="btn btn-primary" id="againBtn">⏱ もう1セット</button>
          <a class="btn btn-ghost" href="mypage.html">弱点をマイページで見る →</a>
          <a class="btn btn-ghost" href="nyushi-dojo.html">道場トップ</a>
        </div>
      </div>`;
      document.getElementById('againBtn').addEventListener('click', backToPresets);
    }

    function backToPresets() {
      stopTimer();
      cur = null;
      drillOrigin = null;
      document.getElementById('drillView').style.display = 'none';
      document.getElementById('resultView').style.display = 'none';
      document.getElementById('presetView').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderPresets();
    maybeAutoStartFromWeakness();  // 🎯 弱点リンク(?w_subject/w_topic)で来たら該当ドリルを自動で開く
  })();
  </script>
</body>

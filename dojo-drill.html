  <script>
  (function () {
    const BACKEND_URL = (window.location.hostname === 'localhost' && window.location.port === '8090')
      ? 'http://localhost:8000'
      : window.location.origin;

    // ───────── presets (有効な exam/part/eiken_grade の組合せのみ) ─────────
    const PRESETS = [
      { subject: '英語', name: '共通テスト 英語R 第1問（短文・対話）', exam: 'daigaku', part: 'r_short', grade: 'kyotsu', min: 10, topic: '共通テスト英語 短文・対話' },
      { subject: '英語', name: '共通テスト 英語R 長文読解', exam: 'daigaku', part: 'r_long', grade: 'kyotsu', min: 15, topic: '共通テスト英語 長文読解' },
      { subject: '国語', name: '共通テスト 現代文（評論・小説）', exam: 'daigaku', part: 'gendai', grade: 'kyotsu', min: 15, topic: '共通テスト国語 現代文' },
      { subject: '国語', name: '共通テスト 古文', exam: 'daigaku', part: 'kobun', grade: 'kyotsu', min: 12, topic: '共通テスト国語 古文' },
      { subject: '数学', name: '共通テスト 数学IA', exam: 'rikei', part: 'math_1a', grade: 'kyotsu_rikei', min: 15, topic: '共通テスト数学IA' },
      { subject: '数学', name: '共通テスト 数学IIB', exam: 'rikei', part: 'math_2b', grade: 'kyotsu_rikei', min: 15, topic: '共通テスト数学IIB' },
      { subject: '理科', name: '共通テスト 化学基礎', exam: 'rikei', part: 'chem_basic', grade: 'kyotsu_rikei', min: 12, topic: '共通テスト化学基礎' },
      { subject: '理科', name: '共通テスト 物理基礎', exam: 'rikei', part: 'phys_basic', grade: 'kyotsu_rikei', min: 12, topic: '共通テスト物理基礎' },
      { subject: '理科', name: '共通テスト 生物基礎', exam: 'rikei', part: 'bio_basic', grade: 'kyotsu_rikei', min: 12, topic: '共通テスト生物基礎' },
      { subject: '社会', name: '共通テスト 日本史', exam: 'daigaku', part: 'nihonshi', grade: 'kyotsu', min: 12, topic: '共通テスト日本史' },
      { subject: '社会', name: '共通テスト 世界史', exam: 'daigaku', part: 'sekaishi', grade: 'kyotsu', min: 12, topic: '共通テスト世界史' },
      { subject: '社会', name: '共通テスト 地理', exam: 'daigaku', part: 'chiri', grade: 'kyotsu', min: 12, topic: '共通テスト地理' },
    ];

    // ───────── 大学別 (二次・私大): 同じ bank API を eiken_grade=大学キー で利用 (サーバ改修不要) ─────────
    const _rlong = (key, name, min) => ({ exam: 'daigaku', part: 'r_long', grade: key, min, topic: `${name} 英語長文読解`, label: '英語 長文読解' });
    const _rikei = (key, name, subj, part, min) => ({ exam: 'rikei', part, grade: key, min, topic: `${name}理系 ${subj}`, label: `理系 ${subj}` });
    const UNIVERSITIES = [
      { key: 'todai', name: '東大', group: '国公立', parts: [_rlong('todai', '東大', 20), _rikei('todai_rikei', '東大', '数学', 'math_q1', 25), _rikei('todai_rikei', '東大', '物理', 'phys_q1', 25), _rikei('todai_rikei', '東大', '化学', 'chem_q1', 25)] },
      { key: 'kyodai', name: '京大', group: '国公立', parts: [_rlong('kyodai', '京大', 20), _rikei('kyodai_rikei', '京大', '数学', 'math_q1', 25), _rikei('kyodai_rikei', '京大', '物理', 'phys_q1', 25), _rikei('kyodai_rikei', '京大', '化学', 'chem_q1', 25)] },
      { key: 'osaka', name: '阪大', group: '国公立', parts: [_rlong('osaka', '阪大', 18)] },
      { key: 'nagoya', name: '名大', group: '国公立', parts: [_rlong('nagoya', '名大', 18)] },
      { key: 'tohoku', name: '東北大', group: '国公立', parts: [_rlong('tohoku', '東北大', 18)] },
      { key: 'hokudai', name: '北大', group: '国公立', parts: [_rlong('hokudai', '北大', 18)] },
      { key: 'kyushu', name: '九大', group: '国公立', parts: [_rlong('kyushu', '九大', 18)] },
      { key: 'hitotsu', name: '一橋', group: '国公立', parts: [_rlong('hitotsu', '一橋', 18)] },
      { key: 'tokoda', name: '東工大', group: '国公立', parts: [_rlong('tokoda', '東工大', 18)] },
      { key: 'kobe', name: '神戸大', group: '国公立', parts: [_rlong('kobe', '神戸大', 18)] },
      { key: 'tsukuba', name: '筑波大', group: '国公立', parts: [_rlong('tsukuba', '筑波大', 18)] },
      { key: 'waseda', name: '早稲田', group: '私立', parts: [_rlong('waseda', '早稲田', 18)] },
      { key: 'keio', name: '慶應', group: '私立', parts: [_rlong('keio', '慶應', 18)] },
      { key: 'sophia', name: '上智', group: '私立', parts: [_rlong('sophia', '上智', 18)] },
      { key: 'icu', name: 'ICU', group: '私立', parts: [_rlong('icu', 'ICU', 18)] },
      { key: 'meiji', name: '明治', group: '私立', parts: [_rlong('meiji', '明治', 15)] },
      { key: 'rikkyo', name: '立教', group: '私立', parts: [_rlong('rikkyo', '立教', 15)] },
      { key: 'doshisha', name: '同志社', group: '私立', parts: [_rlong('doshisha', '同志社', 15)] },
      { key: 'ritsumei', name: '立命館', group: '私立', parts: [_rlong('ritsumei', '立命館', 15)] },
    ];
    // 共テ + 大学別 を1配列に集約 (data-idx 共有)
    const UNIV_FLAT = [];
    UNIVERSITIES.forEach(u => u.parts.forEach(p => UNIV_FLAT.push({ ...p, univKey: u.key, univName: u.name, name: `${u.name} ${p.label}` })));
    const ALL = PRESETS.concat(UNIV_FLAT);
    const REASONS = [
      { v: '', t: '理由を選択…' },
      { v: 'understanding', t: '理解不足（知識・解法が分からなかった）' },
      { v: 'careless', t: 'ケアレスミス（分かってたのに）' },
      { v: 'time', t: '時間切れ（手が回らなかった）' },
      { v: 'misread', t: '読み違い（問題・本文の取り違え）' },
      { v: 'other', t: 'その他' },
    ];

    // ───────── helpers (university-exam.html と同一の堅牢な解決ロジック) ─────────
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    function normChoices(raw) {
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string' && raw.trim()) { try { const a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
      return [];
    }
    // 解答表記 → 0始まり index (数字/英字/丸数字/テキスト一致)。解決不能なら -1。
    function resolveAnswerIndex(raw, choices) {
      if (raw == null || !Array.isArray(choices) || choices.length === 0) return -1;
      if (typeof raw === 'boolean') return -1;
      if (typeof raw === 'number' && Number.isInteger(raw)) return (raw >= 0 && raw < choices.length) ? raw : -1;
      const s = String(raw).trim(); if (!s) return -1;
      const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫'; const ci = CIRC.indexOf(s);
      if (ci >= 0) return ci < choices.length ? ci : -1;
      if (/^\d+$/.test(s)) { const i = parseInt(s, 10); return (i >= 0 && i < choices.length) ? i : -1; }
      const m = s.match(/^[(（]?\s*([A-Ha-hＡ-Ｈ])\s*[).．）]?$/);
      if (m) { const ch = m[1]; const full = 'ＡＢＣＤＥＦＧＨ'.indexOf(ch); const i = full >= 0 ? full : (ch.toUpperCase().charCodeAt(0) - 65); return (i >= 0 && i < choices.length) ? i : -1; }
      const nrm = x => String(x).replace(/\s+/g, ''); const ns = nrm(s);
      for (let i = 0; i < choices.length; i++) {
        const cb = String(choices[i]).replace(/^\s*[(（]?[A-Ha-h]\s*[.):：）．]\s*/, '');
        if (nrm(choices[i]) === ns || nrm(cb) === ns) return i;
      }
      return -1;
    }
    function formatScientific(s) {
      let html = escapeHtml(s);
      // 案B: AI が下線部に出す <u>/<em>/<strong> を whitelist で復活 (english-exam.js と同一・模試風下線)
      html = html.replace(/&lt;u&gt;/gi, '<u class="exam-underline">').replace(/&lt;\/u&gt;/gi, '</u>');
      html = html.replace(/&lt;em&gt;/gi, '<em>').replace(/&lt;\/em&gt;/gi, '</em>');
      html = html.replace(/&lt;strong&gt;/gi, '<strong>').replace(/&lt;\/strong&gt;/gi, '</strong>');
      // 案A: 自動傍線の sentinel (<label> … ) を復元 (markUnderlines が挿入)
      html = html.replace(/(.)/g, '<u class="exam-underline" data-mark="$1">').replace(//g, '</u>');
      html = html.replace(/([A-Z][a-z]?)_(\d+)/g, '$1<sub>$2</sub>');
      html = html.replace(/\b([a-z])_(\d+)\b/g, '$1<sub>$2</sub>');
      html = html.replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>');
      html = html.replace(/\^(\d+[-+]?)/g, '<sup>$1</sup>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }
    // 🎯 [傍線部表示 2026-06-15] 本文にマークアップが無くても、設問が引用する傍線部/下線部「…」を
    //   本文中から探して下線+ラベル(A,B…)を付与する (Desktop 国語生成器と同方式・データ非改変)。
    //   sentinel を挿入し formatScientific が <u class=exam-underline data-mark> に復元。見つからなければ無処理。
    function markUnderlines(passage, qs) {
      if (!passage || !Array.isArray(qs)) return passage;
      if (/<u[ >]/i.test(passage)) return passage;   // 既に <u> markup があれば二重付与しない
      const phrases = [];
      qs.forEach(q => {
        const t = (q && q.stem) || '';
        const re = /(?:傍線部|下線部|傍線|下線)\s*[「『]([^」』\n]{2,80})[」『]?[」』]?/g;
        let m; while ((m = re.exec(t))) { const p = m[1].replace(/[」』]+$/, ''); if (p) phrases.push(p); }
      });
      if (!phrases.length) return passage;
      // 本文中の最初の出現位置を求め、出現順・非重複で採用
      const spans = [];
      phrases.forEach(ph => { const i = passage.indexOf(ph); if (i >= 0) spans.push({ start: i, end: i + ph.length, ph }); });
      if (!spans.length) return passage;
      spans.sort((a, b) => a.start - b.start || b.end - a.end);
      const chosen = []; let lastEnd = -1;
      spans.forEach(s => { if (s.start >= lastEnd) { chosen.push(s); lastEnd = s.end; } });
      let out = ''; let cur = 0;
      chosen.forEach((s, i) => {
        const label = String.fromCharCode(65 + i);
        out += passage.slice(cur, s.start) + '' + label + '' + s.ph + '';
        cur = s.end;
      });
      out += passage.slice(cur);
      return out;
    }
    const token = () => localStorage.getItem('ai_juku_session_token') || '';

    // ───────── state ─────────
    let cur = null;       // {preset, daimon(question_data), startedAt}
    let timerId = null, remainSec = 0;

    // ───────── preset view ─────────
    const presetCard = (p, dispName) => `<button class="preset" data-idx="${ALL.indexOf(p)}">
        <span><span class="preset-name">${escapeHtml(dispName)}</span><span class="preset-sub">${escapeHtml(p.topic)}</span></span>
        <span class="preset-min">${p.min}分</span>
      </button>`;

    function renderPresets() {
      let html = '';
      // 📘 共通テスト
      html += '<div class="sec-h">📘 共通テスト</div>';
      [...new Set(PRESETS.map(p => p.subject))].forEach(sub => {
        html += `<div class="subj-h">${escapeHtml(sub)}</div><div class="preset-grid">`;
        PRESETS.filter(p => p.subject === sub).forEach(p => { html += presetCard(p, p.name.replace('共通テスト ', '')); });
        html += `</div>`;
      });
      // 🎓 大学別 (二次・私大)
      html += '<div class="sec-h">🎓 大学別（二次・私大）<span class="muted" style="font-weight:normal;font-size:0.75rem;"> — 大学を選んでください</span></div>';
      ['国公立', '私立'].forEach(g => {
        html += `<div class="subj-h">${g}</div><div class="univ-chips">`;
        UNIVERSITIES.filter(u => u.group === g).forEach(u => { html += `<button class="univ-chip" data-univ="${u.key}">${escapeHtml(u.name)}</button>`; });
        html += `</div>`;
      });
      html += '<div id="univParts"></div>';
      const v = document.getElementById('presetView');
      v.innerHTML = html;
      v.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => startDrill(ALL[parseInt(b.dataset.idx, 10)])));
      v.querySelectorAll('.univ-chip').forEach(b => b.addEventListener('click', () => renderUnivParts(b.dataset.univ)));
    }

    function renderUnivParts(univKey) {
      const u = UNIVERSITIES.find(x => x.key === univKey);
      const c = document.getElementById('univParts');
      if (!u || !c) return;
      document.querySelectorAll('.univ-chip').forEach(b => b.classList.toggle('active', b.dataset.univ === univKey));
      let html = `<div class="subj-h" style="color:#6ee7b7;">${escapeHtml(u.name)} の大問を選ぶ</div><div class="preset-grid">`;
      u.parts.forEach(p => {
        const item = UNIV_FLAT.find(x => x.univKey === u.key && x.part === p.part && x.grade === p.grade);
        if (item) html += presetCard(item, p.label);
      });
      html += `</div>`;
      c.innerHTML = html;
      c.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => startDrill(ALL[parseInt(b.dataset.idx, 10)])));
      c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    async function startDrill(preset) {
      document.getElementById('presetView').style.display = 'none';
      const dv = document.getElementById('drillView');
      dv.style.display = '';
      dv.innerHTML = '<div class="loading">問題を読み込み中…</div>';
      try {
        const r = await fetch(`${BACKEND_URL}/api/exam-questions/bank?exam=${encodeURIComponent(preset.exam)}&part=${encodeURIComponent(preset.part)}&eiken_grade=${encodeURIComponent(preset.grade)}&limit=1`);
        const d = await r.json();
        const daimon = d && d.selected;
        const qs = daimon && Array.isArray(daimon.questions) ? daimon.questions.filter(q => q && q.stem) : [];
        if (!daimon || qs.length === 0) {
          dv.innerHTML = `<div class="loading">この大問はまだ準備中です。<br><button class="btn btn-ghost" id="back">← 別の大問を選ぶ</button></div>`;
          document.getElementById('back').addEventListener('click', backToPresets);
          return;
        }
        cur = { preset, daimon, qs, startedAt: Date.now() };
        renderDrill();
      } catch (e) {
        dv.innerHTML = `<div class="loading">読込エラー: ${escapeHtml(e.message)}<br><button class="btn btn-ghost" id="back">← 戻る</button></div>`;
        document.getElementById('back').addEventListener('click', backToPresets);
      }
    }

    function renderDrill() {
      const { preset, daimon, qs } = cur;
      const passage = daimon.passage || daimon.audio_script || daimon.prompt || '';
      let body = `<div class="timer-bar"><div><strong>${escapeHtml(preset.name)}</strong> <span class="muted">/ 全${qs.length}問</span></div><div class="timer" id="timer">--:--</div></div>`;
      if (passage) {
        const label = daimon.audio_script ? '【放送内容（読んで解答）】\n' : '';
        // 設問が引用する傍線部/下線部を本文中で下線+ラベル表示 (案A)
        body += `<div class="passage">${formatScientific(label + markUnderlines(passage, qs))}</div>`;
      }
      qs.forEach((q, qi) => {
        const choices = normChoices(q.choices);
        const isMC = choices.length > 0;
        body += `<div class="q-block" data-qi="${qi}">
          <div class="q-stem">問${qi + 1}. ${formatScientific(q.stem)}</div>`;
        if (isMC) {
          body += `<div class="choices">` + choices.map((c, ci) =>
            `<div class="choice" data-qi="${qi}" data-ci="${ci}"><span class="choice-key">${String.fromCharCode(65 + ci)}.</span><span>${formatScientific(c)}</span></div>`
          ).join('') + `</div>`;
        } else {
          body += `<div class="q-free"><textarea placeholder="解答を入力（記述・自己採点）" data-qi="${qi}"></textarea></div>`;
        }
        body += `<div class="selfmark" data-qi="${qi}" style="display:none;"></div>
          <div class="reason" data-qi="${qi}"></div>
          <div class="expl" data-qi="${qi}"></div>
        </div>`;
      });
      body += `<div class="actions"><button class="btn btn-primary" id="gradeBtn">📝 採点する</button><button class="btn btn-ghost" id="quitBtn">← やめて戻る</button></div>`;
      const dv = document.getElementById('drillView');
      dv.innerHTML = body;

      // choice select
      dv.querySelectorAll('.choice').forEach(el => el.addEventListener('click', () => {
        const qi = el.dataset.qi;
        dv.querySelectorAll(`.choice[data-qi="${qi}"]`).forEach(c => c.classList.remove('sel'));
        el.classList.add('sel');
      }));
      document.getElementById('gradeBtn').addEventListener('click', () => grade(false));
      document.getElementById('quitBtn').addEventListener('click', () => { stopTimer(); backToPresets(); });
      startTimer(preset.min * 60);
    }

    function startTimer(sec) {
      remainSec = sec;
      const el = document.getElementById('timer');
      const tick = () => {
        const m = Math.floor(remainSec / 60), s = remainSec % 60;
        el.textContent = `${m}:${String(s).padStart(2, '0')}`;
        el.classList.toggle('warn', remainSec <= 120 && remainSec > 30);
        el.classList.toggle('danger', remainSec <= 30);
        if (remainSec <= 0) { stopTimer(); grade(true); return; }
        remainSec--;
      };
      tick();
      timerId = setInterval(tick, 1000);
    }
    function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

    function grade(timeUp) {
      stopTimer();
      const dv = document.getElementById('drillView');
      const { qs, preset } = cur;
      cur.results = [];
      qs.forEach((q, qi) => {
        const choices = normChoices(q.choices);
        const isMC = choices.length > 0;
        const block = dv.querySelector(`.q-block[data-qi="${qi}"]`);
        const exEl = block.querySelector(`.expl[data-qi="${qi}"]`);
        const smEl = block.querySelector(`.selfmark[data-qi="${qi}"]`);
        const reasonEl = block.querySelector(`.reason[data-qi="${qi}"]`);
        let isCorrect = null, autoGraded = false, correctIdx = -1;
        if (isMC) {
          correctIdx = resolveAnswerIndex(q.answer, choices);
          const selEl = block.querySelector(`.choice[data-qi="${qi}"].sel`);
          const userIdx = selEl ? parseInt(selEl.dataset.ci, 10) : -1;
          block.querySelectorAll(`.choice[data-qi="${qi}"]`).forEach(c => {
            const ci = parseInt(c.dataset.ci, 10); c.style.cursor = 'default';
            if (correctIdx >= 0 && ci === correctIdx) c.classList.add('correct');
            else if (ci === userIdx) c.classList.add('wrong');
          });
          if (correctIdx >= 0 && userIdx >= 0) { isCorrect = (userIdx === correctIdx); autoGraded = true; }
        }
        // 解説 + 正答表示
        const ansText = (isMC && correctIdx >= 0) ? `${String.fromCharCode(65 + correctIdx)}. ${formatScientific(choices[correctIdx])}` : formatScientific(String(q.answer == null ? '' : q.answer));
        exEl.innerHTML = `<div class="expl-ans">正解: ${ansText}</div>${q.explanation ? `<div style="margin-top:0.3rem;">${formatScientific(q.explanation)}</div>` : ''}`;
        exEl.classList.add('show');
        // 自己採点 (自動採点できない記述/未選択) → ○×ボタン
        if (!autoGraded) {
          smEl.style.display = 'flex';
          smEl.innerHTML = `<span class="muted">自己採点:</span><button data-m="correct">⭕ 正解</button><button data-m="wrong">❌ 不正解</button>`;
          smEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
            const mk = btn.dataset.m;
            cur.results[qi].isCorrect = (mk === 'correct');
            smEl.querySelectorAll('button').forEach(b => b.classList.remove('on-correct', 'on-wrong'));
            btn.classList.add(mk === 'correct' ? 'on-correct' : 'on-wrong');
            toggleReason(qi, mk === 'wrong');
            updateFinalizeHint();
          }));
        }
        // 理由 select (不正解時に表示)
        reasonEl.innerHTML = `<span class="muted">つまずき理由:</span> <select data-qi="${qi}">${REASONS.map(r => `<option value="${r.v}">${r.t}</option>`).join('')}</select>`;
        reasonEl.querySelector('select').addEventListener('change', updateFinalizeHint);
        if (autoGraded && isCorrect === false) reasonEl.classList.add('show');

        cur.results[qi] = { qi, sub_id: q.id || `q${qi + 1}`, isMC, isCorrect, autoGraded, correctIdx };
      });
      // 採点後のフッタ: 確定ボタン
      const act = dv.querySelector('.actions');
      act.innerHTML = `<button class="btn btn-primary" id="finalizeBtn">✅ 結果を記録して弱点に反映</button><button class="btn btn-ghost" id="quitBtn2">← やめて戻る</button>
        <div class="muted" id="finalizeHint" style="width:100%; margin-top:0.3rem;"></div>`;
      document.getElementById('finalizeBtn').addEventListener('click', finalize);
      document.getElementById('quitBtn2').addEventListener('click', backToPresets);
      if (timeUp) { const tb = document.querySelector('.timer'); if (tb) { tb.textContent = '時間切れ'; tb.classList.add('danger'); } }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateFinalizeHint();
    }

    function toggleReason(qi, show) {
      const r = document.querySelector(`.reason[data-qi="${qi}"]`);
      if (r) r.classList.toggle('show', show);
    }
    function getReason(qi) {
      const sel = document.querySelector(`.reason[data-qi="${qi}"] select`);
      return sel ? sel.value : '';
    }
    function updateFinalizeHint() {
      // 不正解なのに理由未選択の小問数
      const pending = cur.results.filter(r => r.isCorrect === false && !getReason(r.qi)).length;
      const ungraded = cur.results.filter(r => r.isCorrect === null).length;
      const hint = document.getElementById('finalizeHint');
      if (!hint) return;
      if (ungraded > 0) hint.textContent = `※ ${ungraded}問が未採点です（⭕/❌ をタップ）。そのまま記録もできます。`;
      else if (pending > 0) hint.textContent = `💡 不正解 ${pending}問の「つまずき理由」を選ぶと、弱点分析がより深くなります（任意）。`;
      else hint.textContent = '記録の準備ができました。';
    }

    async function finalize() {
      const { preset, daimon, qs, results, startedAt } = cur;
      const graded = results.filter(r => r.isCorrect !== null);
      const correct = graded.filter(r => r.isCorrect).length;
      const totalElapsedMs = Date.now() - startedAt;
      const perMs = graded.length ? Math.round(totalElapsedMs / graded.length) : null;
      // 記録: 小問ごとに 1 attempt (topic 単位で十分なサンプル数を弱点集計に渡す)
      const tk = token();
      const subAttempts = results.map(r => ({ sub_id: r.sub_id, is_correct: r.isCorrect === null ? null : (r.isCorrect ? 1 : 0), reason: getReason(r.qi) || null, auto_graded: r.autoGraded }));
      let recorded = 0;
      if (tk && graded.length) {
        const reqs = graded.map(r => fetch(`${BACKEND_URL}/api/question-attempts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}` },
          body: JSON.stringify({
            source: 'practice',
            exam_question_id: daimon._question_id || null,
            exam_id: preset.exam, part_key: preset.part,
            topic: preset.topic,
            is_correct: r.isCorrect ? 1 : 0,
            elapsed_ms: perMs,
            metadata: {
              drill: true, drill_preset: preset.name, sub_id: r.sub_id,
              reason: getReason(r.qi) || null, auto_graded: r.autoGraded,
              year_simulated: daimon.year_simulated || null
            }
          })
        }).then(res => { if (res && res.ok) recorded++; }).catch(() => {}));
        await Promise.all(reqs);
      }
      renderResult({ correct, total: graded.length, elapsedMs: totalElapsedMs, recorded, subAttempts });
    }

    function renderResult({ correct, total, elapsedMs, recorded, subAttempts }) {
      document.getElementById('drillView').style.display = 'none';
      const rv = document.getElementById('resultView');
      rv.style.display = '';
      const mm = Math.floor(elapsedMs / 60000), ss = Math.floor((elapsedMs % 60000) / 1000);
      const rate = total ? Math.round((correct / total) * 100) : 0;
      // 理由集計
      const reasonCounts = {};
      subAttempts.forEach(s => { if (s.is_correct === 0 && s.reason) reasonCounts[s.reason] = (reasonCounts[s.reason] || 0) + 1; });
      const reasonLabel = { understanding: '理解不足', careless: 'ケアレスミス', time: '時間切れ', misread: '読み違い', other: 'その他' };
      const reasonHtml = Object.keys(reasonCounts).length
        ? `<div class="weak-box"><strong style="color:#d8b4fe;">つまずき傾向:</strong> ${Object.entries(reasonCounts).map(([k, v]) => `${reasonLabel[k] || k} ×${v}`).join(' / ')}</div>` : '';
      const recNote = recorded > 0
        ? `<div class="muted" style="margin-top:0.6rem;">✅ ${recorded}問分を記録しました。マイページの「🎯 弱点 TOP3」に反映されます（毎朝集計）。</div>`
        : `<div class="muted" style="margin-top:0.6rem; color:#fca5a5;">⚠️ 結果を保存できませんでした（未ログイン or 通信エラー）。マイページからログインすると弱点分析に反映されます。</div>`;
      rv.innerHTML = `<div class="result-card">
        <div class="result-score">${rate >= 80 ? '🎉' : rate >= 50 ? '👍' : '💪'} ${correct} / ${total} 問正解（${rate}%）</div>
        <div class="muted" style="margin-top:0.3rem;">所要時間: ${mm}分${String(ss).padStart(2, '0')}秒 ${cur.preset ? '／ 目安 ' + cur.preset.min + '分' : ''}</div>
        ${reasonHtml}
        ${recNote}
        <div class="actions" style="margin-top:1rem;">
          <button class="btn btn-primary" id="againBtn">⏱ もう1セット</button>
          <a class="btn btn-ghost" href="mypage.html">弱点をマイページで見る →</a>
          <a class="btn btn-ghost" href="nyushi-dojo.html">道場トップ</a>
        </div>
      </div>`;
      document.getElementById('againBtn').addEventListener('click', backToPresets);
    }

    function backToPresets() {
      stopTimer();
      cur = null;
      document.getElementById('drillView').style.display = 'none';
      document.getElementById('resultView').style.display = 'none';
      document.getElementById('presetView').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderPresets();
  })();
  </script>
</body>
</html>

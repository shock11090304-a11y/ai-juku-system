<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>神テスト お申し込み完了</title>
<style>
  :root { --bg:#0e1116; --panel:#151a22; --line:#2a3240; --fg:#e7ecf3;
          --muted:#93a0b3; --accent:#3b82f6; --ok:#22c55e; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.7 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; color: var(--ok); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin: 20px 0; color: var(--muted); font-size: 14px; }
  a.btn { display: inline-block; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 8px; padding: 12px 20px; text-decoration: none; margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>お申し込みありがとうございます</h1>
  <div class="card">
    <p>お支払い（無料体験の開始）の確認が取れ次第、ログインできるようになります。
       ふつうは <b>1分以内</b>です。</p>
    <p>お申し込みのときに決めた<b>メールアドレスとパスワード</b>でログインしてください。
       領収書は Stripe（決済会社）からメールで届きます。</p>
    <p>ログインできない場合は、少し待ってからもう一度お試しください。
       それでも入れないときは <a href="/legal.html">こちらの連絡先</a> までご連絡ください。</p>
  </div>
  <a class="btn" href="/exam-book.html">ログインして始める</a>
</main>
</body>
</html>
